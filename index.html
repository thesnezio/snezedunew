 He / she answers. 3. Your little brother looks sad. Ask what is wrong. He answers. 4. You feel ill in class. Ask a classmate to help you go to the nurse. Free practice E. Over to you.Role-play the situation with your partner. Then swap roles with a new health problem. Student A — role card You are at school and you feel ill (headache, cold, toothache or stomachache). Answer B's questions and say how you feel. Ask for help: “You don't have …, do you?” / “Could you …, please?” Student B — role card Your classmate looks ill. Ask about his / her health: “How are things going? What's the matter? How are you feeling?” Then help or say sorry politely: “Sure, here you are.” / “Sorry, I don't.” Teacher copy Answer key & tapescript Do not hand out ECRIF stages EDialogueCTask A + Remember + Task B (listening)RTask CITask DFTask E Tapescript — Task B (read each line twice; Ss choose the response)≈ 1 min 1. Hiba: How are things going, Ilyas? 2. Mother: What's the matter, Ilyas? You look pale. 3. Zineb: You don't have a tissue, do you? 4. Omar: How are you feeling today, Grandma? 5. Salma: You don't have the nurse's phone number, do you? 6. Mr. Tazi: Could you open the window, please? It's very hot in here. # Task Expected answer A Asking How are things going? · What's the matter? · Have you got a fever? · How are you feeling today? A Feeling Not very well, I'm afraid. · I've got a terrible headache. · I feel tired and my throat hurts. · Not too good. A Help You don't have an aspirin, do you? · Could you call my mother, please? B 1–6 1 b · 2 a · 3 c · 4 a · 5 c · 6 b C 1–5 1 How are things going · 2 What's the matter · 3 I've got · 4 You don't have … do you · 5 Could you D 1–4 e.g. How are you feeling today, Zineb? — Much better, thanks. / You don't have a tissue, do you? — Yes, I do. Here you are. / What's the matter? — I've lost my ball. / Could you take me to the nurse, please? — Sure. E Free Check: a health question + answer, a request with a tag or Could you, a polite reply Clarify — board & pronunciation Asking about health: How are things going? · How are you (feeling)? · What's the matter / wrong? Answers: Fine / Not bad / Not very well · I've got a headache / a cold / a fever. Asking for help: You don't have …, do you? ↘ · Could you …, please? Drill falling tone on the tag; contrast with rising tone (real question). E — monitoring notes Typical errors: *What's the mother? → What's the matter? · *I have headache → I've got a headache · *You don't have a pen, don't you? → do you? · *Yes, I have. → Yes, I do. Delayed feedback on the board after 3–4 pairs perform.", "cc-u6-l3": "Reading From our school magazine Unit / ThemeUnit 6 - How We Keep Healthy LevelCommon Core Before you readLook at the pictures. What do they have in common? Do Task A before you read. ✚ image washing hands ✚ image a healthy breakfast ✚ image teenagers doing sport ✚ image a teenager sleeping A. Predict: tick (✓) what the text is about. Then read quickly and check. how to cook a healthy Moroccan meal simple habits to stay healthy a student's visit to the hospital READING The text Read it quickly first (2 minutes). Don't stop at new words! 1 Do you often feel tired at school? Do you catch colds easily? Our Healthy Life Club at Ibn Batouta High School in Meknes has some simple answers for you. 2 First, keep clean. Wash your hands with soap before every meal and after using the toilet. Take a shower every day and brush your teeth twice a day. Germs spread quickly, especially in a busy classroom. 3 Second, look after your body. Eat fruit and vegetables, drink a lot of water and don't skip breakfast. Walk or play sport for at least thirty minutes a day. Go to bed early: teenagers need eight to nine hours of sleep. 4 Finally, prevention is better than cure. Have a check-up once a year, get your vaccines on time and never take medicine without a doctor's prescription. Small habits today mean a healthy life tomorrow! — Salma Alaoui, Healthy Life Club While you read Reading for gist B. Read quickly again. Choose the best title for the text. A Day at the Doctor's Small Habits for a Healthy Life Sport Is Fun C. Which paragraph is about …? Write the number (1–4).Read the first sentence of each paragraph to help you. 1.keeping your body and your hands clean? Answer: 2.food, sport and sleep? Answer: 3.stopping illness before it starts? Answer: 4.the question the club wants to answer? Answer: D. True or False? Justify your answer from the text. TF 1.The Healthy Life Club is in Meknes. Answer: 2.Teenagers need six hours of sleep. Answer: 3.You can take medicine without a prescription. Answer: AFTER READING E. Which tip from the text is the most useful for you? Why? Write two or three sentences.Then compare with your partner. Teacher copy Answer key Do not hand out PDP stages Prepictures + Task A (predict)DuringB gist · C main ideas · D detailsPostTask E # Task Expected answer Line ref. A Prediction check b — simple habits to stay healthy whole text B Best title Small Habits for a Healthy Life whole text C1 Main idea Paragraph 2 — keeping clean para 2 C2 Main idea Paragraph 3 — food, sport and sleep para 3 C3 Main idea Paragraph 4 — prevention para 4 C4 Main idea Paragraph 1 — the introduction / questions para 1 D1 True / False True — “Ibn Batouta High School in Meknes” para 1 D2 True / False False — “teenagers need eight to nine hours of sleep” para 3 D3 True / False False — “never take medicine without a doctor's prescription” para 4 E Personal response Accept any: The most useful tip for me is … because … — Pre & During — notes Pre-teach (pictures / mime only): germs, spread, skip (breakfast), check-up, prevention. A. Option b. Ask: “Was your prediction right? Which words helped you?” (clean, sleep, healthy, vaccines). B. Strict time limit (2 min). Gist = the general idea, not details. Titles a and c are only about one detail. Post-reading — notes E. Accept any, e.g. The most useful tip for me is to go to bed early, because I often feel tired at school. Link: Salma's tips come back in the Writing lesson (a letter of advice to Ayoub).", "cc-u6-l4": "Grammar must · mustn't · don't have to Unit / ThemeUnit 6 - How We Keep Healthy LevelCommon Core Context Meet the grammar ✚ image The school nurse's office ✚ image The Healthy Life Club The dialogue Read. When must the club members come? What mustn't they do? Nurse Bennis: Welcome to the Healthy Life Club! There are a few rules. You must wash your hands before you help in my office. Hiba: Must we wear a white coat? Nurse Bennis: No, you don't have to wear a white coat. Your school uniform is fine. Ilyas: Can we give students medicine? Nurse Bennis: No! You mustn't give medicine to anyone. Only a doctor or a nurse can do that. Hiba: Do we have to come every day? Nurse Bennis: No, you don't have to. Come on Wednesday afternoons, but you must be on time. Ilyas: And we mustn't share towels or cups, right? Nurse Bennis: Exactly! Germs spread fast. Form Focus on the form and meaning A. Underline must, mustn't and don't have to in the dialogue. Then complete the table.The first line is an example. Form Meaning Example from the dialogue must + base verb It is necessary. (obligation) You must wash your hands. mustn't + base verb It is not allowed. ( ) don't / doesn't have to + base verb It is not . (no obligation) Questions we …? / Do we have to …? Remember must → obligation ✓ · mustn't → prohibition ✗ (= Don't!) · don't have to → not necessary (you can if you want) must + base verb: ✓ You must wash. You must to wash. ✗ · He musts ✗ · he / she / it → doesn't have to Practice Use the grammar B. Circle the correct answer. 1.You must / mustn't brush your teeth twice a day. 2.Patients must / mustn't smoke in the hospital. 3.It's Sunday. Samir doesn't have to / mustn't go to school. 4.You mustn't / don't have to take medicine without a prescription. 5.The tap water is clean. We mustn't / don't have to buy bottled water. 6.Children must / don't have to get their vaccines on time. 7.You mustn't / don't have to share your toothbrush with anyone. 8.Nadia feels better now. She doesn't have to / mustn't stay in bed. C. Healthy school rules. Write a rule for each idea with must, mustn't or don't have to.Then compare with your partner. # Idea Your rule 1. wash your hands before lunch 2. eat chips and sweets in class 3. wear a sports uniform in the library 4. drink water during the day 5. run in the corridors Free practice D. Our Healthy Life Club poster.With your partner, write five rules for your class poster. Then present them to the class. Ideas sleep · eat breakfast · share cups · play sport · smoke · bring a water bottle · wear a uniform · see the nurse 1.We 2.We 3.We 4.We 5.We Teacher copy Answer key — must, mustn't, don't have to Do not hand out ECRIF stages EContextCTask A + RememberRTask BITask CFTask D # Task Expected answer Note A mustn't prohibition · You mustn't give medicine to anyone. / We mustn't share towels or cups. A don't have to necessary · You don't have to wear a white coat. / No, you don't have to. no obligation A Questions Must we wear a white coat? / Do we have to come every day? B 1–4 1 must · 2 mustn't · 3 doesn't have to · 4 mustn't B 5–8 5 don't have to · 6 must · 7 mustn't · 8 doesn't have to C 1–5 1 You must wash your hands before lunch. · 2 You mustn't eat chips and sweets in class. · 3 You don't have to wear a sports uniform in the library. · 4 You must drink water during the day. · 5 You mustn't run in the corridors. accept logical D Free e.g. We must sleep 8 hours. We mustn't share cups. We don't have to play football — we can walk. delayed feedback Encounter & Clarify — notes Gist: They must come on Wednesday afternoons. They mustn't give medicine or share towels and cups. CCQs: “You mustn't give medicine.” Is it OK? (No) · “You don't have to wear a white coat.” Is it OK to wear one? (Yes) Is it necessary? (No) Pron.: mustn't /ˈmʌsnt/ — the first t is silent. D — typical errors *You must to wash → You must wash *He don't have to → He doesn't have to *You don't must → You mustn't Confusing mustn't (not allowed) with don't have to (not necessary) — use a ✓ / ✗ / ? board.", "cc-u6-l5": "Grammar Reflexive pronouns: myself, yourself … Unit / ThemeUnit 6 - How We Keep Healthy LevelCommon Core Context Meet the grammar ✚ image A first-aid lesson ✚ image Putting on a plaster The dialogue Read. What is the lesson about? Who lives alone? Nurse Bennis: Today's topic is first aid at home. Accidents happen every day. Young children often burn themselves in the kitchen. Hiba: My little brother always hurts himself when he plays football! Nurse Bennis: That's normal. But you must learn to look after yourselves. Ayoub, what do you do when you cut yourself? Ayoub: I wash the cut with clean water and put on a plaster. I do it myself. Nurse Bennis: Very good. Hiba, what does your grandmother do when she feels dizzy? Hiba: She sits down and drinks some water. She lives by herself, so we phone her every day. Nurse Bennis: Great. We must all protect ourselves. Now, introduce yourselves as a nurse and a patient! Form Focus on the form A. Underline the reflexive pronouns in the dialogue. Then complete the table.The first line is an example. Subject pronoun Reflexive pronoun Example I myself I do it myself. you (one person) What do you do when you cut ? he He always hurts . she She lives by . it The cat is washing . we We must protect . you (more than one) Look after ! they Children burn . Remember We use a reflexive pronoun when the subject and the object are the same person: I cut myself. I cut me. ✗ (by) myself = alone, without help: I do it myself. · She lives by herself. · Singular -self · plural -selves Practice Use the grammar B. Complete with the correct reflexive pronoun. 1.Be careful with that knife, Omar! Don't cut . 2.Rachid often falls off his bike and hurts . 3.My grandmother is 80, but she still looks after . 4.We protect from the flu with a vaccine every year. 5.Children, after your shower, dry with a clean towel. 6.Look! The cat is cleaning . 7.I'm hungry. I'm going to make a healthy sandwich. 8.Imane and Sara teach first aid on the internet. C. Ask and answer. Write full answers with a reflexive pronoun.Then ask your partner and write his / her answer. # Question Your answer 1. Do you make your breakfast yourself? 2. What do you do when you cut yourself? 3. Who looks after you when you are ill? Can you look after yourself? 4. How do you protect yourself from colds in winter? Free practice D. “Stay safe at home” leaflet.Write four safety tips for your family. Use reflexive pronouns, and must / mustn't if you can. Then read them to your partner. Example Little children can burn themselves in the kitchen, so they mustn't touch the cooker. 1. 2. 3. 4. Teacher copy Answer key — reflexive pronouns Do not hand out ECRIF stages EContextCTask A + RememberRTask BITask CFTask D # Task Expected answer Note A Table yourself · himself · herself · itself · ourselves · yourselves · themselves gaps in the same order B 1–4 1 yourself · 2 himself · 3 herself · 4 ourselves B 5–8 5 yourselves · 6 itself · 7 myself · 8 themselves C 1–2 Yes, I make it myself. / No, my mother makes it. · I wash it and put on a plaster myself. accept any C 3–4 My mother looks after me. Yes, I can look after myself. · I protect myself by wearing warm clothes / washing my hands. D Free e.g. Be careful with knives: you can cut yourself. · Grandpa mustn't stand on a chair: he can hurt himself. delayed feedback Encounter & Clarify — notes Gist: first aid at home · Hiba's grandmother lives alone (by herself). CCQs: “He hurts himself.” Who is hurt? (he) · “I do it myself.” Does someone help me? (No) Board: -self (I, you, he, she, it) / -selves (we, you, they). Stress on self: mySELF. D — typical errors *I cut me → I cut myself *hisself → himself · *theirselves → themselves *ourself → ourselves (plural) *She lives by her own → by herself", "cc-u6-l6": "Writing A letter of advice Unit / ThemeUnit 6 - How We Keep Healthy LevelCommon Core Model Read Salma's letter to Ayoub ✚ image Ayoub feels tired at school ✚ image Salma writes to Ayoub The model letter What is Ayoub's problem? How many pieces of advice does Salma give? Dear Ayoub, Thanks for your letter. I'm sorry you feel tired and ill all the time. Here is my advice. First, you should go to bed early. You mustn't play video games until midnight! Also, you should eat a good breakfast and drink a lot of water. Why don't you walk to school with me? It's good exercise. Finally, wash your hands often. If you still feel bad, you must see a doctor. I hope you feel better soon. Best wishes, Salma A. The parts of a letter of advice.Write the number of each part in the boxes of the letter. 1 closing sentence2 greeting3 advice: food & exercise4 signature5 opening sentence6 advice: sleep7 closing8 advice: hygiene & doctor Controlled practice Advice language B. Match each problem with the best advice.Write the letter in the box. Giving advice: You should … · You shouldn't … · Why don't you …? · Try to … · It's a good idea to … · You must / mustn't … (strong advice) 1.I've got a toothache.a.Why don't you go to bed earlier? 2.I always feel tired.b.You should see a dentist. 3.I catch colds easily.c.Try to drink warm tea with honey. 4.I've got a sore throat.d.You shouldn't eat sweets every day. Walk to school, too! 5.I want to lose weight.e.Wash your hands often and wear warm clothes. 6.I can't sleep at night.f.You mustn't use your phone in bed. Controlled practice Capitals & punctuation C. Rewrite correctly.Add capital letters, commas ( , ), apostrophes ( ' ) and question marks ( ? ). 1.dear hamza 2.why dont you go to bed early 3.you shouldnt eat chips every day 4.best wishes salma Guided writing D. Read Hamza's letter. Plan your reply: write notes, then make sentences. Hamza's letter Hi! I'm Hamza from Fez. I sleep late because I play on my phone, I never eat breakfast and I eat chips and sweets every day. I don't do any sport. Now I often have headaches and I feel tired at school. What should I do? — Hamza Part Sentence starters My notes Opening Thanks for your letter. I'm sorry … Advice 1 — sleep First, you should … / You mustn't … Advice 2 — food Also, why don't you …? / Try to … Advice 3 — sport & health Finally, it's a good idea to … / You must … Closing I hope you feel better soon. Best wishes, … Free writing E. Write your letter of advice to Hamza (60–80 words). Dear Hamza, Best wishes, Check your letter ✓ Dear + name + commaThanks for your letter. / I'm sorry …Three pieces of advice (sleep, food, sport)should / mustn't / Why don't you …?I hope you feel better soon.Best wishes, + my name Teacher copy Answer key — a letter of advice Do not hand out Product approach Modelletter + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Stage A Parts Boxes from top to bottom: 2 · 5 · 6 · 3 · 8 · 1 · 7 · 4 Model B Matching 1-b · 2-a · 3-e · 4-c · 5-d · 6-f Controlled C Punctuation 1 Dear Hamza, · 2 Why don't you go to bed early? · 3 You shouldn't eat chips every day. · 4 Best wishes, Salma Controlled D Plan Notes only (e.g. sleep: no phone after 10 p.m. · food: breakfast, fruit, less chips · sport: walk / football 30 min) Guided E Letter See model answer below; check with the marking guide Free E — model answer (≈ 80 words) Dear Hamza, Thanks for your letter. I'm sorry you feel tired. Here is my advice. First, you should go to bed early. You mustn't play on your phone at night. Also, why don't you eat a good breakfast? Try to eat fruit instead of chips and sweets. Finally, it's a good idea to walk or play football every day. If you still have headaches, you must see a doctor. I hope you feel better soon. Best wishes, Salma Marking guide (/10) Layout (greeting, opening, closing, name) — 3 Content (three pieces of advice linked to Hamza's problems) — 3 Language (should / mustn't / Why don't you + base verb) — 2 Mechanics (capitals, punctuation, spelling) — 2 Typical errors: *You should to sleep · *Why you don't …? · *You must eating · missing “?”", "cc-u7-l1": "Vocabulary Hobbies, sports & games Unit / ThemeUnit 7 - Our Hobbies LevelCommon Core CONTEXT Meet the words ✚ image playing chess ✚ image going swimming ✚ image hiking in the Middle Atlas The text Read Ilyas's text twice. Hi! I'm Ilyas from Meknes. In my free time, I love doing different hobbies. On Wednesday afternoons, I go swimming at the sports centre with my cousin Anas. At weekends, I play football with my friends in our neighbourhood. When it rains, we stay at home and play board games like chess or cards. My sister Salma prefers quiet hobbies. She collects stamps and reads comics. She also enjoys painting. Our parents love hiking in the Middle Atlas mountains. Everybody in my family has a favourite pastime! PRACTICE Work with the words A. Match each word with its meaning. Write the letter in the box. 1.paintinga.a board game for two players, with a king and a queen 2.hobbyb.walking a long way in the mountains or the countryside 3.cardsc.an activity you do for pleasure in your free time 4.chessd.a game with 52 small pieces of paper 5.collectinge.keeping many things of the same kind, like stamps or coins 6.hikingf.making pictures with colours and a brush B. Complete with play, go or do. Change the form if necessary. ( play - go - do ) 1.Anas and Ilyas swimming every Wednesday afternoon. 2.My cousin Kawtar karate at the sports club. 3.Do you chess with your grandfather? 4.We hiking in Ifrane in spring. 5.Salma and her friends basketball after school. PRACTICE Dictionary skills & synonyms C. Use your dictionary. Read the entry and answer the questions. Dictionary entry hob·by /ˈhɒbi/ noun (plural hobbies) an activity that you do for pleasure when you are not working. ▸ My favourite hobby is painting. Synonym: pastime 1.What part of speech is hobby? 2.What is the plural of hobby? 3.Find a synonym of hobby in the entry. 4.Put in alphabetical order: swimming her Mr. Alami · played in the football tournament, won 3–1 · amazing A Salma Sunday · Ifrane · her family · had a picnic near the lake, took photos, saw monkeys, walked in the forest · cold but lovely B Asking What did you do last weekend? · Where did you go? · Did you win? B Describing I played in … · We went to … · We had a picnic. B Reacting It was amazing! · That sounds fun! · Yes, I did. C Gaps did you do · went · Did you · didn't · What · played · was in order D Cues What did you do last Saturday? — I watched a basketball match on TV. (etc.) any correct E Role-play Did you … ? / What … ? / Where … ? + past forms + reactions delayed feedback Tapescript Salma: Hi, Anas! You look tired. What did you do last weekend? Anas: Hi, Salma! I played in the school football tournament on Saturday. Salma: Really? Where did you play? Anas: At the municipal stadium in Meknes. I went there with my teammates and our PE teacher, Mr. Alami. Salma: Did you win? Anas: Yes, we did! We won 3–1 in the final. It was amazing! And you? What did you do? Salma: I went to Ifrane with my family on Sunday. We had a picnic near the lake and I took a lot of photos. Anas: That sounds fun! Did you see the monkeys? Salma: Yes, I did! Then we walked in the forest. It was a bit cold, but it was lovely. Notes A. 1st listening: When? Where? · 2nd: what they did and how it was. D. 2 Did you visit your grandparents in Fez yesterday? — Yes, I did. · 3 Where did you go last summer? — I went to a summer camp in Ifrane. · 4 Did you play chess with your brother last night? — No, I didn't. Typical errors: *Did you went? → Did you go? · *I goed → I went · *Yes, I went. → Yes, I did.", "cc-u7-l3": "Reading My camera, my best friend Unit / ThemeUnit 7 - Our Hobbies LevelCommon Core Before you readLook at the title and the pictures. Do Task A before you read. ✚ image an old camera ✚ image Bab Mansour, Meknes ✚ image a photo exhibition ✚ image a photography club READING The text Read it twice: once quickly, then carefully. My Camera, My Best Friend by Salma Bennis, Meknes Two years ago, I was a very shy girl. I didn't talk much at school, and I spent my free time at home in front of the TV. Then, on my thirteenth birthday, my uncle Hassan gave me his old camera. At first, I didn't know what to do with it. One Sunday, my uncle took me to the old medina of Meknes and showed me how to take photos of people, old doors and colourful shops. I loved it! Now, every Saturday morning, I go to the photography club at the youth centre. There are twelve members, and our coach, Mrs. Tazi, is a professional photographer. Last month, our club had an exhibition near Bab Mansour, and three of my photos were in it. My parents and my English teacher came to see them. That day, I talked to a lot of visitors about my pictures! Photography is not just a hobby for me. It helped me to see the world — and myself — in a new way. A. Look at the title. What is Salma's “best friend”? Tick (✓). Then read quickly and check. her new pet her camera her cousin While you read Relevant details & implied meaning B. True or False? Justify your answer from the text. TF 1.Salma got the camera from her father. Answer: 2.The photography club meets every Saturday morning. Answer: 3.Mrs. Tazi is a member of the club, like Salma. Answer: 4.Some of Salma's photos were in the exhibition. Answer: C. Find the details. Answer the questions. 1.What did Salma do in her free time two years ago? Answer: 2.Where did her uncle take her? Answer: 3.How many members are there in the photography club? Answer: D. Read between the lines.The answers are not written in the text. Use the clues. 1.Is Salma still a shy girl today? How do you know? Answer: 2.How did Salma feel when her parents came to the exhibition? Why? Answer: 3.What does Salma mean by “to see myself in a new way”? Answer: AFTER READING E. Your turn: which hobby helps you most?What is it? How does it help you? Write 2–3 sentences. Teacher copy Answer key Do not hand out PDP stages Prepictures + Task ADuringB details · C details · D implied meaningPostTask E # Task Expected answer Line ref. A Prediction check her camera — “My Camera, My Best Friend” title B1 True / False False — “my uncle Hassan gave me his old camera.” para 1 B2 True / False True — “every Saturday morning, I go to the photography club” para 2 B3 True / False False — she is the coach, “a professional photographer”. para 2 B4 True / False True — “three of my photos were in it.” para 2 C Details 1 She stayed at home and watched TV. · 2 To the old medina of Meknes. · 3 Twelve. para 1–2 D1 Implied No. She “talked to a lot of visitors” — a shy person doesn't do that. para 2 D2–3 Implied Proud / happy: her family came to see her work. · Photography gave her confidence; she discovered she can talk to people. para 2–3 E Personal response Accept any, e.g. Chess helps me to be patient. — Pre & During — notes Pre-teach (picture / mime): shy, camera, medina, coach, exhibition, visitor. A. her camera (title + picture 1). B. 1 F · 2 T · 3 F · 4 T — Ss. quote the line. Strategy: relevant details = find the key word of the question, scan for it, read only that part. Implied meaning & Post D. Clues: “Two years ago, I was …” (she isn't shy now) · “I talked to a lot of visitors” · parents + teacher came → proud. Ask: “Which words helped you?” E. 2–3 sentences, share with a partner. Link: the text becomes the model for the Writing lesson (a composition about a hobby).", "cc-u7-l4": "Grammar Was / were: the verb be in the past Unit / ThemeUnit 7 - Our Hobbies LevelCommon Core Context Meet the grammar ✚ image a chess competition ✚ image the winners with their medals The dialogue Read. Where was Ilyas on Saturday? Was he happy? Salma: Where were you on Saturday, Ilyas? You weren't at home. Ilyas: I was at the regional chess competition in Fez. Salma: Really? Was it difficult? Ilyas: Yes, it was! The players were very good. Salma: Were your friends with you? Ilyas: Yes, they were. Anas and Kawtar were there, and our coach, Mr. Berrada, was with us. Salma: Was Kawtar happy with her results? Ilyas: No, she wasn't. She was tired. But I was third! Salma: Wow! Congratulations! Form Focus on the form A. Underline was, were, wasn't, weren't in the dialogue. Then complete the table. The first line is an example. Affirmative Negative (full / short) Question Short answers I I was I was not / I wasn't Was I …? Yes, I was. / No, I wasn't. You You You were not / You you …? Yes, I . / No, I . He / She / It She She was not / She she …? Yes, she . / No, she . We / You / They They They were not / They they …? Yes, they . / No, they . Remember am / is → was · are → were · I / he / she / it → was · you / we / they → were Question: was / were first → Were you at home? · Short answers: Yes, I was. / No, they weren't. Time words: yesterday · last Saturday · last week · two days ago · in 2024 Practice Use the grammar B. Complete with was, were, wasn't or weren't. ✓ = affirmative · ✗ = negative 1.Yesterday I at the swimming pool with my cousin. 2.Anas and Ilyas (✗) at home last Monday. They (✓) at a football match. 3. the match exciting? — Yes, it . 4.My grandfather a good chess player in the 1980s. 5. you at the youth centre last Saturday? — No, I . 6.The weather (✗) good on Sunday. It (✓) cold and rainy. 7.Salma's photos in the exhibition last month. 8. Kawtar and Zineb in the chess club last year? — Yes, they . C. Make the sentence negative. Then write the question and a short answer. Then ask your partner the questions. # Sentence Negative Question + short answer 1. Ilyas was in Fez last Saturday. 2. The players were very good. 3. Our coach was angry. 4. We were at the stadium yesterday. Free practice D. Last weekend: ask and answer. Write three true sentences about you. Then ask your partner and report his / her answers. Useful questions Where were you on Saturday morning? · Who were you with? · Was it fun? · Were you tired? · Was the weather nice? 1.On Saturday morning,  are two chairs behind it. The table-tennis table is in the middle of the room, between the sofa and the bookcase. The board games are on the shelves above the computer. Our coach's desk is in front of the door, and the footballs are under the desk. There is a big poster of the national football team on the wall opposite the window. Ilyas's bag is near the sofa, and his phone is in his bag. And my water bottle? It's in the corner, behind the door! Form Focus on the form A. Read again. Where is each thing? Complete the table with a preposition. The first line is an example. Thing Preposition Place the chess table next to the window the table-tennis table the sofa and the bookcase the board games the shelves / the computer the footballs the desk the poster the window Ilyas's phone his bag Remember in = inside · on = on the surface · under ≠ above · in front of ≠ behind · next to / near = close to between A and B (two things) · opposite = facing · in the middle of · in the corner Where is the ball? — It's under the desk. · Where are the games? — They're on the shelves. Practice Use the grammar B. Complete with the correct preposition. ( in - on - under - between - next to - opposite ) 1.The ball is the box. I can't see it. 2.Meknes is Fez and Khemisset. 3.The pharmacy is the bank, on the other side of the street. 4.My cat likes sleeping the table. It's dark there. 5.Our photos are the wall of the club. 6.Salma sits me in class. We share a desk. C. Look around your classroom. Write a sentence about each thing. Use a different preposition each time. # Thing Where is it? / Where are they? 1. the teacher's desk 2. the board 3. your schoolbag 4. the windows 5. your best friend Free practice D. My dream hobby room. Draw your dream hobby room (games, sports things, books …). Describe it to your partner. He / She draws it. Then compare. my drawing Write about your room: “My guitar is next to my bed. …” 1. 2. 3. Teacher copy Answer key — prepositions of place Do not hand out ECRIF stages EContext textCTask A + ruleRTask BITask CFTask D # Task Expected answer Note A 1–3 next to (example) · in the middle of / between · on / above A 4–6 under · opposite · in B 1–3 1 in · 2 between · 3 opposite B 4–6 4 under · 5 on · 6 next to C Classroom e.g. The teacher's desk is in front of the board. · My schoolbag is under my desk. · The windows are opposite the door. accept any true D Free Description + drawing; check prepositions and is / are. compare drawings Encounter & Clarify — notes Where are the footballs? — Under the coach's desk. Clarify: T. uses a box and a ball / a pen and books to show in, on, under, behind, in front of, next to, between. CCQs: “between” — how many things? (two) · in front of the door — can I see the desk when I open the door? (yes) Typical errors *The ball is in under the desk. → under the desk *between the sofa or the bookcase → between … and … *The games is on the shelf. → The games are … *next the window → next to the window *in the opposite of → opposite", "cc-u7-l6": "Writing A composition: my favourite hobby Unit / ThemeUnit 7 - Our Hobbies LevelCommon Core Model Read Salma's composition ✚ image Salma with her camera ✚ image the old medina of Meknes The model composition Read. Why does Salma like photography? My Favourite Hobby My favourite hobby is photography. I started it two years ago, when my uncle gave me his old camera. Every Saturday morning, I go to the photography club at the youth centre in Meknes. I take photos of people, old doors and colourful shops in the medina. I like photography because it is creative and relaxing. It also helped me to make new friends, and now I am not shy. In conclusion, photography is not just a hobby for me. It is a part of my life. A. The parts of a composition. Write the number of each part in its box. 1 title2 introduction (topic sentence)3 when, where & what4 reasons5 conclusion Controlled practice B. Complete with the correct connector. ( because - but - and - also - In conclusion ) 1.I play basketball I like team sports. 2.Anas likes football, his sister Zineb prefers chess. 3.Ilyas goes swimming hiking at the weekend. 4.Painting is relaxing. It is cheap. 5. , my hobby makes me happy and healthy. Controlled practice Capitals & punctuation C. Rewrite correctly. Add capital letters, full stops ( . ), commas ( , ) and question marks ( ? ). 1.my favourite hobby is swimming 2.i go to the club in agadir every sunday 3.why do you like chess 4.in conclusion painting is fun and relaxing Guided writing D. Plan your composition about your favourite hobby. Write notes first. Part Sentence starters My notes Introduction My favourite hobby is … . I started it … ago / when … . When & where I usually … every … at / in … with … . Reasons I like it because … . It also … . Conclusion In conclusion, … . Free writing E. Write your composition (60–80 words). Use your plan. Title: Check your composition ✓ a titlea topic sentence (My favourite hobby is …)when, where & who withtwo reasons with becauseand / but / alsoa conclusion (In conclusion, …)present simple: I go / it iscapitals & full stops Teacher copy Answer key — a composition about a hobby Do not hand out Product approach Modelcomposition + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Stage A Parts Boxes from top to bottom: 1 · 2 · 3 · 4 · 5 Model B Connectors 1 because · 2 but · 3 and · 4 also · 5 In conclusion Controlled C Punctuation 1 My favourite hobby is swimming. · 2 I go to the club in Agadir every Sunday. · 3 Why do you like chess? · 4 In conclusion, painting is fun and relaxing. Controlled D Plan Notes only (e.g. football · 5 years ago · every Sunday, stadium, cousins · team spirit, healthy) Guided E Composition See model answer below; mark with the guide Free E — model answer (≈ 75 words) My Favourite Hobby My favourite hobby is football. I started playing it five years ago with my cousins. Every Sunday morning, I play with my team at the stadium in Meknes. Our coach is Mr. Alami. I like football because it is exciting and healthy. It also teaches me to work in a team, but sometimes it is tiring. In conclusion, football is my favourite pastime, and it makes me happy. Marking guide (/10) Organisation (title, introduction, body, conclusion) — 3 Content (when, where, reasons) — 3 Language (present simple, because / and / but / also) — 2 Mechanics (capitals, punctuation, spelling) — 2 Typical errors: *i like · *My hobby it is · *because I like it. (fragment) · no comma after In conclusion", "cc-u8-l1": "Vocabulary Our planet in danger Unit / ThemeUnit 8 - Keep Our Earth Safe LevelCommon Core Context Meet the words ✚ image A polluted beach ✚ image Smoke from a factory ✚ image The bald ibis (Souss-Massa) ✚ image A flood in a village The text Salma's poster for the Green Club — read it twice. Hello! I'm Salma Alaoui, the president of the Green Club at our high school in Agadir. Our planet is in danger. Cars and factories produce gases like carbon dioxide. These gases cause the greenhouse effect, so the Earth is getting hotter. This global warming brings more droughts, floods and storms. Pollution is everywhere: plastic waste on our beaches and litter in our streets. Some animals, like the bald ibis in Souss-Massa National Park, are endangered species. If we don't protect them, they can become extinct. We can all help: recycle waste, save water and plant trees! PRACTICE Work with the words A. Match each word with its meaning.Write the letter in the box. 1.pollutiona.a long time with no rain 2.litterb.animals or plants that may disappear soon 3.endangered speciesc.dirty air, water or land 4.extinctd.a lot of water covers the land 5.droughte.it does not exist on Earth any more 6.floodf.rubbish that people drop in the street B. Put the words in the right column.( carbon dioxide - global warming - hot planet - recycle - litter - rubbish bin - extinct - protect - hunting - earthquake - storm - drought ) Greenhouse effect Clean environment Endangered species Natural phenomena PRACTICE Use the words Vocabulary C. Complete the sentences with words from the box.( pollution - recycle - drought - endangered - flood - greenhouse effect ) 1.There was no rain for two years. It was a terrible . 2.The Barbary macaque of the Middle Atlas is an animal. 3.Smoke from cars and factories causes air . 4.Heavy rain caused a big in the village last winter. 5.Please your plastic bottles. Don't throw them away! 6.Gases like carbon dioxide cause the , so the Earth gets hotter. D. Collocations: match the verbs with the nouns.Write the letter in the box. 1.planta.pollution 2.saveb.litter in the bin 3.recyclec.trees 4.reduced.wild animals 5.protecte.water and energy 6.throwf.plastic bottles Now write two sentences with two collocations.e.g. Our club plants trees every spring. 1. 2. Free practice E. My green pledge. Write four promises to keep our Earth safe. Use the new words and collocations: I promise to … / I promise not to … 1. 2. 3. 4. Teacher copy Answer key Do not hand out ECRIF stages Epictures + textCA, BRCIDFE pledge Word Meaning / expected answer Stress Sound note pollution dirty air, water or land (A 1-c) oOo /pəˈluːʃn/ litter rubbish people drop in the street (A 2-f) Oo /ˈlɪtə/ endangered species animals or plants that may disappear (A 3-b) oOo Oo /ɪnˈdeɪndʒəd ˈspiːʃiːz/ extinct it does not exist any more (A 4-e) oO /ɪkˈstɪŋkt/ drought a long time with no rain (A 5-a) O “ough” = /aʊ/ /draʊt/ flood water covers the land (A 6-d) O “oo” = /ʌ/ /flʌd/ greenhouse effect gases keep the heat in, the Earth gets hotter Oo oO /ˈɡriːnhaʊs ɪˈfekt/ recycle use again (paper, plastic, glass) oOo /riːˈsaɪkl/ A, B & C — answers A. 1-c · 2-f · 3-b · 4-e · 5-a · 6-d B. Greenhouse effect: carbon dioxide, global warming, hot planet · Clean environment: recycle, litter, rubbish bin · Endangered species: extinct, protect, hunting · Natural phenomena: earthquake, storm, drought C. 1 drought · 2 endangered · 3 pollution · 4 flood · 5 recycle · 6 greenhouse effect D & E — answers D. 1-c plant trees · 2-e save water and energy · 3-f recycle plastic bottles · 4-a reduce pollution · 5-d protect wild animals · 6-b throw litter in the bin Sentences: accept any correct, e.g. We must reduce pollution in our city. E. Accept any; check 4 promises, at least 2 collocations, to + verb, e.g. I promise to save water. I promise not to throw litter on the beach.", "cc-u8-l2": "Functions Can I join the clean-up? Unit / ThemeUnit 8 - Keep Our Earth Safe LevelCommon Core Before you listen Look at the pictures. Who is Anas talking to? What does he want? ✚ image Anas at the Green Club room ✚ image The beach clean-up in Agadir While you listen Listen to Anas and Mrs. Benjelloun A. Listen for the first time. Tick (✓) the right answer. 1.Who is Anas talking to?his motherthe Green Club teacherthe headmaster 2.When is the beach clean-up?on Fridayon Saturdayon Sunday B. Listen again. What does Anas ask? Can he do it? Tick (✓) Yes or No. If No, write why. # Anas asks to … Yes No Why not? 1. come in 2. take part in the beach clean-up 3. bring his sister Hajar 4. take photos for the school magazine 5. make a fire on the beach 6. leave his bag in the club room on Friday Expressions Focus on the language C. Listen again and complete the expressions from the dialogue. Asking for permission Giving permission Refusing permission I come in? , Anas. Come in. I'm you can't. I bring my sister? Of course you . , you can't. I take some photos? Yes, go . Expressions Pronunciation Functions D. Listen and repeat. Then put the words in the right column.( yes - may - take - help - make - ten - waste - get - rain - bed - day - pen ) /e/ as in yes /eɪ/ as in may Practice Use the expressions E. Complete the mini-dialogues with the expressions in the box.( Can I - Sure - go ahead - I'm afraid - May I - Sorry ) 1. open the window, sir? It's hot. — , you can. 2. use your pen, Hajar? — Yes, . 3.Can we swim in the river, Dad? — not. The water is polluted. 4.Can I throw this bottle here? — , you can't. Put it in the recycling bin. F. Ask for permission and answer. Give a reason when you say no. # Situation Your exchange 1. You want to borrow your friend's dictionary. 2. You want to put a recycling bin in your classroom. Ask the headmaster. 3. You want to plant trees in the school garden. Ask Mrs. Benjelloun. 4. Your little brother wants to play with plastic bags. Say no. Free practice G. Over to you. Role-play the situation with your partner. Then change roles. Student A — Green Club member You are visiting Souss-Massa National Park with the Green Club. Ask the park guard for permission four times: take photos of the birds · have a picnic · walk near the river · feed the animals · take some plants home. “Excuse me, can I …?” Student B — park guard You work in Souss-Massa National Park. The bald ibis is an endangered bird. Give or refuse permission and give a reason: “Sure, you can.” / “Yes, go ahead.” / “I'm afraid you can't. …” Notes / useful expressions: Teacher copy Answer key & tapescript Do not hand out ECRIF stages Epictures + ACB, C, DREIFFG role-play Tapescript — read it aloud with a student, or record it≈ 1 min 15 Anas: Excuse me, Mrs. Benjelloun. Can I come in? Mrs. Benjelloun: Sure, Anas. Come in. Anas: I want to join the Green Club. Can I take part in the beach clean-up on Saturday? Mrs. Benjelloun: Of course you can. We meet at Agadir beach at nine o'clock. Anas: Great! Could I bring my sister Hajar? She loves nature. Mrs. Benjelloun: Yes, of course. Everyone is welcome. Anas: May I take some photos for the school magazine? Mrs. Benjelloun: Yes, go ahead. That's a good idea. Anas: And can we make a fire on the beach to cook lunch? Mrs. Benjelloun: I'm afraid you can't. Fires are dangerous and they make the air dirty. Bring sandwiches! Anas: OK. Can I leave my bag in the club room on Friday? Mrs. Benjelloun: Sorry, you can't. The room is closed on Friday afternoon. Anas: No problem. Thank you, Mrs. Benjelloun. See you on Saturday! Mrs. Benjelloun: You're welcome. And remember: no plastic bottles, please! # Task Expected answer A Gist 1 the Green Club teacher · 2 on Saturday B Relevant info 1 Yes · 2 Yes · 3 Yes · 4 Yes · 5 No — fires are dangerous / make the air dirty · 6 No — the room is closed on Friday afternoon C Expressions Asking: Can · Could · May — Giving: Sure · can · ahead — Refusing: afraid · Sorry D /e/ – /eɪ/ /e/: yes, help, ten, get, bed, pen — /eɪ/: may, take, make, waste, rain, day E Mini-dialogues 1 Can I / May I — Sure · 2 May I / Can I — go ahead · 3 I'm afraid · 4 Sorry F, G Free use Accept any polite request + answer with a reason (see notes) Board (Clarify) Asking: Can I …? (informal) · Could I …? / May I …? (more polite) + base verb Giving: Sure. / Of course (you can). / Yes, go ahead. Refusing: Sorry, you can't. / I'm afraid you can't. + reason F & G — notes F. e.g. 1 Can I borrow your dictionary? — Sure, here you are. · 2 Excuse me, sir. May I put a recycling bin in our classroom? — Yes, go ahead. · 4 Can I play with this bag? — No, I'm afraid you can't. It's dangerous. G. Monitor: polite intonation ↗ on Can I …?, base verb after can / may (*Can I to take…), a reason after a refusal; /e/ – /eɪ/ in yes / may / take.", "cc-u8-l3": "Reading Our Green Saturday Unit / ThemeUnit 8 - Keep Our Earth Safe LevelCommon Core Before you read Look at the title and the pictures. ✚ image Plastic on the beach ✚ image The bald ibis ✚ image Students planting trees A. Predict: tick (✓) what the text is about. Then skim the text to check. A family holiday on the beach in Agadir. A day when students worked to protect the environment. A report about fishing in Morocco. Reading Skim first: read quickly for the main ideas. The text Skim it in one minute. Then read it carefully. Our Green Saturday by Hajar Bennani, Green Club [1] Last Saturday, forty students from the Green Club cleaned Agadir beach. We arrived at nine o'clock, and Mrs. Benjelloun divided us into small groups. Each group collected rubbish from one part of the beach. [2] We were really shocked. We picked up more than two hundred plastic bottles, bags and cans. Plastic is very dangerous for the sea. Fish and birds eat it, and many of them die. Some species, like the sea turtle, are now endangered. [3] In the afternoon, we visited Souss-Massa National Park, near Agadir. A guide talked to us about the bald ibis, a rare bird. Only a few hundred of these birds live in the wild today, so the park protects them. [4] At the end of the day, we recycled the bottles and planted ten trees near our school. We all agreed: keeping our Earth safe starts with small actions. Join us next month! B. Skim again. Match each paragraph with its main idea.Write the letter in the box. 1.Paragraph 1a.a visit to a park and a rare bird 2.Paragraph 2b.recycling, planting and a message 3.Paragraph 3c.the clean-up begins 4.Paragraph 4d.the problem of plastic While you read Read for details Reading C. What is the main purpose of the text? Tick (✓) one answer. to describe the hotels of Agadir to tell readers about the club's day and ask them to help to explain how to cook fish D. Read carefully. True or False? Justify with words from the text. 1.The students arrived at the beach at ten o'clock.TFJustify: 2.They found more than two hundred plastic objects.TFJustify: 3.The sea turtle is an endangered species.TFJustify: 4.A lot of bald ibises live in the wild today.TFJustify: E. Answer the questions. 1.How many students cleaned the beach?Answer: 2.Why is plastic dangerous for the sea?Answer: 3.Where did the students go in the afternoon?Answer: 4.What did they do at the end of the day?Answer: After reading F. Hajar says: “Keeping our Earth safe starts with small actions.” Write three small actions your class can do. 1. 2. 3. Teacher copy Answer key Do not hand out PDP stages Prepictures + A predictDuringA check · B, C skim · D, E detailsPostF # Task Expected answer Paragraph A Prediction Option 2 — a day when students worked to protect the environment whole text B Main ideas 1-c · 2-d · 3-a · 4-b 1–4 C Purpose Option 2 — to tell readers about the club's day and ask them to help (“Join us next month!”) whole text D1 T / F False — “We arrived at nine o'clock.” 1 D2 T / F True — “more than two hundred plastic bottles, bags and cans” 2 D3 T / F True — “Some species, like the sea turtle, are now endangered.” 2 D4 T / F False — “Only a few hundred of these birds live in the wild today.” 3 E1 Detail Forty students (from the Green Club). 1 E2 Detail Because fish and birds eat it and many of them die. 2 E3 Detail They went to (visited) Souss-Massa National Park. 3 E4 Detail They recycled the bottles and planted ten trees near the school. 4 Skimming — how to teach it Set a strict time (1 min). Ss. read the title, the first line of each paragraph and key words only (beach, plastic, park, bird, recycled, trees). Pre-teach (pictures / mime): rubbish, shocked, rare, guide, in the wild. Ask: “Which words helped you choose?” F — notes Accept any 3 actions, e.g. We can put a recycling bin in our classroom. We can turn off the lights. We can plant flowers in the schoolyard. Collect the ideas on the board: they prepare the Writing lesson (a paragraph on keeping our town / school clean).", "cc-u8-l4": "Grammar What did you do last Saturday? Unit / ThemeUnit 8 - Keep Our Earth Safe LevelCommon Core Context Meet the grammar ✚ image Mehdi and Khadija on Monday morning ✚ image Mehdi at the beach clean-up The dialogue Read. Did Khadija go to the clean-up? Why not? Khadija: Hi, Mehdi! Did you enjoy the clean-up on Saturday? Mehdi: Yes, I did! We cleaned the whole beach. I collected forty plastic bottles. Khadija: Wow! Did you visit Souss-Massa National Park too? Mehdi: Yes, we did. We watched the bald ibis, but we didn't stay long. It rained in the afternoon. Khadija: Did you plant the trees? Mehdi: No, we didn't. We planted them on Sunday. And you? Why didn't you come? Khadija: My grandmother arrived from Taroudant, so I stayed at home. But I recycled all our old paper! Form Focus on the form A. Look at the highlighted verbs. Then complete the table.The first line is an example. Affirmative Negative Question Short answers We cleaned the beach. We didn't clean the beach. Did you clean the beach? Yes, we did. / No, we didn't. I collected forty bottles. We didn't stay long. Did you plant the trees? Remember Affirmative: verb + -ed for all persons: I / you / he / she / we / they cleaned. Spelling: clean → cleaned · arrive → arrived (+d) · study → studied (consonant + y) · play → played (vowel + y) · stop → stopped Negative: didn't + base verb: We didn't stay. ✓ We didn't stayed. ✗ · Question: Did + subject + base verb? → Did you visit…? Practice Use the grammar B. Write the past simple form of the verbs.Look at the spelling rules. 1.recycle→ 2.carry→ 3.protect→ 4.stop→ 5.enjoy→ 6.study→ 7.plan→ 8.destroy→ C. Complete Hajar's diary with the past simple of the verbs. ✗ = negative. 1.Yesterday, our club (organize) a green day at school. 2.We (paint) the recycling bins and Anas (carry) them to the classrooms. 3.Salma (✗ use) plastic bags. She (use) a cotton bag. 4.In the afternoon, it (✗ rain), so we (water) the new trees. 5.The students (✗ throw) any litter in the schoolyard. Mrs. Benjelloun was happy! D. Write questions and short answers.✓ = yes · ✗ = no # Cue Question + short answer 1. you / recycle paper last week? (✓) 2. Mehdi / watch the bald ibis? (✓) 3. the students / plant the trees on Saturday? (✗) 4. Khadija / stay at home? (✓) Free practice E. Find someone who … last weekend. Ask your classmates: “Did you … last weekend?” Write a name. Then write three sentences. Find someone who … Name walked to a park or a beach saved water at home watched a film about animals helped clean the house or the street 1. 2. 3. Teacher copy Answer key Do not hand out ECRIF stages Epictures + dialogueCA + RememberRB, CIDFE find someone who # Task Expected answer A Table I didn't collect … · Did you collect …? · Yes, I did. / No, I didn't. — We stayed long. · Did you stay long? · Yes, we did. / No, we didn't. — We planted the trees. · We didn't plant the trees. · Yes, we did. / No, we didn't. B Spelling recycled · carried · protected · stopped · enjoyed · studied · planned · destroyed C Diary 1 organized · 2 painted, carried · 3 didn't use, used · 4 didn't rain, watered · 5 didn't throw D1 Question Did you recycle paper last week? — Yes, I did. D2 Question Did Mehdi watch the bald ibis? — Yes, he did. D3 Question Did the students plant the trees on Saturday? — No, they didn't. D4 Question Did Khadija stay at home? — Yes, she did. E Free e.g. Imane walked to the beach. Yassine didn't save water, but Rania saved water. Board (Clarify) Form: S + V-ed · S + didn't + V · Did + S + V? · Yes, S did. / No, S didn't. Time words: yesterday, last Saturday / week, two days ago, in 2020 CCQs: “Is the clean-up now or finished?” (finished) · “Do we use -ed after didn't?” (no) Typical errors *We didn't stayed · *Did you visited …? · *He studyed · *stoped · *I watch the bird yesterday Optional note: -ed is pronounced /t/ (watched), /d/ (stayed), /ɪd/ (collected) — full practice in Unit 9. E. Monitor the question form Did you …? and short answers.", "cc-u8-l5": "Grammar It's a great idea, isn't it? Unit / ThemeUnit 8 - Keep Our Earth Safe LevelCommon Core Context Meet the grammar ✚ image Salma and Anas making a poster ✚ image The Green Club exhibition The dialogue Read. What are Salma and Anas preparing? Salma: This poster looks great, doesn't it? Anas: Yes, it does! You took these photos at the beach, didn't you? Salma: Yes, I did. Hajar helped me. The bald ibis is beautiful, isn't it? Anas: It is! But there aren't many birds left, are there? Salma: No, there aren't. That's why we must protect them. You can draw the club logo, can't you? Anas: Sure. Mrs. Benjelloun didn't see the poster, did she? Salma: No, she didn't. Let's show it to her tomorrow. Anas: People don't recycle enough in our town, do they? Salma: No, they don't. But our exhibition can change that! Form Focus on the form A. Complete the table with the question tags from the dialogue.Is the statement positive (+) or negative (−)? Statement + / − Question tag This poster looks great, + doesn't it? You took these photos at the beach, You can draw the club logo, There aren't many birds left, Mrs. Benjelloun didn't see the poster, People don't recycle enough in our town, Remember Positive statement → negative tag: It is beautiful, isn't it? · Negative statement → positive tag: You don't recycle, do you? Use the same auxiliary (be, can, do / does / did) + a pronoun: Salma lives …, doesn't she? · present simple → do / does · past simple → did Intonation: falling ↘ = I am sure, I want you to agree · rising ↗ = I am not sure, it is a real question. Practice Use the grammar B. Match the statements with the question tags.Write the letter in the box. 1.Plastic bags are dangerous,a.is it? 2.Hajar recycles paper at home,b.didn't they? 3.You didn't throw litter on the beach,c.aren't they? 4.The students planted ten trees,d.did you? 5.We can save water at school,e.can't we? 6.It isn't hot today,f.doesn't she? C. Add the correct question tag. 1.The Earth is getting hotter, ? 2.Mehdi collected forty bottles, ? 3.You don't waste water, ? 4.Endangered animals can disappear, ? 5.Salma and Anas aren't late, ? 6.The guide talked about the bald ibis, ? D. Check the information. Write a sentence with a question tag.Use the cues. # Cue Your sentence + tag 1. the Green Club / clean / the beach last Saturday 2. sea turtles / endangered 3. we / not / recycle enough at school 4. you / can / plant a tree in your garden Free practice E. Guess and check. Write four things you think are true about your partner and the environment. Check with a tag (↘). Tick (✓) the box if you are right. Ideas You recycle …, don't you? · You didn't throw …, did you? · You can …, can't you? · Your family saves …, doesn't it? 1. 2. 3. 4. Teacher copy Answer key Do not hand out ECRIF stages Epictures + dialogueCA + RememberRB, CIDFE guess and check # Task Expected answer A Table + didn't you? · + can't you? · − are there? · − did she? · − do they? B Matching 1-c · 2-f · 3-d · 4-b · 5-e · 6-a C Tags 1 isn't it? · 2 didn't he? · 3 do you? · 4 can't they? · 5 are they? · 6 didn't he / she? D1 Cue The Green Club cleaned the beach last Saturday, didn't it? D2 Cue Sea turtles are endangered, aren't they? D3 Cue We don't recycle enough at school, do we? D4 Cue You can plant a tree in your garden, can't you? E Free e.g. You recycle plastic bottles, don't you? — Yes, I do. / No, I don't. Board (Clarify) + statement, − tag: It is …, isn't it? · You can …, can't you? · She recycles …, doesn't she? · They planted …, didn't they? − statement, + tag: It isn't …, is it? · You don't …, do you? · He didn't …, did he? Answer: Yes, I do. / No, I don't. Typical errors *isn't he? after Mehdi collected (→ didn't he?) · *doesn't it? after Salma and Anas (→ they) · *don't they? after a negative statement · pronoun repeated wrongly (*isn't the poster?) E. Drill falling intonation (checking); contrast with rising ↗ for real questions.", "cc-u8-l6": "Writing Writing a coherent paragraph Unit / ThemeUnit 8 - Keep Our Earth Safe LevelCommon Core Model Read Anas's paragraph for the school magazine ✚ image A clean street in Agadir ✚ image A recycling bin at school The model paragraph — Keep our town clean by Anas Bennani There are many simple ways to keep our town clean. First, we must not throw litter in the streets. We can put our rubbish in the bin or take it home. Second, we can recycle plastic, paper and glass. For example, our Green Club collects plastic bottles at school every week. In addition, we can plant trees in our neighbourhood because they give us clean air and shade. Finally, we can save water and energy at home. To sum up, if everyone does a small action every day, our town can be cleaner and healthier. A. The parts of a paragraph.Write the letter in each box of the paragraph. T topic sentence (the main idea)S supporting sentences (ideas + examples)C concluding sentence (sums up)The underlined words are connectors. They link the ideas. Controlled practice B. Put Khadija's paragraph in the right order.Number the sentences 1–6. Second, we can take short showers. There are three easy ways to save water at home. To sum up, every drop of water is important, so let's save it! First, we can turn off the tap when we brush our teeth. Finally, we can water the plants in the evening because the sun is not hot. For example, a five-minute shower uses less water than a bath. Controlled practice Connectors C. Complete the sentences with connectors from the box.( First - For example - because - In addition - To sum up ) 1. , we can turn off the lights when we leave the classroom. 2.Plastic is dangerous fish and birds eat it. 3.We can reuse things. , we can use old jars as pencil boxes. 4.We can walk to school. , we can ride a bike. 5. , small actions can protect our planet. Guided writing D. Plan your paragraph: How can students protect the environment at school?Write notes. Part Sentence starters My notes Topic sentence There are several ways students can … Idea 1 + example First, … For example, … Idea 2 + reason Second, … because … Idea 3 In addition, … / Finally, … Concluding sentence To sum up, … Free writing E. Write your paragraph (60–80 words). Title: Check your paragraph ✓ a titlea topic sentencethree supporting ideasan example or a reasonconnectors: First, In addition …a concluding sentencecapital letters and full stops60–80 words Teacher copy Answer key — writing a coherent paragraph Do not hand out Product approach Modelparagraph + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Stage A Parts Boxes from top to bottom: T · S · S · S · S · C Model B Order 1 There are three easy ways … · 2 First, … tap … · 3 Second, … short showers. · 4 For example, … · 5 Finally, … · 6 To sum up, … (boxes top to bottom: 3 · 1 · 6 · 2 · 5 · 4) Controlled C Connectors 1 First · 2 because · 3 For example · 4 In addition · 5 To sum up Controlled D Plan Notes only (e.g. recycling bins · turn off lights / taps · plant trees · no litter in the schoolyard) Guided E Paragraph See model answer below; mark with the guide Free E — model answer (≈ 75 words) There are several ways students can protect the environment at school. First, they can put recycling bins in every classroom. For example, one bin for paper and one for plastic. Second, they must not throw litter in the schoolyard because it makes the school dirty. In addition, they can turn off the lights and the taps. Finally, they can plant trees in the garden. To sum up, a green school starts with green students. Marking guide (/10) Organisation (topic sentence, 3 ideas, concluding sentence) — 3 Coherence (connectors, one main idea) — 3 Language (can / must + verb, unit vocabulary) — 2 Mechanics (capitals, full stops, spelling) — 2 Typical errors: no topic sentence · list of ideas with no connectors · *First we can … (missing comma) · *because + noun", "cc-u9-l1": "Vocabulary Jobs, money & services Unit / ThemeUnit 9 - The World of Money LevelCommon Core CONTEXT Meet the words ✚ image Kawtar's cake shop in Safi ✚ image Coins and banknotes ✚ image At the bank The text Read it twice. What was Kawtar's problem three years ago? Kawtar Alami is twenty-six and she lives in Safi. Three years ago, she was unemployed: the fish factory closed and she had no job and no salary. Today, she is a business owner. She makes and sells cakes in her small shop near the market. She earns about 6,000 dirhams a month. Her customers pay in cash – coins and banknotes – or by card. Every month, Kawtar goes to the bank. She puts some money in her savings account and she pays back her loan. She also uses other services: the post office, the ATM and mobile banking. \"Small businesses a u readLook at the title and the pictures. Do Task A before you read. ✚ image a closed factory ✚ image a woman selling cakes ✚ image a busy shop A. Predict: tick (✓) what the text is about. Then read quickly and check. A woman loses all her money in a bank. A woman starts her own small business. A girl wants to work in a fish factory. READING Read the text The text The words in bold are new. Don't use a dictionary! From Job Seeker to Shop Owner [1] Kawtar Alami is twenty-six and lives in Safi. Three years ago, she lost her job when the fish factory closed. She was unemployed for a long time. Every morning, she looked for work in the newspapers and on the Internet, but she found nothing. [2] One day, her uncle gave her an idea: “You can cook very well. Why don't you sell your cakes?” Kawtar had some savings, but they weren't enough, so she got a small loan from a bank. With the money, she rented a tiny shop near the market and bought an oven. [3] At first, she had very few customers and she barely earned enough to pay the rent. But her cakes were delicious and cheap, and people soon came back for more. Today, Kawtar's shop is busy every day. She employs two young women from her neighbourhood, and she saves part of her profit every month. “Money is important,” she says, “but hard work is the real treasure.” WHILE YOU READ Guess the meaning from context Reading B. True or False? Justify your answer from the text. TF 1.Kawtar lost her job because the factory closed. Answer: 2.Kawtar started her shop with her savings only. Answer: 3.Kawtar works alone in her shop today. Answer: C. Find words in the text that mean: The paragraph number helps you. 1.paid money every month to use a place [2] Answer: 2.a machine in the kitchen for baking cakes [2] Answer: 3.the money you keep after you pay all your costs [3] Answer: How to guess a new word ① Read the words around it. ② Is it a noun, a verb or an adjective? ③ Look for a word part: un-employ-ed. ④ Look for an opposite or a contrast word: but, so. D. Guess the meaning of the word in bold. Which clue helped you (①–④)? 1.“She barely earned enough to pay the rent. But … people soon came back.” barely = … Meaning + clue: 2.“She employs two young women from her neighbourhood.” employ = … Meaning + clue: 3.“Money is important, but hard work is the real treasure.” treasure = … Meaning + clue: AFTER READING E. Your view. Kawtar says: “Hard work is the real treasure.” Do you agree? What small business would you like to start in your town? Why? Teacher copy Answer key — guessing word meaning Do not hand out PDP stages Prepictures + A predictDuringA check · B T/F · C · D guessPostE # Task Expected answer Line ref. A Prediction Option 2 — A woman starts her own small business. whole text B1 T / F True — “she lost her job when the fish factory closed.” [1] B2 T / F False — “Kawtar had some savings, but they weren't enough, so she got a small loan.” [2] B3 T / F False — “She employs two young women from her neighbourhood.” [3] C Find words 1 rented · 2 oven · 3 profit [2] [3] D1 Guess almost not / only just — clue ④ contrast “But … people soon came back” [3] D2 Guess give somebody a job and pay them — clue ③ word part (employ in un-employ-ed, ¶1) + ① “two young women” [3] D3 Guess something very valuable — clue ④ contrast “Money is important, but …” (noun after “the real”: ②) [3] E Your view Accept any, e.g. I agree. I'd like to open a phone repair shop because … — Pre-reading — notes A. Ask: “Which words in the title helped you?” (job seeker, shop owner). Do not pre-teach the words in bold: they are the target of the lesson. Gist question: Is Kawtar's story happy or sad? (happy ending) During & post — notes Recycling: unemployed, savings, loan, customers come from the Vocabulary lesson — ask Ss to explain them in their own words. Ss. say how they guessed, not only the meaning. E links to the Writing lesson (a story).", "cc-u9-l4": "Grammar The past simple: irregular verbs Unit / ThemeUnit 9 - The World of Money LevelCommon Core Context Meet the grammar ✚ image Hiba from the school newspaper ✚ image Kawtar in her shop The interview Read. How did Kawtar get the money? Did she sell many cakes at first? Hiba: When did you open your shop, Kawtar? Kawtar: I opened it two years ago. Before that, I worked in a fish factory, but it closed. Hiba: How did you get the money for the shop? Kawtar: I didn't have enough money, so I went to the bank and got a small loan. Hiba: Did you buy a big oven? Kawtar: No, I didn't. I bought a small one. It was cheap! Hiba: Did you sell many cakes at first? Kawtar: No, I didn't. I sold only ten cakes a day. But I made new recipes and I found new customers. Hiba: What did you do with your first profit? Kawtar: I saved it! And I gave a present to my uncle. The shop was his idea. Form Focus on the form A. Underline the verbs in the past in the interview. Then complete the table. The first line is an example. Base form Past simple Base form Past simple go went buy get sell have make be was / were find give open (regular) Remember ✓ Kawtar went to the bank. (same form for all persons: I / you / he / she / we / they went) ✗ She didn't have money. → didn't + base verb ✓ She didn't had ✗ ? Did you buy an oven? — Yes, I did. / No, I didn't. · How did you get the money? -ed sounds (regular verbs): /t/ worked · /d/ opened · /ɪd/ wanted (after t or d) Practice Use the grammar B. Complete with the past simple of the verbs in brackets. 1.Last year, Salma (find) a job in a bank in Tangier. 2.My father (give) me 50 dirhams for my birthday. 3.We (go) to the market and (buy) some vegetables. 4.Anas (not / have) enough money for the new phone. 5. you (spend) all your pocket money? — No, I . 6.Kawtar (make) forty cakes and (sell) all of them! C. Pronunciation review: put the regular verbs in the right column.( worked - saved - wanted - rented - looked - opened - needed - helped - earned ) /t/ /d/ /ɪd/ D. Make the sentence negative. Then write a question and a cklist # Task Expected answer Stage A Parts Boxes from top to bottom: 1 title · 2 setting · 3 problem · 4 events · 5 ending · 6 lesson Model B Sequencers 1 One day · 2 First · 3 Then · 4 After that · 5 Finally Controlled C Punctuation 1 “Thank you,” said Mr. Tazi. · 2 “Can you help me?” asked Anas. · 3 “It's my wallet,” said the old man. · 4 One day, Salma found a job in Tangier. Controlled D Plan Notes only (e.g. last Sunday · Rania · at the beach · found 200 DH · gave it to the police · the owner …) Guided E Story See model answer below; check with the marking guide. Free E — model answer (≈ 75 words) A Lucky Day One day last summer, Rania was at the beach in El Jadida with her family. Suddenly, she found 200 dirhams in the sand. First, she looked around. Then she saw a sad old woman. After that, Rania asked her, “Did you lose some money?” “Yes, I did!” said the woman. Finally, Rania gave her the money and the woman bought her an ice cream. It was the best day of the holiday! Marking guide (/10) Story parts (title, setting, problem, events, ending) — 3 Organisation (sequencers, paragraph order) — 2 Language (past simple, a superlative) — 3 Mechanics (capitals, punctuation, speech marks) — 2 Typical errors: *she finded · *he didn't found · *Then, after that, … · missing speech marks"}</script>

function units(level){const m=new Map();L.filter(l=>l.level===level).forEach(l=>{if(!m.has(l.unit))m.set(l.unit,{unit:l.unit,name:l.unitName})});return [...m.values()]}
function match(l){
  if(S.student&&!l.ws)return false;
  if(F.skills.size&&!F.skills.has(l.skill))return false;
  return true;
}
// Content search. fold() keeps string length, so a match found in folded text can be cut from the raw text.
const squash=s=>String(s||'').replace(/\s+/g,' ').trim();
const fold=s=>s.normalize('NFC').toLowerCase().replace(/[À-ɏ]/g,c=>c.normalize('NFD')[0]).replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
const FW=[['meta',3],['topic',6],['words',4],['objective',3],['plan',2],['worksheet',1]];
const WL={topic:'title',words:'key words',objective:'objective',plan:'lesson plan',worksheet:'worksheet'};
const RAW={},IX={};
L.forEach(l=>{
  RAW[l.id]={topic:squash([l.title,l.topic,l.approach].filter(Boolean).join(' · ')),words:squash([...(l.words||[]),l.point].filter(Boolean).join(' · ')),
    objective:squash(l.objective),plan:squash((l.stages||[]).map(s=>s.name+': '+s.steps.join(' ')).join(' · ')),worksheet:squash(SR[l.id])};
  IX[l.id]={};for(const k in RAW[l.id])IX[l.id][k]=fold(RAW[l.id][k]);
});
// A term matches at the start of a word ("cine" finds "Ciné-Club", not "medicine").
const wordRe=t=>new RegExp('(?:^|[^\\p{L}\\p{N}])('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gu');
const has=(h,re)=>{re.lastIndex=0;return re.test(h)};
const at=(h,re)=>{re.lastIndex=0;const m=re.exec(h);return m?m.index+m[0].length-m[1].length:-1};
function parseQ(q){
  const f=fold(squash(q)),terms=[];
  f.replace(/"([^"]+)"/g,(m,p)=>{terms.push(p.trim());return ' '}).split(' ').forEach(w=>{w=w.replace(/^[^\p{L}\p{N}']+|[^\p{L}\p{N}']+$/gu,'');if(w)terms.push(w)});
  const T=[...new Set(terms)].filter(Boolean),full=f.replace(/"/g,'').trim();
  // bare numbers ("unit 3") only match the unit and the title, not every "3 min" in a plan
  return {terms:T,re:T.map(wordRe),num:T.map(t=>/^\d+$/.test(t)),full,fre:wordRe(full)};
}
function score(l,Q){
  const f={meta:fold(`${l.level} unit ${l.unit} u${l.unit} ${l.unitName} ${l.skill} ${l.label} ${S.notes[l.id]||''} ${ST[stOf(l)]}`),...IX[l.id]};
  if(S.student){delete f.objective;delete f.plan}
  const inField=(k,i)=>f[k]&&(!Q.num[i]||k==='meta'||k==='topic')&&has(f[k],Q.re[i]);
  if(!Q.terms.every((t,i)=>Object.keys(f).some(k=>inField(k,i))))return null;
  let s=0,where='',best=0;
  for(const [k,w] of FW){if(!f[k])continue;
    let fs=Q.terms.filter((t,i)=>inField(k,i)).length*w;if(Q.terms.length>1&&has(f[k],Q.fre))fs+=5*w;
    s+=fs;if(k!=='meta'&&fs>best){best=fs;where=k}}
  return {s,where};
}
function hl(raw,terms){
  const f=fold(raw),m=[];
  terms.forEach(t=>{const re=wordRe(t);let x;while((x=re.exec(f))){const a=x.index+x[0].length-x[1].length;m.push([a,a+t.length]);if(re.lastIndex===x.index)re.lastIndex++}});
  m.sort((a,b)=>a[0]-b[0]);let out='',p=0;
  for(const [a,b] of m){if(a<p)continue;out+=esc(raw.slice(p,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>';p=b}
  return out+esc(raw.slice(p));
}
function snip(raw,Q){
  const f=fold(raw);let i=at(f,Q.fre);
  if(i<0){const ps=Q.re.map(re=>at(f,re)).filter(x=>x>-1);i=ps.length?Math.min(...ps):0}
  const a=Math.max(0,i-70),b=Math.min(raw.length,i+150);
  return (a?'…':'')+hl(raw.slice(a,b),Q.terms)+(b<raw.length?'…':'');
}
function results(pool){
  const Q=parseQ(F.q);
  const hits=pool.map(l=>({l,r:score(l,Q)})).filter(h=>h.r).sort((a,b)=>b.r.s-a.r.s);
  if(!hits.length)return `<div class="empty"><b>No lessons match “${esc(F.q.trim())}”.</b><br>Try fewer words, or check the skill filters.</div>`;
  return `<p style="color:var(--ink2);margin:-6px 0 12px">${hits.length} lesson${hits.length>1?'s':''} found, best matches first. Put words in "quotes" to match an exact phrase.</p><div class="results">`+hits.map(({l,r})=>{
    const raw=RAW[l.id],k=r.where||(raw.topic?'topic':'');
    return `<button class="hit" style="--c:${color(l)}" data-id="${l.id}"><div class="meta">${esc(l.level)} · Unit ${l.unit}: ${esc(l.unitName)} · <span style="color:${color(l)};font-weight:700">${esc(l.label)}</span>${r.where?` · found in <span class="where">${WL[r.where]}</span>`:''}</div>
      <b>${hl(l.topic||l.label,Q.terms)}</b>${k&&k!=='topic'?`<div class="snip">${snip(raw[k],Q)}</div>`:''}</button>`}).join('')+'</div>';
}
function chips(){return `<div class="chips"><button class="chip all" data-skill="" aria-pressed="${!F.skills.size}">All skills</button>`+Object.keys(SK).map(k=>`<button class="chip" style="--c:var(${SK[k]})" data-skill="${k}" aria-pressed="${F.skills.has(k)}"><i></i>${k}</button>`).join('')+'</div>'}

    return out+`<table class="table"><thead><tr><th>Level</th><th>Unit</th><th>Lesson</th><th>Files</th><th>Status</th></tr></thead><tbody>`+pool.map(l=>`<tr data-id="${l.id}"><td>${esc(l.level)}</td><td>${l.unit}. ${esc(l.unitName)}</td><td><span style="color:${color(l)};font-weight:700">${esc(l.skill)}</span> ${esc(l.part||'')}${l.topic?`<div style="color:var(--ink2);font-size:13px">${esc(l.topic)}</div>`:''}</td><td>${l.plan?'Plan ':''}${l.ws?'Sheet':''}</td><td>${S.student?'':ST[stOf(l)]}</td></tr>`).join('')+'</tbody></table>';
  }

const mins=(a,b)=>a===b?`${a} min`:`${a}–${b} min`;

  if(!S.student)out+=kv('Objective',l.objective?`<div>${esc(l.objective)}</div>`:'');
  out+=kv('Key point',l.point?`<div>${esc(l.point)}</div>`:'');
  out+=kv('Key words',l.words&&l.words.length?`<div class="words">${l.words.map(w=>`<span class="word">${esc(w)}</span>`).join('')}</div>`:'');
  if(!S.student&&l.stages&&l.stages.length){
    const [lo,hi]=l.minutes,ok=lo<=55&&55<=hi;

      `<div class="tbar" role="img" aria-label="Timing by stage">${l.stages.map(s=>`<span style="flex:${s.max} 1 0" title="${esc(s.name)}: ${mins(s.min,s.max)}"></span>`).join('')}</div>

  }
  return out;
}

   <label class="f">Subtitle<input class="inp" id="ss" value="${esc(S.sub)}" placeholder="English · High School"></label>
   <div class="actions"><button class="btn" id="ex">Export progress</button><label class="btn" style="cursor:pointer">Import progress<input type="file" id="im" accept="application/json" hidden></label></div>
   <p style="color:var(--ink2);margin:0">Progress and notes live in this browser only. Export them to back up or move to another computer.</p>
   <button class="btn" id="rs" style="color:var(--bad)">Reset all progress</button></div>`;
  d.classList.add('on');$('#scrim').classList.add('on');
  const close=()=>{d.classList.remove('on');$('#scrim').classList.remove('on');render()};
  $('#closeD').onclick=close;$('#scrim').onclick=close;
  $('#sn').oninput=e=>{S.name=e.target.value;save();chrome()};$('#ss').oninput=e=>{S.sub=e.target.value;save();chrome()};
  $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='lesson-library-progress.json';a.click()};
  $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{Object.assign(S,JSON.parse(t));save();theme();toast('Progress imported');close()}catch(x){toast('That file is not valid progress data')}})};
  $('#rs').onclick=()=>{if(confirm('Delete all status and notes in this browser?')){S.status={};S.notes={};S.recent=[];save();toast('Progress reset');close()}};
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-level],[data-unit],[data-skill],[data-id]');if(!t)return;
  if(t.tagName==='A'&&t.dataset.id)e.preventDefault();
  if(t.dataset.tab){F.tab=t.dataset.tab;render()}
  else if(t.dataset.level!==undefined){F.level=t.dataset.level;F.unit=null;F.tab='library';render()}
  else if(t.dataset.unit!==undefined&&t.closest('#units')){F.unit=t.dataset.unit?+t.dataset.unit:null;F.tab='library';render()}
  else if(t.dataset.skill!==undefined){const k=t.dataset.skill;if(!k)F.skills.clear();else F.skills.has(k)?F.skills.delete(k):F.skills.add(k);render()}
  else if(t.dataset.id)openDrawer(t.dataset.id);
});
$('#q').addEventListener('input',e=>{F.q=e.target.value;if(F.tab!=='library')F.tab='library';const pos=e.target.selectionStart;render();});
$('#viewBtn').onclick=()=>{S.view=S.view==='list'?'strips':'list';save();render()};
$('#themeBtn').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();theme()};
$('#studentBtn').onclick=()=>{S.student=!S.student;save();if(S.student&&['dashboard','health'].includes(F.tab))F.tab='library';render();toast(S.student?'Student view on':'Teacher view on')};
$('#settingsBtn').onclick=settings;
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){const d=$('#drawer');if(d.classList.contains('on')){d.classList.remove('on');$('#scrim').classList.remove('on');render()}}
});
theme();render();
})();
</script>
</body>
</html>
