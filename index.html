ps": ["T. asks: “Where are you now?” (in class) “Where were you last Sunday?” and writes 2–3 answers on the board.", "T. shows the pictures of the chess competition.", "Ss. read the dialogue and answer: “Where was Ilyas on Saturday? Was he happy?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline was, were, wasn’t and weren’t in the dialogue and complete the table (Task A).", "T. elicits the answers and completes the table on the board.", "T. reads the Remember box: am / is → was, are → were; question = was / were first; short answers.", "CCQs: “Is the competition now or in the past?” (past) · “Anas and Kawtar … there: was or were?” (were)", "T. drills weak /wəz/ in sentences and strong /wɒz/ in short answers."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with was, were, wasn’t or weren’t (Task B).", "Ss. check with a partner; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models sentence 1: “Ilyas wasn’t in Fez. — Was Ilyas in Fez last Saturday? — Yes, he was.”", "Ss. write the negative, the question and a short answer for each sentence (Task C).", "Ss. ask a partner the questions; 2–3 Ss. read their answers aloud."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write three true sentences about last weekend with the starters (Task D).", "Ss. ask a partner the useful questions, then report his / her answers: “Anas was at the stadium. He wasn’t at home.”", "T. monitors and gives delayed feedback on was / were."]}]}, {"id": "cc-u7-l5", "level": "Common Core", "unit": 7, "unitName": "Our Hobbies", "unitDir": "Unit 7 - Our Hobbies", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Grammar Part 2: Prepositions of place (ECRIF)", "topic": "Prepositions of place", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to describe where things are with prepositions of place (in, on, under, next to, behind, in front of, between, opposite, above, near) and ask and answer “Where is / are …?”.", "words": ["in", "on", "under", "between", "next to", "opposite"], "point": "in = inside · on = on the surface · under ≠ above · in front of ≠ behind · next to / near = close to", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. hides a pen and asks: “Where is my pen?” Ss. guess; T. shows it: “It’s under the book.”", "T. shows the pictures of the games room.", "Ss. read Kawtar’s description and answer: “Where are the footballs?” (under the coach’s desk)"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. read again and complete the table with the prepositions (Task A).", "T. checks and writes the prepositions on the board.", "T. shows the meaning with a box and a ball: in, on, under, behind, in front of, next to, between, above.", "T. reads the Remember box. CCQs: “‘between’: how many things?” (two) · “‘opposite’: are the two things facing each other?” (yes)", "Ss. repeat the prepositions with the right stress: beHIND, opPOsite, beTWEEN."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the prepositions in the box (Task B).", "Ss. check with a partner; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models: “The board is behind the teacher’s desk.”", "Ss. look around the classroom and write a sentence for each thing, using a different preposition each time (Task C).", "Ss. read a sentence; the class says if it is true."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. draw their dream hobby room and write 3 sentences about it (Task D).", "Ss. describe the room to a partner, who draws it; then they compare the drawings.", "T. monitors and gives delayed feedback on prepositions and is / are."]}]}, {"id": "cc-u7-l6", "level": "Common Core", "unit": 7, "unitName": "Our Hobbies", "unitDir": "Unit 7 - Our Hobbies", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Writing: A composition about my favourite hobby (Product)", "topic": "A composition about my favourite hobby", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a short composition about their favourite hobby with a title, an introduction, a body with reasons and a conclusion, using because, and, but and also.", "words": ["because", "but", "and", "also", "In conclusion"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. asks: “Do you remember Salma? What is her hobby?” (photography, from the reading lesson)", "Ss. read Salma’s composition and answer: “Why does Salma like photography?”", "Ss. write the number of each part in its box (Task A).", "T. checks and draws the plan on the board: title → introduction → when & where → reasons → conclusion."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["T. elicits the connectors from the model (because, also, In conclusion) and gives their use.", "Ss. complete the sentences with the connectors in the box (Task B).", "Ss. rewrite the sentences with capital letters and punctuation (Task C).", "T. corrects on the board: capitals for I, names, cities, days; comma after In conclusion."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. brainstorms hobbies with the class and writes ideas on the board (sports, games, art, collecting …).", "Each S. chooses one hobby and says why he / she likes it.", "Ss. plan their composition with the sentence starters and write notes (Task D).", "T. moves around and helps with ideas and vocabulary.", "Ss. turn their notes into sentences and read them to a partner, who checks the plan is complete."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their composition (Task E), 60–80 words.", "Ss. check their composition with the checklist and correct their mistakes.", "T. collects the compositions to mark with the marking guide."]}]}, {"id": "cc-u8-l1", "level": "Common Core", "unit": 8, "unitName": "Keep Our Earth Safe", "unitDir": "Unit 8 - Keep Our Earth Safe", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Vocabulary: Our planet in danger (ECRIF)", "topic": "Our planet in danger", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words about the greenhouse effect, a clean environment, endangered species and natural phenomena, and common environmental collocations, to talk about protecting the Earth.", "words": ["carbon dioxide", "global warming", "hot planet", "recycle", "litter", "rubbish bin", "extinct", "protect", "hunting", "earthquake", "storm", "drought", "pollution", "endangered", "flood", "greenhouse effect"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the four pictures and asks: “What can you see? Is our planet in good health?”", "Ss. name what they know (beach, smoke, bird, water) and say what the problem is in each picture.", "T. presents Salma's poster for the Green Club. Ss. read it once and answer the gist question: “What does Salma ask us to do?” (recycle waste, save water, plant trees)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the highlighted words with their meanings (Task A), then check with a partner.", "T. checks meaning with the pictures and CCQs: “Does an extinct animal exist today? (No) Is a drought about too much water or no water? (no water)”.", "T. drills pronunciation and marks the stress on the board: polLUtion, enDANgered, exTINCT, reCYcle; “drought” /aʊ/, “flood” /ʌ/.", "Ss. put the twelve words of the box in the right column (Task B); T. corrects on the board."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the six sentences with words from the box (Task C).", "Ss. compare answers; T. calls on individual Ss. to read the sentences aloud and corrects."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. writes “plant trees” on the board and explains a collocation: words that often go together.", "Ss. match the verbs with the nouns (Task D); T. checks and drills the collocations.", "Ss. write two sentences of their own with two collocations (Task D).", "Volunteers read their sentences; T. corrects form and meaning."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four promises to keep our Earth safe with the new words and collocations: “I promise to … / I promise not to …” (Task E).", "Ss. read their pledges to a partner and choose the best two; volunteers read them to the class.", "T. writes a “Class Green Pledge” on the board and gives feedback on errors."]}]}, {"id": "cc-u8-l2", "level": "Common Core", "unit": 8, "unitName": "Keep Our Earth Safe", "unitDir": "Unit 8 - Keep Our Earth Safe", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Functions: Asking for permission (ECRIF)", "topic": "Asking for permission", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask for, give and refuse permission politely (Can I …? / Could I …? / May I …? — Sure, you can. / I'm afraid you can't.), listen for relevant information and pronounce /e/ and /eɪ/ correctly.", "words": ["yes", "may", "take", "help", "make", "ten", "waste", "get", "rain", "bed", "day", "pen", "Can I", "Sure", "go ahead", "I'm afraid", "May I", "Sorry"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks a student: “Can I borrow your pen?” and waits for the answer. T. asks: “What did I ask for?”", "Ss. look at the two pictures and predict: “Who is Anas talking to? What does he want?”", "Ss. listen to the dialogue for the first time and tick the right answers (Task A). T. checks the predictions."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. listen again for relevant information: what Anas asks, Yes or No, and why not (Task B). Pair check, then feedback.", "Ss. listen a third time and complete the expressions (Task C). T. builds the board: asking / giving / refusing permission.", "CCQs: “Is ‘May I …?’ more or less polite than ‘Can I …?’ (more) Do we give a reason when we say no? (yes)”.", "Pronunciation: T. models /e/ (yes, help) and /eɪ/ (may, take); Ss. repeat and put the words in the right column (Task D).", "T. drills polite rising intonation in “Can I …?”."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the four mini-dialogues with the expressions in the box (Task E).", "Ss. check in pairs; open pairs read the mini-dialogues aloud; T. corrects."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1 with a strong student.", "Ss. write and practise an exchange for each situation, giving a reason when they say no (Task F).", "Two or three pairs perform; the class says which expression they used to ask, give or refuse permission."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A (Green Club member) and B (park guard) (Task G). Ss. prepare quickly, then role-play the visit to Souss-Massa National Park without looking at Task E.", "Ss. change roles and act again; a few pairs perform for the class.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "cc-u8-l3", "level": "Common Core", "unit": 8, "unitName": "Keep Our Earth Safe", "unitDir": "Unit 8 - Keep Our Earth Safe", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Reading: Our Green Saturday (PDP · skimming)", "topic": "Our Green Saturday", "approach": "PDP · skimming", "objective": "By the end of the lesson, students will be able to skim a text to get its main idea and the main idea of each paragraph, and scan it for specific details about a school clean-up day.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “Is our beach clean? What do people leave on the beach?”", "T. pre-teaches rubbish, shocked, rare, guide and in the wild with the pictures and mime.", "Ss. look at the title and the three pictures and predict what the text is about (Task A). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["T. explains skimming: read quickly, look at the title, the first line of each paragraph and key words.", "Ss. skim the text in one minute to check their predictions (Task A).", "Ss. skim again and match each paragraph with its main idea (Task B). T. asks: “Which words helped you?”", "Ss. choose the main purpose of the text (Task C) and justify with the last sentence of the text.", "Ss. read carefully and decide if the statements are true or false, justifying with words from the text (Task D). Pair check; feedback with the paragraph numbers.", "Ss. scan the text to answer the detail questions (Task E); volunteers write the answers on the board."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. write three small actions their class can do to keep our Earth safe (Task F).", "Ss. read their actions to a partner; T. collects the best ideas on the board as a class “green list” and Ss. vote for the top three.", "T. links the list to the Writing lesson (a paragraph about protecting the environment)."]}]}, {"id": "cc-u8-l4", "level": "Common Core", "unit": 8, "unitName": "Keep Our Earth Safe", "unitDir": "Unit 8 - Keep Our Earth Safe", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Grammar Part 1: Past simple of regular verbs (ECRIF)", "topic": "Past simple of regular verbs", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the past simple of regular verbs in the affirmative, negative and interrogative forms to talk about past actions.", "words": [], "point": "Affirmative: verb + -ed for all persons: I / you / he / she / we / they cleaned.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. reminds Ss. of the Green Club clean-up from the Reading lesson and asks: “When was it? Is it finished?”", "Ss. look at the pictures and read the dialogue to answer: “Did Khadija go to the clean-up? Why not?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. look at the highlighted verbs and complete the table (Task A); T. checks on the board.", "T. elicits the rule: verb + -ed for all persons; didn't + base verb; Did + subject + base verb?", "T. goes through the Remember box: spelling rules (+d, y → ied, double consonant) and the common error “didn't stayed”.", "CCQs: “Do we use -ed after didn't? (No) Is ‘Did you visit …?’ about now or the past? (the past)”."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. write the past form of the eight verbs using the spelling rules (Task B).", "Ss. complete Hajar's diary with the past simple, affirmative or negative (Task C); Ss. compare, then T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. write questions and short answers from the cues (Task D).", "Ss. ask and answer the questions with a partner; T. checks the form Did + subject + base verb and the short answers."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["“Find someone who …”: Ss. walk around and ask “Did you … last weekend?” and write a classmate's name for each action (Task E).", "Ss. write three sentences about their classmates (Task E); volunteers read them.", "T. gives feedback on common errors on the board."]}]}, {"id": "cc-u8-l5", "level": "Common Core", "unit": 8, "unitName": "Keep Our Earth Safe", "unitDir": "Unit 8 - Keep Our Earth Safe", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Grammar Part 2: Question tags (ECRIF)", "topic": "Question tags", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to form and use question tags with be, can and do / does / did to check information or ask for agreement.", "words": [], "point": "Positive statement → negative tag: It is beautiful, isn't it? · Negative statement → positive tag: You don't recycle, do you?", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. says: “You did your homework, didn't you?” and waits for answers; Ss. guess what T. wants (to check).", "Ss. look at the pictures and read the dialogue to answer: “What are Salma and Anas preparing?” (a poster for the Green Club exhibition)"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the question tags in the dialogue, decide if each statement is positive or negative and complete the table (Task A).", "T. elicits the rule with the Remember box: positive statement → negative tag, negative statement → positive tag, same auxiliary + pronoun.", "T. models and drills falling (checking) and rising (real question) intonation."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. match the statements with the question tags (Task B).", "Ss. add the correct tag to the six sentences (Task C); pair check, then T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. write a sentence with a question tag from each cue (Task D).", "Ss. read their sentences to a partner, who answers “Yes, …” or “No, …”; T. checks the auxiliaries and pronouns."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["“Guess and check”: Ss. write four sentences with tags about their partner and the environment (Task E).", "Ss. check with their partner using falling intonation and tick the right guesses; the pair with the most ticks wins.", "T. gives delayed feedback on errors."]}]}, {"id": "cc-u8-l6", "level": "Common Core", "unit": 8, "unitName": "Keep Our Earth Safe", "unitDir": "Unit 8 - Keep Our Earth Safe", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Writing: Coherent paragraphs (Product approach)", "topic": "Coherent paragraphs", "approach": "Product approach", "objective": "By the end of the lesson, students will be able to write a coherent paragraph with a topic sentence, supporting ideas, connectors and a concluding sentence about protecting the environment at school.", "words": ["First", "For example", "because", "In addition", "To sum up"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss. of their “green list” from the Reading lesson and asks: “How can we keep our town clean?”", "Ss. read Anas's paragraph and say how many ideas he gives (four).", "Ss. label the boxes of the paragraph T, S or C (Task A). T. explains: one main idea, a topic sentence, supporting sentences, a concluding sentence and connectors (underlined)."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put Khadija's paragraph about saving water in the right order (Task B) and say which words helped them (connectors).", "Ss. complete the sentences with connectors from the box (Task C); T. corrects and adds the connectors to the board."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. writes the topic on the board: “How can students protect the environment at school?” Ss. brainstorm ideas together.", "Ss. plan their paragraph in the outline using the sentence starters: topic sentence, three ideas, an example, a reason and a concluding sentence (Task D).", "T. monitors and helps with ideas and vocabulary."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their paragraph (60–80 words) with a title (Task E).", "Ss. check their paragraph with the checklist, then swap with a partner who ticks the checklist too.", "T. collects the paragraphs for marking with the guide."]}]}, {"id": "cc-u9-l1", "level": "Common Core", "unit": 9, "unitName": "The World of Money", "unitDir": "Unit 9 - The World of Money", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Vocabulary: Jobs, Money & Services (ECRIF)", "topic": "Jobs, Money & Services", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words related to (un)employment, the economy, services and money, find antonyms and use a dictionary entry to check meaning, part of speech, pronunciation and opposites.", "words": ["earns", "cash", "coins", "ATM", "services", "headword", "pronunciation", "part of speech", "meaning", "example", "opposite", "salary", "bank", "loan", "customer", "earn"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows a 200-dirham banknote and some coins and asks: “What can you buy with this? Where do people get money?”", "Ss. look at the three pictures and say what they see (a cake shop, coins and banknotes, a bank).", "Ss. read Kawtar's text twice and answer the gist question: “What was Kawtar's problem three years ago? What is her job now?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the six words with their meanings (Task A); pair check; T. elicits and confirms.", "T. builds a board table: Money (cash, coins, banknotes, salary, earn, loan, savings account) · Jobs (job, unemployed, customer) · Services (bank, post office, ATM).", "T. shows the word parts un- + employ + -ed and checks meaning with CCQs: “If you borrow money, do you give it or take it?”", "Pronunciation: salary, unemployed, economy, customer — choral and individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B); T. corrects on the board.", "Ss. match each word with its opposite (Task C); T. checks and drills the pairs: rich ≠ poor, spend ≠ save, borrow ≠ lend …"]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. projects the dictionary entry for “save” and elicits its parts: headword, pronunciation, part of speech, meaning, example, opposite.", "Ss. answer the questions about the entry (Task D).", "Ss. put the six words in alphabetical order (Task E); T. shows what to do when two words begin with the same letter (cash / customer)."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four sentences about money in their life, each with a pair of opposites (Task F).", "Ss. read their sentences to a partner, who finds the pair of opposites. T. gives delayed feedback on word choice (lend / in": 10, "max": 10, "steps": ["Ss. complete Hind's interview with the words in the box (Task D); pair check.", "Two pairs read the mini-dialogue aloud; T. corrects the pronunciation of can / can't."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. write short exchanges from the cues (Task E), using their own ideas.", "Ss. read their exchanges to a partner; T. elicits some answers and corrects the form."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. models the job-interview role-play with a volunteer (Task F).", "Ss. read their role cards and act out the interview, then change roles.", "Two pairs perform; the class says if the candidate gets the job. T. gives delayed feedback on can / can't and short answers."]}]}, {"id": "cc-u9-l3", "level": "Common Core", "unit": 9, "unitName": "The World of Money", "unitDir": "Unit 9 - The World of Money", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Reading: From Job Seeker to Shop Owner (PDP)", "topic": "From Job Seeker to Shop Owner", "approach": "PDP", "objective": "By the end of the lesson, students will be able to guess the meaning of unfamiliar words from context, using the words around them, part of speech, word parts and contrast words, in a text about a young Moroccan business owner.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. asks: “What can people do when they lose their job?” and writes Ss' ideas on the board.", "Ss. look at the title and the three pictures and predict what the text is about (Task A). T. writes the predictions on the board.", "T. tells Ss: “There are new words in bold. Don't use a dictionary: today we guess!”"]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. read the text quickly and check their prediction (Task A); T. confirms and asks: “Is Kawtar's story happy or sad?”", "Ss. read again and answer True / False, justifying from the text (Task B); pair check; T. corrects.", "Ss. find the words that match the meanings, using the paragraph numbers (Task C); T. elicits and asks: “How did you find it?”", "T. presents the four clues in the box: words around it, part of speech, word parts, opposites / contrast words.", "Ss. guess the meaning of the three words in bold and say which clue helped them (Task D); T. checks and shows how each clue works."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["T. reads Kawtar's quote and asks: “Do you agree? What small business would you like to start in your town?”", "Ss. write their view in 3–4 sentences (Task E), then read them to a partner.", "Some Ss. read their ideas to the class; T. gives feedback and tells Ss that the next lessons continue Kawtar's story."]}]}, {"id": "cc-u9-l4", "level": "Common Core", "unit": 9, "unitName": "The World of Money", "unitDir": "Unit 9 - The World of Money", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Grammar Part 1: Past simple of irregular verbs (ECRIF)", "topic": "Past simple of irregular verbs", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the past simple of irregular verbs in the affirmative, negative and interrogative, and pronounce the -ed ending of regular verbs correctly (/t/, /d/, /ɪd/).", "words": ["worked", "saved", "wanted", "rented", "looked", "opened", "needed", "helped", "earned"], "point": "✓ Kawtar went to the bank. (same form for all persons: I / you / he / she / we / they went)", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “Remember Kawtar from the Reading lesson? What did she do three years ago?” and writes Ss' answers on the board.", "Ss. look at the pictures and read Hiba's interview with Kawtar.", "Ss. answer the gist questions: “How did Kawtar get the money? Did she sell many cakes at first?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the verbs in the past and complete the table of irregular verbs (Task A); T. checks on the board.", "T. elicits the rule with the Remember box: affirmative (same form for all persons), negative (didn't + base verb), questions and short answers (Did … ? — Yes, I did.).", "CCQs: “After didn't, do we say had or have?” (have) · “Do irregular verbs take -ed?” (no)", "T. reviews the -ed sounds with worked /t/, opened /d/, wanted /ɪd/; choral and individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the past simple of the verbs in brackets (Task B); pair check; T. corrects.", "Ss. put the regular verbs in the right column /t/, /d/, /ɪd/ (Task C) and say them aloud."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. make each sentence negative, then write a question and a short answer (Task D).", "Ss. ask and answer the questions with a partner; T. elicits answers and corrects the form."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write three true sentences about what they did with their money last month (Task E).", "Ss. read their sentences to a partner, who asks follow-up questions: “Did you …? What did you buy? How much did you spend?”", "Some Ss. report one thing about their partner; T. gives delayed feedback on did + base verb and -ed sounds."]}]}, {"id": "cc-u9-l5", "level": "Common Core", "unit": 9, "unitName": "The World of Money", "unitDir": "Unit 9 - The World of Money", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Grammar Part 2: Superlatives (ECRIF)", "topic": "Superlatives", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to compare three or more things using superlatives of short, long and irregular adjectives (the strongest, the most serious, the best).", "words": [], "point": "short: strong → the strongest · nice → the nicest · big → the biggest · easy → the easiest", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows three prices on the board (6 DH, 7.50 DH, 9 DH) and asks: “Which is cheaper? Which one is the cheapest?”", "Ss. look at the pictures and read the dialogue between Kawtar and Imane.", "Ss. answer: “Which supplier do they choose? Why?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the superlatives in the dialogue and complete the table (Task A); T. checks on the board.", "T. elicits the rules with the Remember box: short adjectives (+ -est, double consonant, y → -iest), long adjectives (the most + adjective), irregular (the best, the worst, the farthest).", "CCQs: “Atlas is the cheapest. Is there a cheaper supplier?” (no) · “How many things do we compare?” (three or more)", "Pronunciation: the cheapest /ðə ˈtʃiːpɪst/ — choral drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the superlative of the adjectives in brackets (Task B); pair check.", "T. corrects on the board and focuses on “the”: *Casablanca is biggest city → the biggest."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. read the table about the three phones and write sentences with superlatives (Task C).", "Ss. compare their sentences with a partner; T. elicits one sentence for each adjective."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["In groups, Ss. ask the questions in the box about money records in the class (Task D) and take notes.", "Ss. write three sentences about their group.", "One S. from each group reads the results; T. gives delayed feedback on the form."]}]}, {"id": "cc-u9-l6", "level": "Common Core", "unit": 9, "unitName": "The World of Money", "unitDir": "Unit 9 - The World of Money", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Writing: A story (Product)", "topic": "A story", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a short story about a lucky day, with a title, a setting, a problem, events in order and an ending, using the past simple, sequencers and correct punctuation.", "words": ["One day", "First", "Then", "After that", "Finally"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. shows the two pictures and asks: “What did the boy find? What can you do when you find money in the street?”", "Ss. read the model story and answer: “What did Anas find? What did he do?”", "Ss. write the numbers of the six story parts in the boxes (Task A); T. checks and highlights the sequencers (First, Then, After that, Finally) and the past simple verbs."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. complete Hind's story with the sequencers (Task B); pair check.", "Ss. rewrite the sentences with capital letters, commas, speech marks and question marks (Task C); T. shows the rule: “Thank you,” said Mr. Tazi."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. presents the task: “A lucky day: a person finds, loses or wins some money.” Ss. brainstorm ideas with a partner.", "Ss. plan their story in the outline (Task D) with the sentence starters: setting · problem · events · ending · lesson — notes only.", "Ss. tell their plan to a partner, who asks one question: “Where was she? What did he do next?” T. monitors and helps."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their story (60–80 words) in the writing frame (Task E).", "Ss. check their story with the self-check checklist and correct it. T. collects the stories for written feedback."]}]}], "resources": [{"group": "1st BAC", "name": "Ticket 1 (book)", "path": "1st BAC/Ticket 1.pdf"}, {"group": "Common Core", "name": "Outlook (book)", "path": "Common Core/Outlook.pdf"}, {"group": "Homework", "name": "Unit 1 Education: Simple Past & Reflexive Pronouns", "path": "1st BAC/Homework/Unit 1 Education — Homework  Simple Past & Reflexive Pronouns.pdf"}], "built": "2026-11-11"}</script>
<script id="search" type="application/json">{"bac-u1-l1": "Vocabulary Education Unit / ThemeUnit 1 — Education Level1st Baccalaureate CONTEXT Meet the words ✚ image ____________________ ✚ image ____________________ ✚ image ____________________ ✚ image ____________________ Leila's plans Read it twice, then underline the target words. Leila is a student in Taha Hussein high school. She always checks her timetable, so that she is never late. During the break, she revises in the playground with her friends. At the end of this year, she will graduate from high school and get her degree in physics stream. She is thinking of going abroad to continue her studies, where she can do more research in big libraries. She knows that studying in a foreign country is very expensive, so she will try to get a scholarship to cover her expenses. PRACTICE Work with the words A. Match each word with its meaning. Write the letter in the box. 1.graduatea.in or to a foreign country 2.degreeb.careful study to discover new facts 3.scholarshipc.to finish school/university successfully 4.abroadd.a chart showing when lessons begin and end 5.researche.money given to a student to pay for studies 6.timetablef.a qualification you get from a university B. Complete the sentences with the target words. Word bank: graduatedegreeabroadresearchscholarshiptimetable 1.Amina will ________________ from high school next year and go to the university. 2.I need to check my school ________________ to see what time we have our English class today. 3.Tariq is an excellent student, so he received a full ________________ to study for free. 4.My brother just finished and finally got his ________________ in mathematics. 5.The students went to the library to do some ________________ for their science project. 6.My cousin traveled to London because he wanted to live and study ________________. Teacher: Youssef Nejjar Unit 1 — Education PRACTICE Work with the words Education C. Odd one out. Cross out the word that does not ation Level1st Baccalaureate CONTEXT Meet the language ✚ image Debate in the classroom ✚ image Homework The dialogue Listen and read. Who is for homework every day? Who is against? Mrs Tazi: Today's question is: should students have homework every day? Salma: In my opinion, homework is useful. It helps us remember the lesson. Yassine: I diagree. We study seven hours a day. I think we need time to rest. Hind: You're right, Yassine. Personally, I'm always tired in the evening. Salma: I see your point, but a little homework every day is better than a lot before the exam. Yassine: That's true. Maybe twenty minutes a day? Salma: Exactly! Twenty minutes is fine. Hind: I don't think so! Ten minutes is enough. Mrs Tazi: Well, I believe you all have good ideas. Let's vote! EXPRESSIONS Focus on the expressions A. Find the expressions in the dialogue. Write each one in the right column. Giving an opinion Agreeing Disagreeing Teacher: Youssef Nejjar Practice Use the expressions B. Complete the mini-dialogues with the correct expression. In my opinion · I agree · I disagree · I see your point A:________________, school uniforms are a good idea. Everybody looks the same. B:________________. Parents don't spend a lot of money on clothes. A:I think Arabic and French are more important than English. B:________________. English is very important for university and for jobs. A:Online lessons are boring. We can't ask the teacher questions. B:________________, but they are very useful when a student is ill. C. Add your own words. React to each statement with a partner. # Cue / situation Your exchange 1. “Exams are the best way to test students.” → Disagree and give a reason. 2. “Boys and girls should study in the same class.” → Agree and add an idea. 3. “The school day should start at 9 a.m.” → Give your opinion. 4. “Private schools are better than public schools.” → Disagree politely. Free practice D. Over to you. Class council meeting: the school has money for ONE project. Role-play a READING A social problem: school dropout The text Read it twice: once quickly, then carefully. [1] Fatima Zahra is fourteen. She lives in a small village in the mountains near Azilal. Two years ago, she left school. “I loved my teacher and I was good at maths,” she says, “but the middle school is fifteen kilometres from my house.” Her story is not unusual. Every year, thousands of Moroccan children drop out of school, especially in the countryside. [2] Why do they leave? Poverty is the main reason. Some families cannot pay for books, clothes or transport, so children work on farms or in shops to help their parents. Distance is another problem: some villages have no middle school, and the roads are bad in winter. [3] Girls are often the first victims. Some parents think a girl does not need a diploma, or they are afraid to let her travel alone. As a result, many girls stay at home and help with the housework. [4] Today, the government and local associations are trying to help. The Tayssir programme gives money to poor families when their children go to school. School buses and boarding houses for girls, called Dar Taliba, help them continue their studies. And Fatima Zahra has good news: next September, she is going back to school. “This time,” she smiles, “I won't stop!” A. Read quickly. Tick (✓) the best title for the text. Life in the mountains of Azilal Why children leave school — and how to help them How to become a good maths student Teacher: Youssef Nejjar Reading · page 1 While you read Read for details and main ideas Reading B. True or False? Justify your answer from the text. TF 1.Fatima Zahra was a bad student. Answer: 2.Poverty is the main reason why children leave school. Answer: 3.Every village has a middle school. Answer: 4.Fatima Zahra is going back to school next year. Answer: C. Read again. Answer the questions. Main ideas and interpretation 1.What is the main idea of paragraph 2? Answer: 2.Why does Fatima Zahra say, “This time I won't stop!”? How does she feel? Answer: 3.What is the main idea of paragraph 4? Answer: AFTER READING D. Give your view. What is the best way to stop school dropout in your region? Give two reasons. Use: In my opinion… / I think… Teacher: Youssef Nejjar Reading · page 2 Teacher copy Answer key Do not hand out PDP stages Prepictures · predictDuringA skim · B T/F · C main ideasPostD Reading skills Skimminggist · AScanningdetails · BMain idea¶ · C1–3InferenceC4, D # Task Expected answer Line ref. 1 A Why children leave school — and how to help them ¶1–4 2 B1 F — “I loved my teacher and I was good at maths.” ¶1 3 B2 T — “Poverty is the main reason.” ¶2 4 B3 F — “some villages have no middle school” ¶2 5 B4 T — “next September, she is going back to school” ¶4 6 C1 Reasons: poverty and distance. ¶2 7 C2 Girls are the first victims / parents keep girls at home. ¶3 8 C3 Solutions: Tayssir, school buses, Dar Taliba. ¶4 A & B — answers Pre-reading: accept “children don't go to school / leave school”. A Title 2. B 1 F · 2 T · 3 F · 4 T — students must quote the text. New words (guess from context): poverty = being poor · countryside = rural areas · victim · diploma · housework C & Post-reading — notes C4 She is happy / determined; she knows school is important and now she has help. D Free answers: school buses, more schools in villages, help for poor families, talking to parents about girls' education. Pairs compare, then a short class vote. Link: reuse ideas in the Functions lesson (agree / disagree). Teacher: Youssef Nejjar Reading · Answer key", "bac-u1-l4": "Grammar The Simple Past · My Grandfather's School Days Unit / ThemeUnit 1 · Education Level1st Bac Context Meet the grammar ✚ image a louh (wooden board) ✚ image a village school in the 1960s The text Read. Did Hajj Ahmed go to high school? Why? Underline the past verbs. My grandfather, Hajj Ahmed, was born in a small village near Ouarzazate in 1956. When he was five, he went to the msid, the village Quranic school. He didn't have books or notebooks. He wrote on a wooden board, the louh, and he learned the Quran by heart. At seven, he started primary school. The school was six kilometres from his house, so he walked there every morning with his brother. There were fifty pupils in one classroom! The teacher was very strict, but my grandfather loved him. In 1968, he passed his primary school exam. Did he go to high school? No, he didn't. His family was poor, so he stopped school and worked with his father on the farm. — Salma Form Focus on the form A. Find examples in the text. Then complete the table. The first line is an example. Affirmative Negative Question Short answers Regular verbs He walked to school. He didn't walk to school. Did he walk to school? Yes, he did. / No, he didn't. Irregular verbs Be (singular) Be (plural) Remember • Regular verbs: verb + -ed → walked, loved, studied, stopped. • Irregular verbs: learn them by heart → go → went, have → had, write → wrote. • Negative and questions: didn't / Did + base verb → He didn't have books. Did he go…? • Be: I / he / she / it was · you / we / they were. • Time markers: yesterday · last year · in 1968 · two years ago · when I was five. Teacher: Youssef Nejjar Grammar · page 1 Practice Use the grammar Grammar B. Complete the sentences. Put the verbs in the simple past. Controlled practice 1.Hajj Ahmed ______________ (walk) six kilometres to school every day. 2.He ______________ (write) on a wooden board, the louh. 3.The pupils ______________ (not / have) books or notebooks. 4.______________ your father ______________ (go) to a public school? 5.In 1968, my grandfather ______________ (pass) his primary school exam. 6.The classroom ______________ (be) very small and cold in winter. 7.My parents ______________ (be) in the same primary school in Tetouan. 8.Last summer, Salma ______________ (study) English at a camp in Ifrane. C. Transform the sentences: make them negative, then make a yes/no question. Semi-controlled practice # Sentence Negative Ye  was shy, so I only said, “I'm Hind. I'm from Azrou.” The headmistress smiled and said, “Welcome, girls! Enjoy yourselves!” My roommate, Aya, showed me the laundry room, so now I wash my clothes myself. On Wednesday, a boy in my class hurt himself in PE, but he was OK. Every evening, Aya and I made ourselves a cup of mint tea and did our homework. At the weekend, I phoned my mum. She asked, “Are you taking care of yourself?” I answered, “Yes, Mum. I'm proud of myself!” Form Focus on the form A. Find examples in the text. Then complete the table. The first line is an example. Singular Reflexive (-self) Plural Reflexive (-selves) Example from the text I myself we ourselves I'm proud of myself. you you he / she they it — — Remember • Use a reflexive pronoun when the subject and the object are the same person: He hurt himself. • Singular → -self · plural → -selves. • by + myself = alone, without help: I did it by myself. • For emphasis: I wash my clothes myself. The school itself is old. • Common verbs: introduce · enjoy · hurt · cut · teach · take care of · be proud of. Teacher: Youssef Nejjar Grammar · page 1 Practice Use the grammar Grammar B. Complete the sentences with the correct reflexive pronoun. Controlled practice 1.I taught ______________ to swim when I was ten. 2.Omar cut ______________ with a knife in the school kitchen. 3.The new students introduced ______________ to the class. 4.Hind, please take care of ______________! 5.We enjoyed ______________ at the end-of-year school party. 6.My sister made the birthday cake ______________. 7.Look! The cat is washing ______________. 8.Children, did you do your homework by ______________? C. Rewrite with “by + reflexive pronoun”. Then make a simple past question. Semi-controlled practice · line 1 is an example # Sentence Rewrite: … by …self Question (simple past) 1. Nobody helped me with my homework. I did my homework by myself. Did you do your homework by yourself? 2. Nobody helped Salma to prepare for the exam. 3. ation, which helps people in need. PRACTICE Work with the words A. Match words (1–7) with their definitions (a–g). Write the letter in the box. 1.childhooda.a difference in ideas and behaviour between older and younger people 2.adolescenceb.independence 3.generation gapc.period of life from 13 to 18 years old 4.autonomyd.the capacity of respecting the opinions, religion or behaviour of others 5.tolerancee.period of life from birth to 13 years old 6.homelessf.without an occupation 7.joblessg.without a home / house PRACTICE Work with the words Vocabulary B. Complete the sentences with words from the box. ( autonomy - homeless - childhood - tolerance - jobless - generation gap - adolescence ) 1.My uncle has been for a year; he is looking for a job in a factory. 2.My grandmother spent her in a village in the Atlas Mountains. 3.There is a between Hamza and his father: they never agree on music or clothes. 4. means accepting people who have different ideas, religions or ways of life. 5.After the fire, the family was , so they stayed with their neighbours. 6.Between 13 and 18, during , teenagers change a lot. 7.Nadia is eighteen now. She wants more : she wants to make her own decisions. C. Odd one out. Cross out the word that does not belong. Say why. 1.childhoodadolescenceold agehomeless 2.joblesshomelesspoortolerance 3.tolerancerespectautonomygeneration gap 4.parentschildrengeneration gapunemployment D. Complete the sentences about you and your society. Use your own ideas. 1.The best memory of my childhood is 2.Teenagers need more autonomy because 3.A big problem for young people in my town is 4.In my family, the generation gap appears when 5.We can help homeless people by Production Then and now. Write 4–5 sentences comparing teenagers' life in your grandparents' time and today. Use at least four of the new words. 1. 2. 3. 4. 5. Teacher copy Answer key — society vocabulary Do not hand out ECRIF stages EContext textCTask A + drillingRTasks B, CITask DFProduction # Word A Stress Pronunciation / note 1 childhood e Oo /ˈtʃaɪldhʊd/ — “-hood” = a period 2 adolescence c ooOo /ˌædəˈlesns/ 3 generation gap a ooOo O /ˌdʒenəˈreɪʃn ɡæp/ 4 autonomy b oOoo /ɔːˈtɒnəmi/ 5 tolerance d Ooo /ˈtɒlərəns/ 6 homeless g Oo /ˈhəʊmləs/ — home + -less = without 7 jobless f Oo /ˈdʒɒbləs/ — job + -less = without B & C — answers B. 1 jobless · 2 childhood · 3 generation gap · 4 Tolerance · 5 homeless · 6 adolescence · 7 autonomy C. 1 homeless (not a period of life) · 2 tolerance (a value, not a social problem) · 3 generation gap (not a value) · 4 unemployment (not about family / generations) Board (Clarify): Stages of life: childhood → adolescence · Family: generation gap, autonomy · Values: tolerance · Social problems: homeless, jobless D & Production — notes D. Accept any correct, personal endings; check the target word is used with its meaning. Production e.g. In my grandparents' time, young people had little autonomy. Today, teenagers have more autonomy, but there is a generation gap … Check: four words, then/now contrast, spelling of adolescence, tolerance, autonomy.", "bac-u2-l2": "Functions Complaining Unit / ThemeUnit 2 - Society Level1st Bac Before you read Meet the language ✚ image Racing motorbikes at night ✚ image A radio phone-in programme A. What makes people angry in a neighbourhood? Tick (✓) three problems you expect to read about. Then read and check. noise at nightrubbish in the streetsexpensive breadunemploymentno green spacesbad internet While you read Radio Atlas (phone-in dialogue) Leila: Welcome to “Your Voice” on Radio Atlas. Our first caller is Mr. Tazi from Meknes. Mr. Tazi: I'm really fed up with the noise in my street. Young men race their motorbikes until two in the morning. I'm afraid I have to say the police don't do enough. In my opinion, parents should control their children more. Leila: I'm sorry to hear that. Now, Karima from Fes. Karima: I'd like to complain about the rubbish in our neighbourhood. The bins are always full. I ion + reason → polite response. Monitor intonation; delayed correction.", "bac-u2-l3": "Reading Then and now: a grandfather remembers Unit / ThemeUnit 2 - Society Level1st Bac Before you readLook at the title and the pictures. Do Task A before you read. ✚ image A big family meal in the past ✚ image A busy modern city street ✚ image A teenager alone with his phone A. Predict: tick (✓) the ideas you expect to find in the text.Then read quickly and check. Families were bigger in the past. Teenagers had more freedom in the past than today. Neighbours helped each other in the past. There are new social problems in today's society. READING The text Read it twice: once quickly, then carefully. Then and Now — by Salma Alaoui [1] Last weekend, I interviewed my grandfather, Hajj Driss, for our school magazine. He is seventy-eight and he grew up in a small village near Ifrane. I asked him how society has changed since his childhood. His answers surprised me. [2] “When I was young, families were big,” he said. “My parents, my grandparents, my uncles and their children all lived in the same house, and nobody ate alone. Neighbours were like relatives: if a family had a problem, the whole village helped. Hospitality was a duty, and a traveller always found food and shelter in any home. Teenagers had little freedom. We obeyed our parents and started working very early. Life was hard, but we were rarely bored.” [3] When I asked him about today's society, he became serious. “Life is easier now. You have schools, hospitals and the internet. But people are lonelier. Families are smaller, and some young people spend more time with their phones than with their parents, and there is a real generation gap: parents and children often do not understand each other. In big cities I see homeless people in the streets, and many young graduates are jobless. In my time, divorce was rare; now it is more common.” [4] Finally, I asked him if he wanted to go back to the past. He smiled. “No, my dear. Every generation has its problems. Keep the good values of the past — respect, solidarity and tolerance — and use the new opportunities to build a better society.” While you read Understand the text Reading B. Skim the text. Were your predictions in A right? Now tick (✓) the best title. Village life is better than city life How society has changed The dangers of the internet for teenagers C. True or false? Justify your answer from the text. TF 1.Hajj Driss grew up in a big city. Justification: 2.In the past, neighbours helped each other. Justification: 3.Teenagers in his time had a lot of freedom. Justification: 4.Hajj Driss wants to go back to the past. Justification: D. Answer the questions.Q3: read between the lines. 1.Why does Hajj Driss think people are “lonelier” today? Give two reasons. Answer: 2.Which social problems does he see in today's society? Answer: 3.What does he mean by “Every generation has its problems”? Answer: E. Word association: find words in the text associated with each idea.At least three words each. Values of the past Social problems today Modern life AFTER READING F. Do you agree with Hajj Driss? Was life better in the past? Write 3–4 sentences giving your opinion, then compare with a partner. Teacher copy Answer key — then and now Do not hand out PDP stages Prepictures + A (predict)DuringB skim/check · C T/F · D detail & inference · E word associationPostF opinion # Task Expected answer Line ref. A Prediction 1 ✓ · 2 ✗ (they had little autonomy) · 3 ✓ · 4 ✓ whole text B Skimming Title 2 — How society has changed: a grandfather's view whole text C1 True / False F — “he grew up in a small village near Ifrane” para 1 C2 True / False T — “if a family had a problem, the whole village helped” para 2 C3 True / False F — “Teenagers had little autonomy.” para 2 C4 True / False F — “No, my dear. Every generation has its problems.” para 4 D1 Detail Families are smaller; young people spend more time with their phones than with their parents. para 3  to play. Did I use to play? Yes, I did. / No, I didn't. She She get up early. She go to school. she bake? Yes, she . / No, she . We / They They visit us. We watch TV. they sit together? Yes, they . / No, they . Remember used to + base form = a past habit or state that is not true now: I used to get up at dawn. (now I don't) Negative: didn't use to ✓ didn't used to ✗ · Question: Did + subject + use to …? ✓ Did you used to ✗ Present habits: present simple + usually: Now she usually watches TV. · Say it: used to = /ˈjuːstə/ Practice Use the grammar Grammar B. Complete with the correct form of used to and the verb in brackets. Affirmative, negative or question. 1.When my father was young, he (walk) five kilometres to school. 2.My grandparents (not / have) a fridge. 3. you (play) in the street when you were a child? 4.People (write) letters; now they send messages. 5.Hamza (not / like) vegetables, but now he loves them. 6.In the past, families (eat) together every evening. 7. your mother (live) in a village? — Yes, she . 8.There (be) a cinema in our town, but it closed ten years ago. C. Then and now: write a sentence about Mr. Bennani's life with used to / didn't use to and now. The first one is an example. # Then (1985) Now Your sentence 1. lived in a village near Taza lives in Casablanca He used to live in a village, but now he lives in Casablanca. 2. rode a bicycle to work drives a car 3. had no phone has a smartphone 4. visited his neighbours every day rarely sees his neighbours 5. didn't watch TV watches TV every evening Free practice D. When I was a child … Write four true sentences about your childhood with used to / didn't use to. Then interview your partner. Useful questions Did you use to play …? · Where did you use to …? · Did you use to be afraid of …? · What did you use to watch …? 1. 2. 3. 4. Report about your partner: “Nadia used to live in Errachidia, but she didn't use to …” 1. 2. Teacher copy Answer key — used to Do not hand out ECRIF stages EContext dialogueCTask A + RememberRTask BITask CFTask D # Task Expected answer Note A She She used to get up early · She didn't use to go to school · Did she use to bake? · Yes, she did. / No, she didn't. A We / They They used to visit us · We didn't use to watch TV · Did they use to sit together? · Yes, they did. / No, they didn't. B 1–4 1 used to walk · 2 didn't use to have · 3 Did … use to play · 4 used to write B 5–8 5 didn't use to like · 6 used to eat · 7 Did … use to live · did · 8 used to be state verb (be) C 2–3 He used to ride a bicycle to work, but now he drives a car. · He didn't use to have a phone, but now he has a smartphone. C 4–5 He used to visit his neighbours every day, but now he rarely sees them. · He didn't use to watch TV, but now he watches it every evening. D Free Accept any true sentences; check use after did / didn't and the report in the 3rd person. delayed feedback Encounter & Clarify — notes Gist: She used to get up at dawn, fetch water and bake bread. CCQs: Does Grandma fetch water now? (No) · Did she do it once or many times? (many times: a habit) · Is it true now? (No) Timeline: past ✕✕✕✕ | now ✗ Typical errors *I didn't used to … → I didn't use to … *Did you used to …? → Did you use to …? *I use to play every day (now) → I usually play … *She used to going → She used to go", "bac-u2-l5": "Grammar Articles: a, an, the — or no article Unit / ThemeUnit 2 - Society Level1st Bac Context Meet the grammar ✚ image A homeless shelter in the old medina ✚ image Young volunteers serving soup Salma's diary Read. Where did Salma and Yassine go? Who did they help? Last Saturday, my brother Yassine and I volunteered at a shelter in the old medina of Meknes. The shelter helps homeless people: it gives them a hot meal and a bed for the night. When we arrived, an old man was waiting at the door. The man was cold and hungry, so I gave him a cup of tea. Yassine served soup with Nadia, a volunteer from our neighbourhood. She is a nurse at the hospital near our school. At the end of the evening, the manager of the shelter thanked us. “Volunteers are the heart of this place,” she said. I think young people should help others. It was an unforgettable experience. Form Focus on the use A. Find examples in the text. Complete the table. The first line is an example. When do we use it? Article Example from the text a singular noun mentioned for the first time a / an a shelter, an old man a noun mentioned before (second time) the a job a / an a specific or unique thing (we know which one) the plural or uncountable nouns in general Ø (no article) Remember a + consonant sound: a bed, a university /j/, a European city · an + vowel sound: an old man, an hour (silent h), an honest girl the: second mention, unique things (the sun, the internet), specific things (the hospital near our school), superlatives (the best) Ø: general plurals and uncountables (Homeless people need help.), cities and most countries (Meknes, Morocco), at home / to school Practice Use the grammar Grammar B. Complete with a, an, the or Ø (no article). 1.My cousin is engineer. He works for big company in Tangier. 2.I watched documentary last night. documentary was about homeless children. 3. sun rises in east. 4.Karim waited for hour at bus stop near our school. 5.Is there youth club in your town? 6.Nadia is honest girl. She is best student in our class. 7. unemployment is serious problem for young graduates. C. Complete the text with a, an, the or Ø. Then explain your choice to your partner: first mention? job? general? Last year, my uncle opened 1 association in Fes. 2 association helps 3 handicapped children to go to school. Every week, 4 volunteers teach them reading and 5 art. My uncle's best helper is 6 old teacher called Mr. Lahlou. 7 teacher has worked with children for thirty years. For me, my uncle is 8 kindest person in our family. Free practice D. A person who helps others. Write 5–6 sentences about a person or an association that helps people in your town o support them, and every guest found food and shelter. Moreover, young people didn't use to have much autonomy. They obeyed their parents and started working very early. In short, life was harder in the past, but people were closer to each other than they are today. A. The parts of a paragraph. Write the number of each part in the boxes. Then circle the connectors. 1 topic sentence (the main idea)2 supporting idea + detail3 concluding sentence Controlled practice Organise the ideas B. Put Karim's paragraph in the right order. Number the sentences 1–6. Finally, in the evening, he used to help his parents in the fields. My father's childhood in Ouarzazate was very different from mine. In conclusion, his childhood was simple but happy. First, he didn't use to have toys; he used to make them from wood and old tins. Also, his family didn't have a TV, so they used to listen to the radio together. Second, he used to walk six kilometres to school every morning. Controlled practice Connectors Writing C. Complete with the connectors. ( First - Also - However - Finally - In short ) 1. , my grandmother used to wake up before sunrise. 2.She used to bake bread. , she used to fetch water from the well. 3.She worked very hard. , she was always smiling. 4. , she used to tell us stories before we slept. 5. , her life was hard, but it was full of love. Guided writing Plan your paragraph D. Topic: How life used to be when my parents or grandparents were young. Ask them, then write notes. Part Sentence starters My notes Topic sentence When my … was young, life used to be … Supporting idea 1 First, … used to … because … Supporting idea 2 Second, / Also, … didn't use to … Supporting idea 3 Moreover, … However, … Concluding sentence In short, … Free writing E. Write your paragraph (100–120 words). Give it a title. Title: Check your paragraph ✓ a titlea clear topic sentencethree supporting ideasconnectors: First, Also, Moreover, In shortused to / didn't use to + base forma concluding sentencecapital letters and full stops100–120 words Teacher copy Answer key — writing about past habits Do not hand out Product approach Modelparagraph + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Stage A Parts Boxes from top to bottom: 1 · 2 · 2 · 2 · 3 — connectors: First, Second, Moreover, In short Model B Order 5 · 1 · 6 · 2 · 4 · 3 (top to bottom) → My father's childhood … / First … / Second … / Also … / Finally … / In conclusion … Controlled C Connectors 1 First · 2 Also · 3 However · 4 Finally · 5 In short Controlled D Plan Notes only (e.g. father · village near Taza · walked to school · no electricity · stories · visits on Friday) Guided E Paragraph See model answer; mark with the guide Free E — model answer (≈ 115 words) Life Used to Be Different When my father was young in a village near Taza, life used to be very different from life today. First, he used to walk five kilometres to school, and he didn't use to have a bicycle. Second, there was no electricity, so families used to sit together in the evening and tell stories. Also, children used to play traditional games in the street with their neighbours. Moreover, relatives used to visit each other every Friday and share couscous. However, many families were poor and life was hard. In short, my father's childhood was simple, but people were closer to each other than they are today. Marking guide (/10) Organisation (title, topic sentence, 3 supporting ideas, conclusion) — 3 Content (clear past habits, details) — 2 Language (used to / didn't use to, past simple, connectors) — 3 Mechanics (capitals, punctuation, spelling) — 2 Typical errors: *didn't used to · *used to going · no topic sentence · list of ideas without connectors", "bac-u3-l1": "Vocabulary Health, illness & fitness Unit / ThemeUnit 3 - Health and Welfare Level1st Bac CONTEXT Meet the words ✚ image a teenager in bed with flu ✚ image a doctor examining a patient ✚ image a pharmacy ✚ image a boy jogging in the park The text Read Ya hree times a week to . D. Complete the sentences about you. ( catch a cold - take medicine - keep fit - go on a diet - see a doctor - have a check-up ) 1.When I catch a cold, I usually 2.To keep fit, I 3.People should see a doctor when 4.I think teenagers shouldn’t go on a diet because 5.It’s important to have a check-up Production E. Make it yours. Your cousin is often ill and tired. Write him / her a short message with tips to stay healthy. Use at least six words from this lesson. 1. 2. 3. 4. 5. 6. Teacher copy Answer key — health, illness & fitness Do not hand out ECRIF stages Epictures + textCTasks A, BRTask CITask DFTask E # Task Expected answer Note A Matching 1-c · 2-e · 3-b · 4-a · 5-f · 6-d Clarify B Illnesses flu · diabetes · asthma · a cold Clarify B Symptoms fever · cough · headache · sore throat B Treatment tablets · injection · cough syrup B Fitness balanced diet · jogging · eight hours of sleep C 1–7 1 examined · 2 symptoms · 3 prescription · 4 recovered · 5 junk food · 6 check-up · 7 keep fit Remember D 1–5 Personal answers, e.g. … I stay in bed, drink hot drinks and take medicine. Internalize E Message Free; check 6+ target words used correctly Fluently use Encounter & Clarify — notes Gist: He had a high fever, a sore throat and a terrible cough (flu). Stress: Oo symptom, fever, tablets · oOo prescription, recover · Oo check-up · oOoo obesity Sounds: cough /kɒf/ · throat /θrəʊt/ · disease /dɪˈziːz/ CCQs: Do you need a prescription to buy aspirin? Is flu a symptom or an illness? Collocations (Task D) catch a cold / the flu · take medicine / tablets · keep fit · go on a diet · see a doctor · have a check-up Typical errors: *take a cold → catch a cold · *make sport → do sport · *a medicine → some medicine · *receipt → prescription E — sample: You should eat a balanced diet and avoid junk food. Keep fit: go jogging twice a week. If you catch a cold, see a doctor and get a prescription.", "bac-u3-l2": "Functions What’s the matter? · You should … Unit / T
