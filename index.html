ntist? B:I’m scared of dentists! A: , I’d make an appointment today. B:OK. That’s a good . Thanks, Nadia. E. Write a short exchange for each situation. Ask about the problem, then give advice. # Situation Your exchange (ask for and give advice) 1. Your friend Rania has a bad cold. Her exam is tomorrow. 2. Your little brother eats a lot of sweets. He has toothache. 3. Your classmate Mehdi can’t sleep because of exam stress. 4. Your neighbour, Mr. Fassi (60), wants to lose weight. Free practice F. Over to you. Role-play with your partner. Don’t look at the dialogue. Student A — role card You have a health problem: choose one — back pain from a heavy schoolbag · always hungry and tired in class · a sprained ankle before a match. Tell B how you feel and since when. Ask for advice: “What should I do?” Accept or refuse each idea politely. Student B — role card Your friend doesn’t look well. Ask “What’s the matter?” Show sympathy. Give at least three pieces of advice: You should … · Why don’t you …? · If I were you, I’d … · You’d better … End with “I hope you feel better soon!” Then swap roles. Teacher copy Answer key — seeking & giving advice Do not hand out ECRIF stages Epictures + Tasks A, BCdialogue + Task CRTask DITask EFTask F # Task Expected answer Stage A Listening 1 sore throat, cough, body aches · 2 38.5 (a fever) · 3 yesterday evening · 4 a maths test this afternoon · 5 go home and rest, see a doctor, drink warm drinks with honey and lemon · 6 take medicine without a prescription Encounter B Attitude a worried (“I’m really worried”) · b sympathetic (“Oh dear”, “Don’t worry, dear”) · c relieved (“That’s a relief!”) Encounter C Expressions Problems: What’s wrong? · I don’t feel well. · I’ve got a terrible headache. · Asking: What should I do? · Can you give me some more advice? · Giving: You should … · If I were you, I’d … · Why don’t you …? · You’d better … · Responding: I’m sorry to hear that. · That’s a good idea. · I’ll try. · I hope you feel better soon! Clarify D Gaps 1–7 What’s the matter · a toothache · sorry · should · Why don’t you · If I were you · idea Remember E Exchanges e.g. “What’s wrong, Rania?” — “I’ve got a bad cold.” — “You should drink hot drinks and go to bed early.” Internalize F Role-play Check: problem + since when, 3 pieces of advice, sympathy, polite responses Fluently use Tapescript — Salma and the school nurse (Tasks A & B) Nurse: Come in, Salma. Sit down, please. What’s the matter? Salma: I feel awful. I’ve got a sore throat and I can’t stop coughing. Nurse: Oh dear. Have you got a temperature? Salma: I think so. I feel hot and my whole body aches. Nurse: Let me check … 38.5. You’ve got a fever. When did it start? Salma: Yesterday evening. I’m really worried. I’ve got a maths test this afternoon. Nurse: Don’t worry, dear. Your health comes first. You should go home and rest. I’ll call your parents. Salma: Should I take an aspirin? Nurse: No, you shouldn’t take any medicine without a prescription. It’s better to see a doctor. And drink warm drinks with honey and lemon. Salma: What about the test? Nurse: I’ll tell your teacher, Mr. Tazi. You can take it next week. Salma: Oh, thank you, Mrs. Alaoui. That’s a relief! Clarify — form & pronunciation Form: should / shouldn’t + base verb · Why don’t you + base verb? · If I were you, I’d + base verb · You’d better + base verb (not *to see) Pronunciation: silent l in should /ʃʊd/ · ache /eɪk/ · cough /kɒf/ · stress the key words: You SHOULD see a DOCtor. · falling, sympathetic tone: I’m SOrry to HEAR that. CCQs: “You’d better see a doctor” — is it strong or weak advice? (strong) · Does “If I were you” talk about me or you? (the speaker imagines being you)", "bac-u3-l3": "Reading Healthy teens, happy teens Unit / ThemeUnit 3 - Health and Welfare Level1st Bac Before you readLook at the title and the pictures. What is the text about? Do Task A before you read. ✚ image a tired student in class ✚ image a healthy breakfast ✚ image teenagers riding bikes ✚ image a school magazine A. Predict: tick (✓) what the text is about. Then read quickly and check. A doctor gives teenagers advice about healthy daily habits. A student describes a serious disease and its treatment. A sports coach explains the rules of a school football match. READING Read the text The text Read it twice: once quickly, then carefully. Ask the Doctor: Healthy Teens, Happy Teens by Dr. Salma Idrissi, Moulay Idriss High School magazine, Fez ¶1 Every week, our school magazine receives letters from students who feel tired, stressed or unwell, and I answer some of them every month. Most of these problems do not need medicine. They come from our daily habits. Here are my four keys to good health. ¶2 First, sleep well. Teenagers need eight to ten hours of sleep a night, but many of them stay up late chatting or playing video games. Without enough sleep, your brain cannot concentrate in class, and your body becomes weak against colds and flu. ¶3 Second, eat a balanced diet. Start the day with a good breakfast, such as bread, eggs, fruit and a glass of milk. Avoid junk food and sugary drinks, which can lead to obesity and tooth decay. Drink at least six glasses of water a day: a lot of headaches are simply caused by dehydration. ¶4 Third, keep fit. You do not have to join a gym. Doctors recommend about one hour of physical activity a day for young people, and a thirty-minute walk, a football match with friends or a bike ride is a good start. Regular exercise strengthens your heart and also improves your mood. ¶5 Finally, take care of your mind. Exams, family problems and social media can cause stress. Talk to someone you trust, organise your time and take short breaks from your phone. If you feel sad or anxious for a long time, do not hesitate to see a doctor. ¶6 Remember: prevention is better than cure. Small changes today will protect your health tomorrow. B. Skim the text. Tick (✓) the sentence that gives its main idea.Read the first lines of each paragraph. Teenagers should take medicine when they feel tired. Simple daily habits can prevent most teenagers’ health problems. Sport is more important than sleep and food. WHILE YOU READ Use reading strategies C. Scan: true or false? Justify with words from the text. TF 1.According to the doctor, most of the students’ problems need medicine. Answer: 2.Lack of sleep makes it easier to catch colds. Answer: 3.You must go to a gym to keep fit. Answer: 4.Teenagers should see a doctor if they feel anxious for a long time. Answer: D. Guess from context: what do these words mean?Use the sentence around the word. 1.“concentrate” (¶2) Meaning: 2.“dehydration” (¶3) Meaning: 3.What does the doctor mean by “prevention is better than cure” (¶6)? Meaning: E. Take notes: write the doctor’s main advice for each key in a few words.Notes, not full sentences. 1.Sleep (¶2) Notes: 2.Food and water (¶3) Notes: 3.Exercise (¶4) Notes: 4.The mind (¶5) Notes: AFTER READING F. Summarise the text in 4–5 sentences, using your notes from Task E.Start: In this article, Dr. Idrissi gives teenagers four pieces of advice … Teacher copy Answer key — healthy teens, happy teens Do not hand out PDP stages Prepictures + Task ADuringTasks B, C, D, EPostTask F # Task Expected answer Line ref. A Prediction Option 1 — a doctor gives teenagers advice about healthy daily habits. title, pictures B Skimming Option 2 — simple daily habits can prevent most teenagers’ health problems. first lines C1 True / False False — “Most of these problems do not need medicine.” ¶1 C2 True / False True — “your body becomes weak against colds and flu.” ¶2 C3 True / False False — “You do not have to join a gym.” ¶4 C4 True / False True — “If you feel sad or anxious for a long time, do not hesitate to see a doctor.” ¶5 D Context 1 focus your attention · 2 not having enough water in the body · 3 it is better to stop a problem before it starts than to treat it ¶2–¶6 E — notes Sleep: 8–10 hours a night; don’t stay up late on phones / games. Food & water: good breakfast; avoid junk food & sugary drinks; 6+ glasses of water a day. Exercise: 30-min walk, football, bike — no gym needed. Mind: talk to someone, organise time, phone breaks; see a doctor if sad / anxious. Strategies: predict (title, pictures) → skim (first lines) → scan (key words) → guess from context. F — model summary (≈ 60 words) In this article, Dr. Idrissi gives teenagers four pieces of advice to stay healthy. First, they should sleep eight to ten hours a night. Second, they should eat a balanced diet and drink a lot of water. Third, they should exercise regularly. Finally, they should take care of their mind and see a doctor if they feel anxious for a long time. Link: the text prepares the Writing lesson (a letter to Dr. Idrissi asking for advice).", "bac-u3-l4": "Grammar Modals: advice, obligation & possibility Unit / ThemeUnit 3 - Health and Welfare Level1st Bac Context Meet the grammar ✚ image Hamza hurts his ankle in a match ✚ image Hamza at the doctor’s The dialogue Read. What’s wrong with Hamza? Can he play in the final? Dr. Bennani: Hello, Hamza. What’s the matter? Hamza: I fell during a basketball match, and my ankle hurts a lot. Dr. Bennani: Let me see … It might be a sprain, but it could also be a small fracture. You must have an X-ray today. Hamza: Do I have to stay in hospital? Dr. Bennani: No, you don’t have to. But you mustn’t walk on your foot for a week. You should put ice on it three times a day. Hamza: Will I play in the final next Sunday? Dr. Bennani: I’m afraid not. You may feel better in ten days, but you shouldn’t play for three weeks. Hamza: Should I take any medicine? Dr. Bennani: Yes. You have to take these painkillers twice a day, after meals. Form Focus on form and meaning A. Underline the modals in the dialogue. Then complete the table. ( advice - obligation - no obligation - prohibition - possibility ) Modal Function Example from the dialogue should / shouldn’t must / have to don’t have to mustn’t may / might / could Remember Modal + base verb: You should rest. ✓ You should to rest ✗ · She musts ✗ → She must / She has to · Questions: Should I …? / Do I have to …? mustn’t = it is forbidden ✗ · don’t have to = it isn’t necessary (you can choose) · may / might / could = it is possible, we aren’t sure. Practice Use the grammar B. Circle the correct modal. Think: advice, obligation, prohibition or possibility? 1.You look very tired. You ( should / mustn’t ) go to bed earlier. 2.You ( mustn’t / don’t have to ) smoke in hospitals. It’s against the law. 3.Don’t eat that old fish. You ( might / should ) get food poisoning. 4.The school nurse is free, so students ( don’t have to / mustn’t ) pay to see her. 5.Salma has a high fever and a cough. She ( could / has to ) have the flu. 6.Before a blood test, you ( mustn’t / don’t have to ) eat anything for twelve hours. 7.You ( shouldn’t / don’t have to ) drink so many fizzy drinks. They are bad for your teeth. 8.My grandmother is diabetic. She ( has to / may ) take her medicine every day. C. Write a sentence for each situation. Use the modal given. # Situation Use Your sentence 1. Your friend Omar has had a toothache for three days. should 2. A sign at the swimming pool: take a shower before you swim. must / have to 3. A rule for hospital visitors: no noise, no phones in the rooms. mustn’t 4. Is the pharmacy open on Sunday? You aren’t sure. may / might 5. Tomorrow is a holiday. There are no classes. don’t have to Free practice D. Our healthy school charter. Write six rules and tips for a healthier school: use must / have to, mustn’t, don’t have to, should / shouldn’t and one sentence with might. 1. 2. 3. 4. 5. 6. Teacher copy Answer key — modals Do not hand out ECRIF stages EContextCTask A + ruleRTask BITask CFTask D # Task Expected answer Note A should(n’t) advice — You should put ice on it. · You shouldn’t play for three weeks. Clarify A must / have to obligation — You must have an X-ray today. · You have to take these painkillers. A don’t have to no obligation — No, you don’t have to (stay in hospital). A mustn’t prohibition — You mustn’t walk on your foot for a week. A may / might / could possibility — It might be a sprain. · It could be a small fracture. · You may feel better in ten days. B 1–8 1 should · 2 mustn’t · 3 might · 4 don’t have to · 5 could · 6 mustn’t · 7 shouldn’t · 8 has to Remember C 1–5 1 He should see a dentist. · 2 You must / have to take a shower before you swim. · 3 Visitors mustn’t make noise or use their phones. · 4 The pharmacy may / might be open. · 5 We don’t have to go to school tomorrow. Internalize D Charter Accept any correct rules and tips (see sample). Fluently use Encounter & Clarify — notes Gist: He hurt his ankle (maybe a sprain or a fracture). No, he can’t play in the final. CCQs: “You mustn’t walk” — can he walk? (No) · “You don’t have to stay in hospital” — can he stay if he wants? (Yes, but it isn’t necessary) · “It might be a sprain” — is the doctor sure? (No) Pronunciation: mustn’t /ˈmʌsnt/ (silent t) · have to /ˈhæftə/ · should /ʃʊd/ D — sample & typical errors Sample: Students must wash their hands before lunch. · We have to do sport twice a week. · Students mustn’t bring fizzy drinks to class. · You don’t have to buy water: there are free fountains. · We should eat fruit at break. · If we don’t sleep enough, we might fail our exams. Errors: *You should to rest · *She musts · *You mustn’t pay (= not necessary → don’t have to) · *Do I must …? → Do I have to …?", "bac-u3-l5": "Grammar The present perfect: I’ve changed my habits! Unit / ThemeUnit 3 - Health and Welfare Level1st Bac Context Meet the grammar ✚ image Yassine playing basketball ✚ image a yoga class The message Read Yassine’s message. What has he changed? From: Yassine · To: Imane Hi Imane, Guess what? I’ve changed my habits! I’ve followed Dr. Idrissi’s advice for six weeks now. I’ve stopped playing games after ten o’clock, and I’ve gone to bed before eleven every night since the beginning of d 2019. 3.Has Mehdi finished his treatment ? 4.We’ve been to a hospital. It’s a new experience for us. 5.Karim has had a cough last Friday. 6.They’ve arrived. They’re in the waiting room now. Free practice D. My healthy changes. Write a message to a friend (5–6 sentences): what you have / haven’t done this year to stay healthy, and one question with Have you ever …? 1.Hi …, this year I’ve 2. 3. 4. 5. 6.Have you ever Teacher copy Answer key — the present perfect Do not hand out ECRIF stages EContextCTask A + ruleRTask BITask CFTask D # Task Expected answer Note A I / You … I haven’t eaten · Have you ever tried …? — Yes, I have. / No, I haven’t. Clarify A He / She / It She has started · She hasn’t tried · Has she lost weight? — Yes, she has. / No, she hasn’t. A Time words since: a point in time (since last week) · never: not at any time · just: a very short time ago · yet: up to now (negatives & questions, at the end) B 1–4 1 has started · 2 have never broken · 3 Have … had · 4 has worked Remember B 5–8 5 haven’t seen · 6 have just come · 7 has already recovered · 8 Has … called C 1–6 1 for · 2 since · 3 yet · 4 never · 5 since · 6 already Internalize D Message Free; check have / has + past participle, for / since, word order of just / already / never Fluently use Encounter & Clarify — notes Gist: He goes to bed early, he has joined the basketball team, he doesn’t eat crisps, he has lost three kilos. CCQs: “I’ve joined the team” — is he in the team now? (Yes) · “for six weeks” — did he start six weeks ago? (Yes) · “I haven’t tried it yet” — will he maybe try? (Yes) Pronunciation: weak forms: I’ve /aɪv/ · has /həz/ · Have you ever …? /həvjʊˈevə/ D — sample & typical errors Sample: Hi Rania, this year I’ve made some healthy changes. I’ve joined a swimming club, and I’ve stopped drinking fizzy drinks. I haven’t been ill since November. I’ve already lost two kilos! Have you ever tried swimming? Errors: *I have stop → I have stopped · *She have → She has · *since two months → for two months · *I have seen him yesterday → I saw him yesterday", "bac-u3-l6": "Writing A letter asking for advice Unit / ThemeUnit 3 - Health and Welfare Level1st Bac Model Read Yassine’s letter to Dr. Idrissi ✚ image Yassine, a tired student ✚ image the “Ask the Doctor” page The model letter What is Yassine’s problem? What does he ask? Dear Dr. Idrissi, I am a sixteen-year-old student at Moulay Idriss High School in Fez, and I always read your page in our school magazine. I am writing to ask for your advice about a problem that worries me a lot. For the last two months, I have felt tired all the time. I go to bed after midnight because I play games on my phone, so I often wake up late and miss breakfast. In class, I cannot concentrate and I often get headaches. I have also put on five kilos because I eat crisps and drink fizzy drinks every day. What do you think I should do? Should I see a doctor, or can I change my habits on my own? I would be very grateful for your help. I look forward to hearing from you. Yours sincerely, Yassine Amrani A. The parts of a letter asking for advice. Write the numbers in the boxes of the letter. 1 greeting2 introduction: who I am3 reason for writing4 the problem (details)5 asking for advice6 closing sentence7 closing phrase8 signature Controlled practice Useful expressions & connectors B. Complete the expressions from the letter. ( writing - worries - should - tell - grateful - hearing ) 1.I am to ask for your advice. 2.I have a problem that me a lot. 3.What do you think I do? 4.Could you me how to sleep better? 5.I would be very for your help. 6.I look forward to from you. C. Join the sentences with the connector in brackets. Use capital letters and full stops. 1.I feel stressed. I have exams next week. (because) 2.I don’t eat breakfast. I’m hungry in class. (so) 3.I have tried to sleep early. I can’t. (but) 4.I get headaches. I have back pain. (also) Guided writing Plan your letter D. You have a health problem. Plan a letter to Dr. Idrissi. Write notes, then make sentences. Choose a problem exam stress and poor sleep · always tired and hungry at school · back pain from a heavy schoolbag · too much time on my phone · or your own idea Part Sentence starters My notes Introduction I am a … -year-old student at … . I am writing to ask for your advice about … The problem For the last … , I have … . I … because … , so … . What I have tried I have tried to … , but … . Asking for advice What do you think I should do? · Should I …? · Could you tell me …? Closing I would be grateful for your help. · I look forward to hearing from you. Free writing Write your letter E. Write your letter to Dr. Idrissi asking for advice (100–120 words). Dear Dr. Idrissi, Yours sincerely, Check your letter ✓ Dear Dr. + name + commaWho I am + why I am writingThe problem: details and since whenWhat I have tried (present perfect)Questions asking for advice (should …?)Connectors: because, so, but, alsoI look forward to hearing from you.Yours sincerely, + full name Teacher copy Answer key — a letter asking for advice Do not hand out Product approach Modelletter + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Stage A Parts Boxes from top to bottom: 1 · 2 · 3 · 4 · 5 · 6 · 7 · 8 Model B Expressions 1 writing · 2 worries · 3 should · 4 tell · 5 grateful · 6 hearing Controlled C Connectors 1 I feel stressed because I have exams next week. · 2 I don’t eat breakfast, so I’m hungry in class. · 3 I have tried to sleep early, but I can’t. · 4 I get headaches. I also have back pain. Controlled D Plan Notes only (e.g. 16 · Agadir · exam stress · can’t sleep since March · tried herbal tea · should I stop studying at night?) Guided E Letter See model answer below; mark with the guide Free E — model answer (≈ 115 words) Dear Dr. Idrissi, I am a seventeen-year-old student at Ibn Batouta High School in Tangier. I am writing to ask for your advice about my exam stress. For the last three months, I have felt nervous all eusable water bottle, take shorter showers and walk or cycle instead of using the car. At Al Massira High School, the Green Club has already collected 300 kilos of rubbish from Agadir beach. If every school did the same, our coast would look very different. The planet is our only home, so let's protect it before it is too late. B. Skimming: match each paragraph with its main idea. Write the paragraph number in the box. 1.Solutions from the governmenta.¶12.Air pollution and droughtb.¶23.What young people can doc.¶34.Plastic in the sead.¶4 While you read Understand the text Reading C. Scanning: true or false? Correct the false statements. TF 1.Plastic in the sea never comes back to people. 2.Morocco is facing long periods without enough rain. 3.The plastic bag ban started in 2016. 4.The Green Club collected 300 kilos of rubbish in Casablanca. D. What do the underlined words refer to? Then find words in the text that mean: them (¶1) → This (¶3) → it (¶4) → very small (¶1) = not common (¶2) = stopped by law (¶3) = E. Problems and solutions: complete the table with information from the text. Problem Its effect A solution from the text Plastic on beaches Air pollution Drought After you read F. Solve a problem. Choose one environmental problem in your town. Describe it and suggest two solutions. Then compare with your group. 1.Problem: 2.Solution 1: 3.Solution 2: Teacher copy Answer key Do not hand out PDP stages Prepictures, A (predict)DuringA check (skim) · B main ideas · C scan · D reference / meaning · E problem–solutionPostF problem-solving # Task Expected answer Stage A Predict 2 — environmental problems in Morocco and possible solutions Pre B Main ideas Solutions from the government ¶3 · Air pollution and drought ¶2 · What young people can do ¶4 · Plastic in the sea ¶1 During C T / F 1 F — it comes back to us in our food · 2 T · 3 T · 4 F — on Agadir beach During D Reference them = tiny pieces of plastic · This = clean electricity from Noor for a million people · it  at the title, subtitle, headings, source and pictures. ✚ image a school film screening ✚ image an old projector ✚ image a desert caravan A. Survey the text. What kind of text is it? Tick (✓) one.Do it before you read. a letter to a friend a school magazine article about a film club a film review an advertisement for a cinema Reading The text Skim it first (2 minutes), then read it carefully. The Ciné-Club: Our Favourite Escape Every Friday, forty students forget their homework and travel the world — without leaving Meknes. By Salma Bennani, 1st Bac · Al Kindi Magazine, March issue How it all started Three years ago, our English teacher, Mr. Karim Lahlou, borrowed an old projector and showed a documentary about the oceans in Room 12. Only six students came. Today, the Ciné-Club has more than forty members, and the screenings take place in the school hall every Friday at 4 p.m. More than films The club is not only about watching films. After each screening, members discuss the story, the characters and the music. Some students write reviews for this magazine, others design posters, and a small team is making its own short film about the old medina. “I used to be shy,” says Imane Chraibi, 17. “Now I give my opinion in front of everybody.” Last month, the members also visited a film studio in Ouarzazate, where they watched real actors at work. This month's hit In March, the club showed The Last Caravan, a Moroccan adventure film directed by Nadia Rami. It tells the story of a young guide from Merzouga who saves a lost caravan during a sandstorm. The hall was full, and many students said it was the best film of the year. Join us! Membership is free. All you need is curiosity and a little free time. If you are interested, see Mr. Lahlou in the English room before 25 April. New members can also suggest films for next term. While you read Skim, scan, read for detail Reading B. Skim the text. Tick (✓) its main idea.Read only the first lines of each paragraph. A teacher explains how to use a projector. A school club helps students enjoy and discuss films — and anyone can join. Students complain that there is no cinema in Meknes. C. Scan the text for these details.Look for names, numbers and dates. 1.When did the Ciné-Club start? Answer: 2.How many members does it have today? Answer: 3.Where and when are the screenings? Answer: 4.Who directed The Last Caravan? Answer: 5.What is the last day to join the club? Answer: D. True or false? Justify with words from the text. TF 1.The first screening was a comedy. Answer: 2.Club members only watch films. Answer: 3.Imane is more confident than before. Answer: 4.Students must pay to join the club. Answer: After reading E. Would you join the Ciné-Club? Why / why not? Which film would you like to show?Discuss with a partner, then write three sentences. Teacher copy Answer key — The Ciné-Club Do not hand out PDP stages Prewarm-up · pictures · A surveyDuringB skim · C scan · D detailPostE opinion Reading strategies Surveytitle, subtitle, headings, source, picturesSkimmain idea, fastScanspecific details: names, numbers, dates # Task Expected answer Paragraph A Survey b — a school magazine article about a film club (source, headings, byline) title · source B Skim 2 — a school club helps students enjoy and discuss films; anyone can join whole text C1 Scan Three years ago. How it all started C2 Scan More than forty. How it all started C3 Scan In the school hall, every Friday at 4 p.m. How it all started C4 Scan Nadia Rami. This month's hit C5 Scan 25 April (before 25 April). Join us! D1 T / F F — “showed a documentary about the oceans” How it all started D2 T / F F — “The club is not only about watching films.” More than films D3 T / F T — “I used to be shy … Now I give my opinion in front of everybody.” More than films D4 T / F F — “Membership is free.” Join us! Pre-reading — notes Warm-up: “Do you watch films at school? Is there a club at our school?” Pre-teach (pictures / mime): screening, projector, sandstorm, membership. Ss survey for 1 min only, books half-closed. E — notes Accept any, e.g. I would join because I'm really into films. I'd show “…” because it's gripping. Link: the club's film, The Last Caravan, is reviewed in the Writing lessons.", "bac-u5-l4": "Grammar Past continuous & simple past: when / while Unit / ThemeUnit 5 - Entertainment Level1st Bac Context Meet the grammar ✚ image a power cut during the film ✚ image Yassir asleep on his chair The story Read. What happened at 4:45? What was Yassir doing when the power came back? Last Friday, the Ciné-Club was showing The Last Caravan. The hall was full. Some students were eating popcorn, and Mr. Lahlou was sitting at the back. At 4:45, while the young guide was crossing the desert in the film, the lights suddenly went out! Everybody shouted. When the power came back ten minutes later, Yassir was sleeping on his chair and two boys were dancing in the dark! We were still laughing when the film started again. — Imane Chraibi, 1st Bac Form Focus on the form A. Complete the table with was / were + verb-ing.The first line is an example. Affirmative Negative Question I / He / She / It She was laughing. She wasn't laughing. Was she laughing? We / You / They They popcorn. They popcorn. they eating popcorn? Short answers Yes, I / he . No, we . Yes, they . Remember — use ① An action in progress at a time in the past: At 4:45, we were watching a film. ② A long action interrupted by a short one: The guide was crossing the desert when the lights went out. ③ while + past continuous: While Yassir was sleeping, two boys were dancing. (two actions at the same time) · when + simple past (short action) Practice Use the grammar Grammar B. Put the verbs in brackets in the past continuous. 1.At 8 p.m. yesterday, my parents (watch) a series on TV. 2.Hajar (not / play) chess at 5 o'clock. She (read). 3. you (listen) to music when I called? — Yes, I . 4.The audience (clap) and the actors (smile). C. Past continuous or simple past? Use the verbs in brackets. 1.I (read) a novel when my phone (ring). 2.While Salma (play) the oud, her brother (record) a video. 3.Anas (fall) while he (hike) in the Middle Atlas. 4.When we (arrive) at the cinema, our friends (wait) for us outside. 5.Othmane (meet) his favourite singer while he (wait) for a taxi. D. Join the ideas with when or while. Write one sentence. 1.Nour / swim at the beach — she / see a dolphin (when) 2.Yassir / do his homework — his sister / practise the guitar (while) 3.the lights / go out — we / watch the match (while) 4.I / walk home — it / start to rain (when) Free practice E. Tell a story.Write about a funny or surprising moment during a leisure activity (a match, a concert, a trip…). Use while / when. Then tell it to your partner. Useful questions What were you doing when …? · Where were you? · Who were you with? · What happened next? 1. 2. 3. 4. Teacher copy Answer key — past continuous & simple past Do not hand out ECRIF stages EstoryCA + Remember boxRB, CIDFE # Task Expected answer A Form They were eating · They weren't eating · Were they eating? — Yes, I / he was. · No, we weren't. · Yes, they were. B 1–4 1 were watching · 2 wasn't playing · was reading · 3 Were · listening · was · 4 was clapping · were smiling C 1–3 1 was reading · rang · 2 was playing · was recording · 3 fell · was hiking C 4–5 4 arrived · were waiting · 5 met · was waiting D 1–4 1 Nour was swimming at the beach when she saw a dolphin. · 2 While Yassir was doing his homework, his sister was practising the guitar. · 3 The lights went out while we were watching the match. · 4 I was walking home when it started to rain. E Free Accept any story; check 2+ past continuous, when + simple past, while + past continuous. Encounter & Clarify — notes At 4:45 the lights went out. Yassir was sleeping on his chair. Timeline: ——[was crossing the desert]——✕ went out CCQs: “Did the film start before or after the lights went out? (before) Was the action finished? (no, in progress) Which action is short? (went out)” Typical errors *They was eating → were · *I was knowing him → state verbs: I knew · *When I was arrive → arrived · *While the lights went out, … → when · spelling: sit → sitting, dance → dancing", "bac-u5-l5": "Writing — Part 1 A film review: analyse & plan Unit / ThemeUnit 5 - Entertainment Level1st Bac Model Read Salma's review of the Ciné-Club film ✚ image the poster of The Last Caravan ✚ image Salma, the writer The model review Al Kindi Magazine · Ciné-Club page The Last Caravan (2025) — ★★★★☆ by Salma Bennani The Last Caravan is a Moroccan adventure film directed by Nadia Rami. It stars Ayoub Zerhouni as Brahim, and it is set in the desert near Merzouga. The film tells the story of Brahim, a seventeen-year-old guide. One night, while he is leading tourists across the dunes, a terrible sandstorm hits and a caravan gets lost. Brahim must find it before it is too late. What I liked most was the photography: the dunes look magical at sunrise. The soundtrack, with Gnaoua music, is also moving. However, the middle of the film is a bit slow. All in all, it is a gripping and beautiful film. I highly recommend it to anyone who loves adventure. Don't miss it! A. The parts of a film review.Write the right number in each box of the review. 1 title & rating2 basic information3 plot summary4 opinion5 recommendation Analyse the model B. Find in the review: 1.the tense Salma uses to tell the story: 2.three adjectives that give a positive opinion: 3.the linker that introduces a negative point: 4.two expressions to recommend the film: 5.the meaning of ★★★★☆: Controlled practice The language of reviews Writing C. Put the expressions in the right column.( It stars … - It is set in … - The film tells the story of … - What I liked most was … - However, … - I highly recommend it to … - It is directed by … - The plot is a bit predictable. - Don't miss it! - The acting is superb. ) Basic information Plot summary Opinion Recommendation Pre-writing m tells the story of a girl from Tangier. C2 P It is directed by Nadia Rami. C3 C The film is set in Casablanca. C4 WO I recommend this film to you. / I recommend it to you. C5 Sp The soundtrack is beautiful. D Final copy Collect; mark with the marking guide. Model answer (≈ 110 words) Hassan's Kitchen (2024) — ★★★☆☆ Hassan's Kitchen is a Moroccan comedy directed by Omar Sefrioui. It stars Reda Alami as Hassan, and it is set in a small restaurant in Fez. The film tells the story of Hassan, a young cook who wants to win a national cooking contest. While he is preparing his dishes, his crazy family tries to help him. What I liked most was the acting: the grandmother is hilarious. The music is also lively. However, the plot is a bit predictable. All in all, it is a fun film for the whole family. I recommend it to anyone who needs a good laugh. Marking guide (/10) Organisation (five parts, paragraphing) — 3 Content (information, plot without spoilers, opinion with reasons, recommendation) — 3 Language (present simple, review expressions, linkers) — 2 Mechanics (capitals, punctuation, spelling) — 2", "bac-u6-l1": "Vocabulary Media words: TV, the press & the Internet Unit / ThemeUnit 6 - Mass Media Level1st Bac CONTEXTMeet the words ✚ image A family watching TV ✚ image A newspaper stand ✚ image A teenager on a laptop The text Read. Which media does each person use? Hi! I'm Salma Idrissi from Meknes, and I'm the editor of our school magazine, Our Voice. Every morning, my dad reads the headlines in the newspaper while my mum switches on the radio to listen to the news bulletin. I prefer to surf the Net: I read short articles on news websites and I sometimes post comments on social media. In the evening, my little brother Hamza holds the remote control and changes the channel every two minutes! He hates the adverts, but he loves live football matches. My grandfather watches documentaries about wildlife on TV. Our journalists at school interview students and teachers, and nex e prize ceremony took place in Rabat on Saturday. Now, the weather. A strong storm hit Al Hoceima on Thursday night. Heavy rain closed several roads, and twenty families had to leave their homes. Nobody was hurt. And finally, good news for book lovers: a new free reading app for students, called Kitabi, is now available. It has more than five thousand books in Arabic, French and English. That's all for this morning. I'm Nadia Alami. Have a nice day! Notes for the teacher Rule: -ed /ɪd/ only after /t/ or /d/ (excited, disappointed). Intonation: strong feelings use a wide fall: I'm ↘thrilled! · What a re↘lief! News cards (G): Our school wins the national debate · Exams moved one week earlier · A new cinema opens in town · Wi-Fi off at school for a month · Free concert in the park on Sunday · Your favourite programme stops. Typical errors: *I'm boring (bored) · *It makes me to feel sad · *I worry about it yesterday", "bac-u6-l3": "Reading Screens, Papers and Teenagers Unit / ThemeUnit 6 - Mass Media Level1st Bac BEFORE YOU READLook at the title and the pictures. ✚ image Reading news on a phone ✚ image Watching the TV news ✚ image A school radio club A.Predict: tick (✓) the two ideas you think are in the text.Then read quickly and check. 1.Teenagers get most of their news from smartphones. 2.Moroccan newspapers are getting cheaper. 3.Not all the news on social media is true. 4.Teenagers never watch TV with their families. READING The text Read it twice: first quickly, then carefully. Screens, Papers and Teenagers by Salma Idrissi, Our Voice school magazine 1 Last month, the media club at Ibn Rochd High School in Meknes asked 200 students a simple question: “How do you get the news?” The answers surprised our teachers. Only 12 students said they read a newspaper regularly, and most of them read it online, not on paper. 2 Television is still popular. About 45% of the students watch the evening news bulletin with their families, especially when there is a big football match or an important national event. However, the most popular source of information is the smartphone. Seven students out of ten follow the news on social media or on news websites every day. 3 This change worries some people. Mr. Tazi, our English teacher and media club adviser, explains: “Social media is fast, but it is not always reliable. Anyone can post a story, and a false story can travel around the world in minutes.” He advises students to check the source of every piece of news and to compare two or three websites before sharing it. 4 The survey also showed that teenagers want to take part in the media, not only consume it. More than half of the students said they would like to write articles, record podcasts or make short videos about life in their town. That is why our club is starting a school web radio next month. Who knows? Perhaps this is how the journalists of tomorrow will begin. WHILE YOU READSkim and scan Reading B.Skim the text. Match each paragraph with its main idea.There is one extra idea. 1.Paragraph 1a.A warning about false news2.Paragraph 2b.Young people want to create media3.Paragraph 3c.The results of a school survey4.Paragraph 4d.How TV and phones share the audience e. The history of radio in Morocco C.Scan the text. True or false? Justify with words from the text. TF 1.Most students who read newspapers read them on paper. 2.Families watch the news together on TV when there is a big event. 3.Mr. Tazi thinks social media is always a good source of news. 4.The media club already has a web radio. D.Scan for numbers. Answer the questions. 1.How many students took part in the survey? 2.What percentage of students watch the evening news on TV? 3.How many students out of ten follow the news on social media or websites? E.What do the underlined words refer to? 1.them (§1) → 2.He (§3) → 3.it (§4) → 4.this (§4) → AFTER READING F.What about you?How do you get the news? Do you check it before you share it? Write 3–4 sentences. 1. 2. Teacher copy Answer key — Screens, Papers and Teenagers Do not hand out PDP stages Prepictures, A predictDuringA check · B skim · C, D scan · E referencePostF # Task Expected answer Note A Predict / skim 1 ✓ and 3 ✓ whole text B Main ideas §1 c · §2 d · §3 a · §4 b (e = extra) skimming C1 T / F F — “most of them read it online, not on paper” §1 C2 T / F T — “watch the evening news bulletin with their families, especially when there is … an important national event” §2 C3 T / F F — “Social media is fast, but it is not always reliable.” §3 C4 T / F F — “our club is starting a school web radio next month” §4 D Numbers 1 200 students · 2 about 45% · 3 seven scanning E Reference them = the 12 students (who read a newspaper) · He = Mr. Tazi · it = the media · this = writing articles / recording podcasts / starting a web radio inference Pre-reading — notes Lead-in: “Where did you get the news yesterday?” — tally on the board: TV / radio / newspaper / phone. Pre-teach: survey, source, reliable, adviser, consume, share. Strategy: skimming = read the first line of each paragraph fast (1 min); scanning = look only for the number / name you need. Text ≈ 250 words. F — model answer & link I usually get the news from Instagram and from the TV news with my parents. I don't always check it, but now I will compare two websites before I share a story. Link: the text and Salma prepare the Writing lesson (an e-mail about media habits).", "bac-u6-l4": "Grammar The passive: present & past simple Unit / ThemeUnit 6 - Mass Media Level1st Bac CONTEXTMeet the grammar ✚ image Students working on the school magazine ✚ image A printing shop The text Read. Who checks the articles? When was the magazine created? How is Our Voice made? Our school magazine is written by twenty students from the media club. The articles are checked by Mr. Tazi, and the photos are taken by Mehdi and Aya. Every issue is printed in a small shop in Meknes, and it is sold for five dirhams. The magazine was created in 2019. The first issue was designed by two students, Hiba and Othmane, and only fifty copies were printed. Last year, 600 copies were sold, and the magazine wasn't sold only at school: it was also shared online. FORMFocus on the form A.Look at the underlined verbs. Complete the table.The first line is an example. Present simple passive Past simple passive Affirmative The articles are checked by Mr. Tazi. The magazine was created in 2019. Form am / / + past participle / + past participle Negative The magazine on Sundays. (sell) The magazine only at school. (sell) Question the photos by Mehdi? (take) When the magazine ? (create) Remember Active: Mr. Tazi checks the articles. → Passive: The articles are checked (by Mr. Tazi). The object of the active sentence becomes the subject · be (same tense) + past participle · use by + agent only when the agent is important. We use the passive when the action is more important than the person who does it: Radio was invented … PRACTICEUse the grammar Grammar B.Complete with the present or past simple passive of the verbs in brackets. 1.Today, the news (read) by millions of people on their phones. 2.The first Moroccan TV channel, RTM, (launch) in 1962. 3.Thousands of videos (upload) to the Internet every minute. 4.The telephone (invent) by Alexander Graham Bell in 1876. 5.Our school radio programmes (record) every Wednesday afternoon. 6.The photos for the last issue (not / take) by Aya; they (take) by Mehdi. 7. the World Cup final (broadcast) live in Morocco last year? C.Rewrite the sentences in the passive.Use by only when the agent is important. # Active Passive 1. People watch 2M all over Morocco. 2. Salma wrote the main article last month. 3. They don't sell newspapers at our school. 4. Did the students design the magazine cover? FREE PRACTICE D.Media quiz.Write four quiz questions about the media or famous inventions in the passive. Ask another pair. Ideas When was … invented / created? · Where is … made / printed? · Which language is … spoken in? y Answer key — passive (other tenses & modals) Do not hand out ECRIF stages EAnnouncementCTask A + ruleRBICFD # Task Expected answer Note A Form been · has been bought / have been recorded · be · will be broadcast / will be read · be · can be requested / must be switched off · be · mustn't be touched Clarify B 1–6 1 is being · 2 have been · 3 will be announced · 4 should be checked · 5 can't be · 6 is going to be Remember C 1–3 1 The school website is being repaired. · 2 The club's camera has been stolen. · 3 The radio studio will be opened by the headmaster on Monday. Internalize C 4–5 4 The articles must be written in English. · 5 Have the photos been posted online? Internalize D Free e.g. Phones must be switched off. · Food can't be eaten in the studio. · A new camera has been bought. · The next show will be presented by Imane. Fluently use Encounter & Clarify — notes When will the first show be broadcast? — On Monday, 3 November, at 1 p.m. · How can songs be requested? — By e-mail. CCQs: “The studio is being painted.” Is it finished? (No, now) · “A microphone has been bought.” Do we have it now? (Yes) Link: recycle Part 1 (is / was + pp). Typical errors *is been prepared → is being prepared *has be bought → has been bought *will broadcast (passive meaning) → will be broadcast *must switched off → must be switched off *Have been the photos posted? → Have the photos been posted?", "bac-u6-l6": "Writing An e-mail to an e-pal: my media habits Unit / ThemeUnit 6 - Mass Media Level1st Bac MODELRead Salma's reply to Emily ✚ image Salma, from Meknes ✚ image Emily, from Manchester The model e-mail ≈ 125 words From:salma.idrissi@mail.maTo:emily.carter@mail.co.uk Subject: Re: News, TV and our school radio Hi Emily, Thanks for your e-mail. It was great to hear about your school newspaper in Manchester! You asked how young people in Morocco get the news. Most of my friends use their phones, so they follow news websites and social media. However, my parents prefer the TV news our e-mail.Two body paragraphs3+ linking wordsMedia words from the unitQuestions + Write back soon. Teacher copy Answer key — an e-mail to an e-pal Do not hand out Product approach Modele-mail + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Note A Parts Boxes from top to bottom: 1 · 2 · 3 · 4 · 5 · 6 · 7 Model B Linking 1 but · 2 because · 3 However · 4 also · 5 so Controlled C Mechanics 1 Hi Emily, · 2 Thanks for your e-mail. · 3 What's your favourite programme? · 4 Write back soon. · 5 Best wishes, Salma · 6 I can't wait to hear from you. Controlled D Plan Notes only (e.g. friends: Instagram, YouTube · dad: Medi1 TV · fav.: a cooking show · news: school magazine online) Guided E E-mail See model answer; mark with the guide Free E — model answer (≈ 110 words) Subject: News in Tangier Hi Emily, Thanks for your e-mail. It was great to read about your school newspaper. In my town, most teenagers get the news on their phones, so they rarely buy newspapers. However, my father watches the evening news bulletin on Al Aoula every day. My favourite programme is a quiz show because I learn a lot and it is funny. I have exciting news too: our school magazine has been put online, and my first article will be published next week! What about you? Which programmes do you like? Write back soon. Best wishes, Othmane Marking guide (/10) Layout (subject, greeting, opening, sign-off) — 2 Content (media habits, programme + reason, news, question) — 3 Organisation (paragraphs, linking words) — 2 Language (media vocabulary, passive, feelings) — 2 Mechanics — 1 Typical errors: no subject line · *I am waiting your answer → Write back soon · *In my town the teenagers they use … · a list of ideas with no linking words", "bac-u7-l1": "Vocabulary Celebrations, customs & traditions Unit / ThemeUnit 7 - Celebrations Level1st Bac CONTEXT Meet the words ✚ image a Moroccan wedding ✚ image an Eid al-Adha lunch ✚ image a Yennayer dinner ✚ image Throne Day fireworks The text Read it. What is Imane's favourite occasion? My name is Imane Ait Lahcen. I'm seventeen and I live in Tiznit. In my family, we celebrate many occasions all year round. Religious feasts like Eid al-Fitr and Eid al-Adha are the most important. On Eid al-Adha, my father sacrifices a sheep and we visit our relatives. We also celebrate national holidays such as Throne Day and Independence Day: the streets are decorated with flags and there are fireworks at night. In January, we welcome Yennayer, the Amazigh New Year, with a special dish called tagoula. But my favourite occasion is a wedding! The ceremony lasts three days. The bride wears beautiful traditional dresses and has henna on her hands, and the guests bring gifts for the newly-weds. These customs and traditions are passed down from one generation to the next. PRACTICE Work with the words A. Match each word with its meaning. Write the letter in the box. 1.occasiona.people you invite to your home, a party or a wedding 2.feastb.a woman on her wedding day 3.relativesc.a big meal, or a religious celebration 4.guestsd.a usual way of doing things in a society 5.bridee.a special event or time 6.customf.members of your family: uncles, aunts, cousins … B. Complete the sentences with words from the box. ( celebrate - decorate - fireworks - henna - ceremony - gifts ) 1.On Throne Day, people their streets and shops with flags. 2.We always my grandmother's birthday with a big family dinner. 3.At midnight, the sky was full of colourful . 4.Before the wedding, the bride's hands are painted with . 5.The wedding started at 9 p.m. and finished at dawn. 6.The guests brought for the newly-weds. PRACTICE Work with the words C. Put the occasions in the right column. ( Eid al-Fitr - Throne Day - a wedding - the Rose Festival - Eid al-Mawlid - Independence Day - a birthday - the Gnaoua Festival - Ashura - the Green March Day - a graduation party - the Imilchil Moussem ) Religious feasts National holidays Family events Cultural festivals D. Collocations: match the verbs with the nouns. Then use three of them in sentences about your family. 1.sacrificea.gifts / presents 2.exchangeb.traditional clothes 3.lightc.a wish 4.weard.a sheep 5.throwe.a party 6.makef.candles 1. 2. 3. FREE PRACTICE E. Guess my celebration! Write 4–5 sentences about your favourite celebration (when, where, food, clothes, customs) without naming it. Read them to your partner. He / She guesses the occasion. 1. 2. 3. 4. 5. Teacher copy Answer key Do not hand out ECRIF stages Epictures + textCA + boardRB, CIDFE # Task Expected answer Stage A Matching 1-e · 2-c · 3-f · 4-a · 5-b · 6-d Clarify B Gap-fill 1 decorate · 2 celebrate · 3 fireworks · 4 henna · 5 ceremony · 6 gifts Remember C Classify Religious: Eid al-Fitr, Eid al-Mawlid, Ashura · National: Throne Day, Independence Day, the Green March Day · Family: a wedding, a birthday, a graduation party · Cultural: the Rose Festival, the Gnaoua Festival, the Imilchil Moussem Remember D Collocations 1-d sacrifice a sheep · 2-a exchange gifts · 3-f light candles · 4-b wear traditional clothes · 5-e throw a party · 6-c make a wish Internalize E Free writing + speaking Accept any description; the partner names the occasion. Fluently use Board (Clarify) — word stress Oo custom · feast · fireworks · henna · wedding Ooo relatives · celebrate · sacrifice oOo occasion · tradition · religious Oooo ceremony /ˈserəməni/ CCQs: Is a guest always a member of the family? (No) Is a feast only food? (No — also a religious celebration) Who wears henna before the wedding? (the bride) E — model answer & notes We celebrate it every year in summer. My mother and my aunts cook a lot of food, and we wear traditional clothes. The bride sits on the “amaria” and the guests dance all night. — Answer: a wedding. Monitor: collocations from D (wear traditional clothes, exchange gifts); present simple for customs; spelling of ceremony, relatives, traditions. Delayed error correction on the board.", "bac-u7-l2": "Functions I'm really sorry! — Apologising Unit / ThemeUnit 7 - Celebrations Level1st Bac CONTEXT Before you listen Look at the pictures. What can go wrong at a party, a wedding or a school ceremony? ✚ image a birthday party ✚ image a wedding party ✚ image a school ceremony WHILE YOU LISTEN Identify the topic A. Listen to three short conversations. Identify the occasion and the topic. Complete the table. Conversation Occasion What went wrong? (the topic) Who apologises? 1 2 3 B. Listen again and complete what the speakers say. 1.“I'm really I missed your birthday party, Imane.” 2.“Never . It doesn't matter.” 3.“Oh, I do , madam! That was so careless of me.” 4.“That's all . It's only orange juice.” 5.“I'm terribly sorry being late, sir.” 6.“Apology . But please don't let it happen again.” EXPRESSIONS Focus on the expressions C. Put the expressions in the right column. ( I'm so sorry. - Never mind. - I apologise for … - That's all right. - Please forgive me. - Don't worry about it. - Sorry about that. - Apology accepted. - It doesn't matter. - I'm terribly sorry for … - Forget it. - It was my fault. ) Apologising — informal Apologising — formal Accepting an apology Remember Apologise + give a reason: I'm sorry (that) I + past … · I'm sorry for / I apologise for + verb-ing … Stress the key word and let your voice fall: I'm SO sorry ↘ · I'm TERribly sorry ↘ · NEver mind ↘ PRACTICE Use the expressions D. Complete the mini-dialogue with words from the box. ( so - fault - for - Don't - forgive - matter ) 1.Hiba: Hamza! You didn't come to my sister's engagement party yesterday! 2.Hamza: Oh, Hiba, I'm sorry. I completely forgot about it. 3.Hiba: You forgot? Everybody asked about you! 4.Hamza: It was my . I apologise missing it. 5.Hiba: Well, worry about it. But you must call my sister. 6.Hamza: I will. Please me — I'll bring her a gift too! E. Apologise, give a reason, then respond. Write a short exchange for each situation. # Situation Your exchange (apology + reason + response) 1. You arrive late at your cousin's wedding ceremony. Apologise to your aunt. 2. You forgot your best friend's birthday. Apologise and explain. 3. At the Eid lunch, you break one of your grandmother's glasses. 4. You can't go to your classmate's graduation party. Apologise politely. FREE PRACTICE F. Over to you. Role-play the situation with your partner, then swap roles. Student A — role card You promised to help Student B decorate the house for his / her parents' 25th wedding anniversary, but you didn't come. Call B, apologise, explain why and offer to help with something else. Student B — role card Your friend A didn't come to help you decorate the house for your parents' anniversary. You are upset. Ask A what happened, listen to the apology, then accept it (or not!). Notes / useful expressions: Teacher copy Answer key & tapescript Do not hand out ECRIF stages Epictures + ACB, C + RememberRDIEFF Tapescript — read it aloud with two students, or record it ≈ 1 min 30 Conversation 1 — on the phone Yassine: Hello, Imane? It's Yassine. Happy birthday! I'm really sorry I missed your birthday party yesterday. Imane: Oh, hi Yassine! What happened? Yassine: The bus from Agadir broke down, and my phone battery was dead. I'm so sorry. Imane: Never mind. It doesn't matter. We kept a piece of cake for you! Conversation 2 — at a wedding Mehdi: Oh no! I do apologise, madam! I've spilt orange juice on your caftan. That was so careless of me. Mrs. Alaoui: That's all right, young man. It's only orange juice. Mehdi: Please let me get you a napkin. Mrs. Alaoui: Don't worry about it. Go and enjoy the wedding! Conversation 3 — at school Headmaster: Hamza, the Independence Day ceremony started twenty minutes ago. Hamza: I'm terribly sorry for being late, sir. There was a traffic jam because of the parade. Headmaster: Apology accepted. But please don't let it happen again. Hamza: It won't happen again, sir. I promise. # Task Expected answer Stage A Topic 1 Imane's birthday party — Yassine missed it (bus broke down) — Yassine · 2 a wedding — Mehdi spilt juice on a woman's caftan — Mehdi · 3 Independence Day ceremony — Hamza was late (traffic jam) — Hamza Encounter B Gaps 1 sorry · 2 mind · 3 apologise · 4 right · 5 for · 6 accepted Clarify C Classify Informal: I'm so sorry. · Sorry about that. · It was my fault. — Formal: I apologise for … · Please forgive me. · I'm terribly sorry for … — Accepting: Never mind. · That's all right. · Don't worry about it. · Apology accepted. · It doesn't matter. · Forget it. Clarify D Dialogue so · fault · for · Don't · forgive (matter is extra) Remember E Situations e.g. 1 I'm terribly sorry I'm late, Auntie. — Never mind, come in! · 3 I'm so sorry, Grandma! It was my fault. — Don't worry about it. Internalize F Role-play Check: apology + reason + offer; B accepts with a fitting expression; stress & falling intonation. Fluently use Board (Clarify) Apologising informal: I'm (so / really) sorry. · Sorry about that. · It was my fault. formal: I apologise for + -ing · I'm terribly sorry for + -ing · Please forgive me. + reason: I'm sorry (that) I + past … Accepting: Never mind. · That's all right. · Don't worry about it. · It doesn't matter. · Apology accepted. F — monitoring notes Check: a clear apology + a reason + an offer (Let me … / I'll …). Typical errors: *I'm sorry for I forgot · *I apologise to be late · *Sorry for the late. Formal vs informal: use the formal set with older people and teachers (situations 1, 3). Delayed error correction on the board.", "bac-u7-l3": "Reading Yennayer: a new year with Amazigh roots Unit / ThemeUnit 7 - Celebrations Level1st Bac BEFORE YOU READ Survey and predict Look at the title, the pictures and the first sentence of each paragraph. ✚ image a bowl of tagoula ✚ image a Yennayer family dinner ✚ image ahwach dancers and drums A. Tick (✓) three things you think you will read about. Do it before you read. the date of the celebrationa special disha football matcha game with a date stoneshopping in a big citymusic and dance READING The text Yennayer in my grandparents' village Read quickly first, then carefully. 1 In my family, the most special night of winter is not 31 December but 13 January. On that evening, we all gather at my grandparents' house in a small village near Tiznit to welcome Yennayer, the Amazigh New Year. This year, we celebrated the year 2976 of the Amazigh calendar, an old calendar linked to the farming seasons. 2 Preparations start days before. My grandmother cleans the whole house and buys new pots, because people believe that a fresh start brings a good harvest. Then my aunts prepare the traditional dish of the evening, tagoula, a thick soup made of barley or corn and served with butter and honey. Some families cook couscous with seven vegetables instead. 3 The funniest moment comes at dinner. My grandmother secretly hides a date stone in the tagoula. Everyone eats slowly and carefully, and the person who finds it is considered the lucky one of the year. Last year, my little cousin Ayoub found it, and he was so proud that he kept it in his pocket for weeks! 4 After dinner, the elders tell stories about the past, and young people sing and dance ahwach to the rhythm of the drums. For a long time, Yennayer was only a family and village celebration, but since 2024 it has been an official national holiday in Morocco. 5 For me, Yennayer is more than a party. It is a way to keep our Amazigh identity alive and to pass our customs on to the next generation. Imane Ait Lahcen, 1st Bac — our school magazine B. Skim the text. Were your predictions in A right? Then match each paragraph with its main idea. One idea is extra. Paragraph 1Paragraph 2Paragraph 3Paragraph 4Paragraph 5 a. Getting ready for the new yearb. Why Yennayer matters to the writerc. A lucky find at dinnerd. When and where the family celebratese. Songs, stories and a new official statusf. A trip to a big city WHILE YOU READ Check, reorder and guess C. Put the events of the Yennayer evening in the order they happen (1–6). Write the number in the box. The elders tell stories about the past. Grandmother cleans the house and buys new pots. Young people sing and dance ahwach. Someone finds the date stone and becomes the lucky one. The aunts prepare tagoula. Grandmother hides a date stone in the tagoula. D. Guess the meaning from context. Find a word or expression in the text that means: 1.come together (paragraph 1) 2.the crops that farmers collect (paragraph 2) 3.the small hard seed inside a date (paragraph 3) 4.the old people of a family (paragraph 4) 5.who you are, your culture and roots (paragraph 5) E. Read carefully and answer the questions. 1.Why does the grandmother buy new pots? Answer: 2.What is tagoula? Answer: 3.Why do you think Ayoub kept the date stone in his pocket for weeks? Answer: 4.What has changed about Yennayer since 2024? Answer: AFTER READING F. Compare Yennayer with another celebration in your region. Discuss with your partner (food, customs, music), then write 3–4 lines. Which custom would you like to pass on to the next generation? Teacher copy Answer key Do not hand out PDP stages Prepictures + ADuringB skim · C reorder · D guess · E detailsPostF # Task Expected answer Stage A Predict Expected ✓: the date of the celebration · a special dish · a game with a date stone · music and dance (accept any three, then check in B) Pre B Main ideas Paragraph 1-d · 2-a · 3-c · 4-e · 5-b (f is extra) During C Reorder Top to bottom: 5 · 1 · 6 · 4 · 2 · 3 (cleans → tagoula → hides stone → lucky one → stories → ahwach) During D Context 1 gather · 2 harvest · 3 date stone · 4 the elders · 5 identity During E1 Detail Because people believe that a fresh start brings a good harvest. During E2 Detail A thick soup made of barley or corn, served with butter and honey. During E3 Inference He was proud to be the lucky one of the year / he thought it would bring him luck. During E4 Detail It has been an official national holiday in Morocco (since 2024). During F Personal response Accept any comparison, e.g. Ashura, Eid al-Mawlid, a moussem. Post Strategy notes Survey: title, pictures, first sentence of each paragraph, the writer's name. Predict: write 3–4 predictions on the board; tick / cross them after skimming. Guess: ask “Which words helped you?” — e.g. gather … at my grandparents' house; fresh start → good harvest. Reorder: Ss. underline time markers: days before, then, at dinner, after dinner. Background for the teacher Yennayer is celebrated on 13–14 January; the Amazigh calendar is about 950 years ahead of the Gregorian one (January 2026 → 2976). Morocco made it an official paid national holiday in 2024. In the Souss, the person who finds the date stone (or almond) in the tagoula is the lucky one of the year. Link: this text is the model content for the Writing lesson (Imane's letter to Hiba).", "bac-u7-l4": "Grammar Relative pronouns & relative clauses Unit / ThemeUnit 7 - Celebrations Level1st Bac CONTEXT Meet the grammar ✚ image the henna night ✚ image the bride and the negafa Imane's blog Read. Who got married? How long did the wedding last? Last August, my brother Hamid, who works as a nurse in Agadir, married Salma, a teacher from Taroudant. The wedding, which lasted three days, took place in the house where my grandparents live. The first evening was the henna night, when the women sang and painted the bride's hands. The woman who decorated Salma's hands is famous in our village. The negafa, whose job is to dress the bride, brought seven beautiful caftans. The guests that came from far away stayed with us, and the cake my aunt made was delicious! Hamid and Salma, who now live in Agadir, are going to visit us for Yennayer. FORM Focus on the form A. Look at the highlighted words in the text. Then complete the table. The first line is an example. Relative pronoun We use it for … Example from the text who people The woman who decorated Salma's hands … which that whose where when Remember Defining clause = necessary information, no commas: The guests that came from far away stayed with us. → which guests? that can replace who / which. When the pronoun is the object, we can leave it out: the cake (that) my aunt made. Non-defining clause = extra information, between commas: My brother Hamid, who works in Agadir, married Salma. ✗ that · ✗ we never leave out the pronoun. PRACTICE Use the grammar B. Circle the correct relative pronoun. 1.Ashura is a day (when / where) children get toys and play with water. 2.The man (who / which) plays the drums at weddings is my uncle. 3.Imilchil is the village (which / where) the famous marriage festival takes place. 4.Eid al-Fitr, (that / which) comes after Ramadan, is a family celebration. 5.The bride, (who / whose) caftan was green and gold, looked very happy. 6.The gifts (who / that) we received were beautiful. C. Defining (D) or non-defining (ND)? Write D or ND in the box. Add commas where necessary. 1.The Rose Festival which takes place in Kelaat M'Gouna attracts many tourists. 2.People who celebrate Yennayer often eat tagoula. 3.My grandmother who is eighty still makes the best couscous in the family. 4.This is the photo that I took at my cousin's wedding. 5.Tetouan where my cousins live is famous for its traditional weddings. D. Join the sentences with a relative pronoun. Use commas for extra information. # Sentences Your sentence 1. Throne Day is a national holiday. It is celebrated on 30 July. (which) 2. I met a girl. Her mother makes wedding cakes. 3. That's the hall. My sister's wedding took place there. 4. Mr. Tazi organised the school party. He teaches us English. FREE PRACTICE E. Guess the word! Write definitions of four celebration words (e.g. bride, henna, Eid, a wedding hall) without naming them. Your partner guesses. Useful starters It's a person who … · It's a thing which … · It's a day when … · It's a place where … · It's someone whose … 1. 2. 3. Teacher copy Answer key Do not hand out ECRIF stages Epictures + textCA + RememberRB, CIDFE # Task Expected answer Stage A Form which — things / animals (Eid al-Fitr, which …: The wedding, which lasted three days …) · that — people or things, only in defining clauses (The guests that came …) · whose — possession (The negafa, whose job is …) · where — places (the house where my grandparents live) · when — times (the henna night, when the women sang …) Clarify B Choose 1 when · 2 who · 3 where · 4 which · 5 whose · 6 that Remember C D / ND 1 ND — The Rose Festival, which takes place in Kelaat M'Gouna, attracts … · 2 D · 3 ND — My grandmother, who is eighty, still … · 4 D · 5 ND — Tetouan, where my cousins live, is … Remember D Join 1 Throne Day, which is celebrated on 30 July, is a national holiday. · 2 I met a girl whose mother makes wedding cakes. · 3 That's the hall where my sister's wedding took place. · 4 Mr. Tazi, who teaches us English, organised the school party. Internalize E Definitions e.g. It's a woman who is getting married. (bride) · It's a day when Muslims celebrate the end of Ramadan. (Eid al-Fitr) Fluently use Board (Clarify) — CCQs “The guests that came from far away stayed with us.” — Did all the guests stay with us? (No, only those from far away) → defining, no commas. “Hamid, who works in Agadir, married Salma.” — Do we need the clause to know who Hamid is? (No) → non-defining, commas. Can we say “Hamid, that works …”? (No) E — monitoring notes Typical errors: *the man which · *the bride who her caftan · *Eid, that comes after … · missing commas in non-defining clauses · *the house where we live in it. Delayed error correction on the board; Ss. correct in pairs.", "bac-u7-l5": "Writing A personal letter about a celebration Unit / ThemeUnit 7 - Celebrations Level1st Bac MODEL Read Imane's letter to her friend Hiba ✚ image Imane ✚ image Hiba The model letter What occasion is Imane writing about? What does she invite Hiba to do? Tiznit, 18 January 2026 Dear Hiba, How are you? I hope you and your family are well. Sorry I haven't written for so long — I've been really busy with exams! I'm writing to tell you about Yennayer, the Amazigh New Year, which we celebrated last week at my grandparents' house. First, my grandmother cleaned the whole house and bought new pots. Then my aunts cooked tagoula, a delicious barley soup with butter and honey. The best moment was dinner. Grandma hid a date stone in the tagoula, and guess who found it? Me! So I'm the lucky one this year. After that, we sang and danced ahwach until midnight. Why don't you come and celebrate with us next year? You'll love it! Write back soon and tell me about your family's celebrations. Love, Imane A. The parts of a personal letter. Write the numbers in the boxes of the letter. 1 place & date2 greeting3 opening4 body: paragraph 15 body: paragraph 26 closing remarks7 closing8 signature CONTROLLED PRACTICE An informal style B. Personal letters are informal. Rewrite these sentences in an informal style. Look at Imane's letter for help. 1.I hope that you are in good health. 2.I am writing in order to inform you about our celebration. 3.I would be grateful if you could reply as soon as possible. C. Hiba writes back about Eid al-Fitr. Complete with words from the box. ( First - Then - After that - Finally - because - so ) 1. , we woke up early and put on our new clothes. 2. , we went to the mosque for the Eid prayer. 3. , we visited our grandparents and our relatives. 4.Everybody was happy the whole family was together again. 5. , we had a big lunch at my aunt's house. 6.We ate too many cakes, we didn't have dinner! GUIDED WRITING Plan your letter D. Choose a celebration you went to recently. Plan your letter to a friend. Write notes only. Part Sentence starters My notes Opening How are you? I hope … · Sorry I haven't written … Paragraph 1 what, when, where I'm writing to tell you about … , which … · First, … Then, … Paragraph 2 the best moment The best moment was … · After that, … · Finally, … Closing remarks Why don't you … ? · Write back soon and tell me … FREE WRITING Write your letter E. Write your personal letter (100–120 words). Use your plan, sequencing words and at least one relative clause. Dear , Check your letter ✓ Place and date on the rightDear + name + commaAn opening question or wishTwo clear body paragraphsSequencing words: First, Then, After that …Informal style: contractions (I'm, didn't)Closing remarks + Love, / Best wishes,Capitals, full stops, spelling Teacher copy Answer key — a personal letter Do not hand out Product approach Modelletter + AControlledB, CGuidedDFreeE + checklist # Task Expected answer Stage A Parts Boxes from top to bottom: 1 · 2 · 3 · 4 · 5 · 6 · 7 · 8 Model B Informal style 1 I hope you're well. / How are you? · 2 I'm writing to tell you about our celebration. · 3 Write back soon! (closing: Love, / Best wishes, — not Yours faithfully,) Controlled C Connectors 1 First · 2 Then · 3 After that · 4 because · 5 Finally · 6 so Controlled D Plan Notes only, e.g. cousin's wedding · Taroudant · August · henna night · the bride's seven caftans · invite friend Guided E Letter See the model answer; mark with the guide below. Free E — model answer (≈ 115 words) Tetouan, 3 September 2026Dear Yassine, How are you? I hope you had a great summer. Sorry I haven't written for so long! I'm writing to tell you about my cousin Nadia's wedding, which took place last month in Chefchaouen. First, there was the henna night, when the women sang and painted the bride's hands. Then, on the big day, Nadia wore seven beautiful caftans. The best moment was when the bride and groom arrived on the “amaria”. After that, we danced until three in the morning! Why don't you visit us next summer? Write back soon and tell me your news. Best wishes, Omar Marking guide (/10) Layout (place & date, greeting, closing, signature) — 2 Content (occasion, details, best moment, invitation) — 3 Organisation (paragraphs, sequencing words) — 2 Language (past simple, relative clauses, informal style) — 2 Mechanics (capitals, punctuation, spelling) — 1 Typical errors: *Dear Yassine. · *Yours faithfully in a personal letter · *I am write to tell you · *the wedding who …", "bac-u8-l1": "Vocabulary Arts, crafts & values of Morocco Unit / ThemeUnit 8 - Our Cultural Heritage Level1st Bac CONTEXT Meet the words ✚ image A Gnaoua troupe ✚ image A zellige craftsman ✚ image Mint tea for guests The text Salma's school blog. Read it twice. Last week, our school in Fez celebrated Heritage Week. On the first day, a Gnaoua troupe from Essaouira performed in the schoolyard, and an Amazigh group danced the Ahidous in a big circle. In the afternoon, a storyteller from the halqa of Jemaa el-Fna told us old tales. On Wednesday, we visited craftsmen in the medina: a potter, a woman who does embroidery and a master of zellige, who cuts tiny coloured tiles by hand. But Heritage Week was not only about arts. Our teacher, Mr. Tazi, reminded us that our heritage is also our values: the hospitality we show to guests, the solidarity of neighbours who help each other — like twiza in the villages — the respect we give to elders, the generosity of families during Ramadan and the tolerance that lets different cultures live together. — Salma Benkirane, 1st Bac PRACTICE Work with the words A. Match each word with its meaning. Write the letter in the box. 1.troupea.people helping and supporting each other in a group 2.storytellerb.accepting people whose ideas or culture are different from yours 3.craftsmanc.a group of musicians, dancers or actors who perform together 4.hospitalityd.a person who makes things skilfully by hand 5.solidaritye.a warm and generous welcome given to guests 6.tolerancef.a person who tells traditional tales to an audience PRACTICE Use the words B. Complete the sentences with words from the box. ( perform - heritage - potter - respect - embroidery - generosity ) 1.Musicians from all over the world come to Essaouira to at the Gnaoua Festival. 2.My grandmother decorates caftans and tablecloths with beautiful . 3.In Safi, a shapes clay on a wheel and paints it in blue and white. 4.Jemaa el-Fna and the medina of Fez are part of Morocco's cultural . 5.Young Moroccans show to elders by listening and helping them. 6.During Ramadan, the of families who share iftar with the poor is a beautiful tradition. C. Word building: complete the table with the noun. Then write a sentence with the noun. Use a dictionary to check the suffix: -ity · -ance · -y · -ness Adjective Noun My sentence hospitable hospitality Moroccans are famous for their hospitality. generous tolerant honest kind Free practice D. Heritage in my region. Write five sentences about an art, a craft or a celebration from your town or region and the value it shows. Then read them to your partner. Useful language In my region, people … · … is a traditional art / craft · Craftsmen / troupes … · It shows our hospitality / solidarity / respect for … · We must keep this heritage alive because … 1. 2. 3. 4. 5. Teacher copy Answer key — arts, crafts & values Do not hand out ECRIF stages Epictures + textCTask A + word stressRTask BITask CFTask D # Task Expected answer Note A Match 1 c · 2 f · 3 d · 4 e · 5 a · 6 b meaning B 1–3 1 perform · 2 embroidery · 3 potter B 4–6 4 heritage · 5 respect · 6 generosity C Nouns hospitality · generosity · tolerance · honesty · kindness -ity / -ance / -y / -ness C Sentences Accept any correct sentence, e.g. “The generosity of our neighbours is amazing.” check the noun form D Free Accept any 5 sentences: art / craft / celebration + a value word (hospitality, solidarity, respect …). delayed feedback Clarify — meaning & pronunciation CCQs: Is a troupe one person? (No, a group) · Does a craftsman use machines? (No, his hands) · Twiza = neighbours working together → solidarity. Stress: HERitage · CRAFTSman · hospiTALity · soliDARity · TOLerance · geneROSity (-ity: stress on the syllable before). D — model & typical errors Model: In Taroudant, craftsmen make beautiful silver jewellery. Ahwach troupes perform at weddings. These traditions show our solidarity, because the whole village helps. *the hospitable of Moroccans → the hospitality · *a troop → a troupe · *craftmen → craftsmen", "bac-u8-l2": "Functions Expressing possibility: It might … Unit / ThemeUnit 8 - Our Cultural Heritage Level1st Bac CONTEXT Listen to an interview ✚ image A zellige craftsman in Fez ✚ image A radio journalist with a microphone A. Before you listen: what may the craftsman talk about? Tick (✓) three ideas. Then listen and check. how zellige is madehis favourite football teamthe problems of the craft todaythe price of a new carthe future of his workshophis last holiday abroad B. Listen for details and take notes. Write key words only, not full sentences. Questions Notes 1. Who is the craftsman? What is his job? 2. How long has he done this job? Who taught him? 3. How is zellige made? (4 steps) 4. What are the problems of the craft today? 5. Who could carry on his work? How? EXPRESSIONS Focus on the expressions C. Listen again and complete what Mr. Benslimane says. Then circle S (stronger) or W (weaker) possibility. 1.Zellige disappear one day, if we do nothing.S / W 2.There's a good that young people will come back to it.S / W 3. my daughter Khadija will carry on my work.S / W 4.She bring new ideas.S / W 5.It's that she'll open a shop online.S / W 6. the internet will save our old crafts.S / W Practice Use the expressions Expressing possibility Modals: It may / might / could rain. (+ infinitive · might = less sure) · Adverbs: Perhaps / Maybe I'll go. · I'll probably go. (more sure) It's possible / likely that + clause · There's a (good) chance that + clause · Not likely: I don't think so. · I doubt it. · It's unlikely that … Say it: might /maɪt/ (silent gh) · POSsible · LIKEly · PerHAPS · maybe (adverb) ≠ may be (modal + be) D. Complete the mini-dialogue with the expressions in the box. ( Perhaps - likely - chance - could - possible - might ) A:Are you going to the Gnaoua Festival in Essaouira this summer? B:I'm not sure. I'll go with my cousins. A:It's that thousands of people will come. Will you find a hotel? B:Hotels may be full, but there's a that my aunt will host us. A:Lucky you! You meet famous musicians there. B:Yes! And it's that I'll stay a whole week. A:Hmm… your parents not agree to a whole week! E. Answer the questions. Express possibility in a different way each time. Then ask and answer with a partner. Question Your answer 1. Will the Tan-Tan Moussem be bigger next year? 2. Will young people still wear the djellaba in thirty years? 3. Will our school organise a trip to Volubilis this year? 4. Can traditional music become popular with teenagers? Free practice F. Role-play: “Heritage Voices” on the school radio. Act out the interview, then swap roles. Student A — journalist You work for the school radio. Interview a young artist about the future of his / her art. Ask at least four questions: Do you think … will …? What might happen if …? Is there a chance that …? Student B — young artist You are a young Ahwach dancer, Malhun singer or carpet weaver. Answer the questions and express possibility each time: may, might, could, perhaps, it's likely that …, there's a good chance that … Notes / my questions: Teacher copy Answer key & tapescript Do not hand out ECRIF stages Epictures + ACB notes · C + boxRDIEFF role-play Tapescript — read it aloud with a student, or record it≈ 2 min Nadia: Good morning, Mr. Benslimane. Thank you for welcoming “Heritage Voices” to your workshop. Driss: You're welcome. Please, come in. Nadia: How long have you been a zellige craftsman? Driss: For forty years. I started when I was twelve. My father taught me. Nadia: Can you tell our listeners how zellige is made? Driss: First, we shape the clay into squares and dry them in the sun. Then we fire them and paint them. Finally, we cut the small pieces by hand. One small fountain can take three months. Nadia: What are the problems of the craft today? Driss: Factories make cheap tiles with machines, and many young people don't want to learn because it's hard work. We may need more craft schools. Nadia: Do you think zellige might disappear one day? Driss: Well, zellige might disappear one day, if we do nothing. But I don't think so. There's a good chance that young people will come back to it. Tourists and architects love handmade zellige. Nadia: And your workshop? Who will carry on your work? Driss: Maybe my daughter Khadija will carry on my work. She's studying design, so she could bring new ideas. It's possible that she'll open a shop online. Nadia: Online zellige! That's interesting. Driss: Yes. Perhaps the internet will save our old crafts. It's likely that more people will order from abroad. Nadia: Thank you, Mr. Benslimane. # Task Expected answer Note A Predict how zellige is made · the problems of the craft today · the future of his workshop B Notes 1 Driss Benslimane, zellige craftsman, Fez · 2 40 years, since age 12, his father · 3 shape clay → dry in the sun → fire & paint → cut by hand · 4 cheap factory tiles; young people don't want to learn · 5 daughter Khadija (design): new ideas, online shop details C Gaps 1 might (W) · 2 chance (S) · 3 Maybe (W) · 4 could (W) · 5 possible (W) · 6 Perhaps (W) — It's likely that = S S / W D Dialogue Perhaps · likely · chance · could · possible · might in order E Answers e.g. It's likely that it will be bigger. / They might wear it only for celebrations. / There's a chance that we'll go. / Perhaps, if artists mix it with modern music. accept any F Role-play Check: 4+ questions, a variety of possibility expressions, no to after modals (*might to). delayed feedback Clarify — CCQs & pronunciation “Zellige might disappear.” Is Driss sure? (No) · “There's a good chance that …” — more or less sure than might? (more) · “I don't think so.” = probably not. Drill: might /maɪt/ · weak that /ðət/ in “It's likely that …” · falling intonation. Typi
