me": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. answer Salma's questions about their favourite subject and school activities (Task D).", "Ss. read their answers to a partner; 2–3 Ss. read to the class.", "T. tells Ss. that their answers will help them write a letter about school life in the Writing lesson."]}]}, {"id": "cc-u2-l4", "level": "Common Core", "unit": 2, "unitName": "What & How I Learn", "unitDir": "Unit 2 - What & How I Learn", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 — Grammar Part 1: the present simple (ECRIF)", "topic": "the present simple", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the present simple in the affirmative, negative and interrogative forms to talk about school routines and habits.", "words": [], "point": "he / she / it → verb + -s: walks, plays · -es after o, ch, sh, ss, x: goes, watches · consonant + y → -ies: study → studies · have → has", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “What time do you get up? How do you come to school?” and writes two answers on the board.", "Ss. look at the pictures, read the dialogue and answer: “How does Anas go to school? What does Mehdi do after school?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the verbs in the dialogue and complete the table (Task A).", "T. checks the answers and builds the board: affirmative, negative, question, short answers.", "T. clarifies with the Remember box: he / she / it + -s, -es, -ies, has; don't / doesn't + base verb; Do / Does + subject + base verb.", "CCQs: “She studies at university — a habit or now? (a habit)”. T. drills the -s endings /s/, /z/, /ɪz/."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in brackets in the present simple (Task B).", "Ss. check their answers with a partner; T. corrects on the board and focuses on -s and doesn't + base verb."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models prompt 1: “Do you get up at 6:30?” — “No, I don't. I get up at 7.”", "Ss. write the questions, ask their partner and note the answers (Task C).", "A few Ss. report: “Hamza doesn't get up at 6:30. He gets up at 7.”"]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. interview a classmate about his / her school day with the useful questions (Task D).", "Ss. write five sentences about their classmate for the school magazine; 2–3 Ss. read them to the class.", "T. monitors and gives delayed feedback on -s, don't / doesn't and question order."]}]}, {"id": "cc-u2-l5", "level": "Common Core", "unit": 2, "unitName": "What & How I Learn", "unitDir": "Unit 2 - What & How I Learn", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 — Grammar Part 2: prepositions of time (ECRIF)", "topic": "prepositions of time", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to correctly talk about school timetables, dates and activities using the prepositions of time in, on, at and from …", "words": ["days and dates", "clock times", "months and years", "the start and the end of a period"], "point": "in the morning / afternoon / evening — BUT at night · on Monday morning (day + part of the day) · at the weekend", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “When do we have English? What time does school start? When are the exams?” and writes the answers on the board.", "Ss. look at the pictures and read the school notice to answer: “When are the final exams? When is the library closed?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. look at the highlighted prepositions, complete the rule with the words in the box and add examples from the notice (Task A).", "T. clarifies with a timeline: at + clock time → on + day / date → in + month / year; from … to for a period.", "CCQs: “on 21st March — a month or a date? (a date)”. T. highlights the Remember box: in the morning BUT at night; on Monday morning."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct preposition (Task B).", "Ss. compare answers; T. corrects on the board and asks Ss. to justify each answer with the rule."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models: “When is your birthday?” — “It's on 12th April.”", "Ss. answer the questions about themselves in full sentences (Task C), then ask and answer them with a partner."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. create a new school club and write a notice with the day, the time (from … to), the place and a special event (Task D).", "Ss. present their notices to the class; the class chooses the club they want to join.", "T. gives delayed feedback on the prepositions."]}]}, {"id": "cc-u2-l6", "level": "Common Core", "unit": 2, "unitName": "What & How I Learn", "unitDir": "Unit 2 - What & How I Learn", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 — Writing: A letter about school life (Product)", "topic": "A letter about school life", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a letter of 60–80 words to a friend about their school life (school, timetable, subjects, rules and activities) with the correct layout and the linking words and, but and because.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss. of Salma's letter from the Reading lesson and asks: “Who writes? To whom? Why?”", "Ss. read the model letter and number its parts (Task A).", "T. checks and writes the layout of a letter on the board: greeting, opening, body, questions, closing, name."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put Yassine's reply in the right order (Task B).", "T. clarifies and / but / because with examples from the model (… English because our teacher …).", "Ss. join the sentences with and, but or because (Task C); T. corrects on the board."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. brainstorms ideas with the class: school name, city, timetable, favourite subject, rules, activities.", "Ss. plan their reply to Salma and write notes with the sentence starters (Task D).", "T. models how to turn notes into sentences on the board.", "Ss. turn two of their notes into full sentences and check them with a partner."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their letter to Salma about their school life, 60–80 words (Task E).", "Ss. check their letter with the checklist and correct it.", "T. collects the letters; 2 Ss. read their letters to the class."]}]}, {"id": "cc-u3-l1", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Vocabulary: Household articles, clothes & shopping (ECRIF)", "topic": "Household articles, clothes & shopping", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words for household articles, clothes and shopping to talk and write about what their family needs to buy.", "words": ["size", "expensive", "cash", "trousers", "washing machine", "checkout", "cooker", "socks", "cashier", "carpet", "dress", "discount", "curtains", "sweater", "price", "fridge", "scarf", "customer"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows a shopping bag and takes out real things or pictures (a plate, a scarf, a receipt) and asks: “Where do we buy these? Do you like shopping?”", "Ss. name the things they know.", "T. displays the three pictures (Context) and asks: “Where are the people? What can you buy there?”", "Ss. read Hind's text and answer the gist question: “What does Hind's family buy?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match each highlighted word with its meaning (Task A), then compare with a partner.", "T. checks and builds the board in three groups: Household articles / Clothes / Shopping.", "T. clarifies meaning with pictures, mime (try on) and CCQs: “Is a receipt money? (No) Is a shop assistant a customer? (No) Are things on sale cheap or expensive? (cheaper)”.", "Pronunciation: silent “p” in receipt, trousers /ˈtraʊzəz/, stress in exPENsive and asSIStant; choral then individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B).", "Pair check; T. corrects on the board and Ss. read the sentences aloud."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. find the odd word in each line and say why (Task C): “Scarf, because it's clothes, not a kitchen article.”", "Ss. put the words in the right column and add two words of their own to each column (Task D).", "Groups compare lists; T. adds new words to the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. imagine their family is moving to a new flat: they write a shopping list and sentences with the new words (Production): “We need a … for the kitchen. I want new … because …”.", "Ss. read their list to a partner, who asks: “Why do you need it? Is it expensive?”", "T. monitors and gives delayed feedback on spelling and pronunciation."]}]}, {"id": "cc-u3-l2", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 2, "dir": "2 Functions - Part 1", "skill": "Functions", "part": "Part 1", "label": "Functions - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Functions Part 1: Asking for & giving opinions (ECRIF)", "topic": "Asking for & giving opinions", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask for and give opinions about clothes and things in a shop (What do you think of …? / I think … / In my opinion, …) in a shopping role-play.", "words": ["What do you think of", "I think", "How do you like", "I don't like", "In my opinion", "I love"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows a picture of a jacket and asks two Ss: “Do you like this jacket? Is it nice?”", "Ss. answer freely; T. writes one answer on the board: “I think it's nice.”", "T. displays the two pictures and asks: “Where are the girls? What are they doing?”", "Ss. read the dialogue and answer the gist question: “What does Kawtar want to buy? Why?” (a dress for her cousin's wedding)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the expressions in the dialogue and write them in the right column (Task A), then compare with a partner.", "T. elicits answers and builds the board: Asking for an opinion / Positive opinion / Negative opinion.", "CCQs: “‘How do you like them?’ — is Kawtar asking for a price or an opinion? (an opinion) Why ‘them’? (the shoes — plural) Is ‘I don't like it very much’ positive or negative? (negative)”.", "Form: What do you think of + it / them? · I think + sentence · In my opinion, + sentence; choral then individual drilling of the exponents."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the expressions in the box (Task B).", "Pair check, then open pairs read the dialogue aloud; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models cue 1 with a strong student.", "Ss. write a short exchange for each situation (Task C), then practise it with a partner and swap roles.", "2–3 pairs perform; the class says if the opinion is positive or negative."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task D). Ss. role-play shopping for Eid clothes without looking at the dialogue: A asks for opinions, B gives opinions with reasons.", "Two pairs perform for the class; the class says what A decides to buy.", "T. gives delayed feedback on errors noted while monitoring."]}]}, {"id": "cc-u3-l3", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 3, "dir": "3 Functions - Part 2", "skill": "Functions", "part": "Part 2", "label": "Functions - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Functions Part 2: Asking about prices (ECRIF)", "topic": "Asking about prices", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask about and give prices (How much is / are …? — It's / They're … dirhams) and bargain politely when buying and selling at a shop or souk.", "words": ["How much is", "How much are", "It's", "They're", "too expensive", "discount"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. holds up a pen and a pair of socks with price tags and asks: “Is this pen expensive? Guess the price!”", "Ss. guess; T. answers: “It's 5 dirhams. They're 20 dirhams.”", "T. displays the two pictures and asks: “Where is Ayoub? Who is the man?”", "Ss. read the dialogue and answer the gist questions: “What does Ayoub buy? How much does he pay?” (a T-shirt and jeans, 300 dirhams)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the expressions in the dialogue and write them in the right column (Task A), then compare with a partner.", "T. elicits answers and builds the board: Asking about prices / Giving prices / Reacting and bargaining.", "CCQs: “Why ‘How much is’ for the T-shirt but ‘How much are’ for the jeans? (one thing / plural) Does ‘a discount’ make the price higher or lower? (lower) Who says ‘Here's your change’? (the seller)”.", "Form: How much is + singular? → It's … · How much are + plural? → They're …; numbers (15 / 50, 90 / 19); choral then individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the expressions in the box (Task B).", "Pair check, then open pairs read the dialogue aloud; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models cue 1 with a strong student.", "Ss. write a short exchange for each price tag (Task C), then practise it with a partner and swap roles.", "2–3 pairs perform; the class checks is / are and the numbers."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task D). Ss. role-play buying and selling at the souk: the customer buys three things with 600 DH, bargains and counts the change.", "Ss. change roles with a new partner; one pair performs for the class, who say what the customer bought and how much change he / she got.", "T. gives delayed feedback on errors noted while monitoring."]}]}, {"id": "cc-u3-l4", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 4, "dir": "4 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Reading: Hind's shopping habits (PDP)", "topic": "Hind's shopping habits", "approach": "PDP", "objective": "By the end of the lesson, students will be able to identify explicit details (who, when, where, why, how much) in a letter about shopping habits and talk about their own shopping habits.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “Where do you buy your clothes? Do you like shopping? Who do you go shopping with?”", "T. pre-teaches souk, shopping mall, bargain, pocket money and save with the pictures and mime.", "Ss. look at the title and the four pictures and predict what the text is about (Task A — tick one option). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the letter to check their predictions (Task A). T. asks: “Was your prediction right? Which words helped you?”", "T. explains the strategy: explicit details are written in the text, so we find the exact words and underline them.", "Ss. read carefully and decide if the statements are true or false, justifying with words from the text (Task B). Pair check; feedback with the lines.", "Ss. scan the text for the details to answer the questions (Task C): who, when, why, how much, where.", "Volunteers write the answers on the board and show the line in the text."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. answer Hind's three questions about their own shopping habits (Task D).", "Ss. read their answers to a partner, who finds one difference: “You prefer the souk, but I prefer the mall.” 2–3 Ss. report to the class."]}]}, {"id": "cc-u3-l5", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 5, "dir": "5 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Grammar Part 1: Comparatives (ECRIF)", "topic": "Comparatives", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to compare shops, places and products using comparative adjectives (short adjectives + -er, more + long adjectives, better / worse) + than.", "words": [], "point": "short adjective + -er + than: The souk is cheaper than the mall. · long adjective: more + adjective + than: more expensive than", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows two price tags (a pen 5 DH, a pen 15 DH) and asks: “Which pen is cheap? Which is expensive?” T. says: “This pen is cheaper than that pen.”", "T. displays the two pictures (the souk / the mall).", "Ss. read the dialogue and answer: “Where do Hind and Ayoub go in the end? Why?” (the mall — it's raining)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the comparatives in the dialogue and complete the table (Task A) in pairs.", "T. elicits the table and clarifies the form: short adjective + -er + than; spelling (big → bigger, close → closer, friendly → friendlier); long adjective: more + adjective + than; irregular good → better, bad → worse.", "CCQs: “The souk is cheaper than the mall — which one is more expensive? Can we say ‘more cheaper’? (No)”. Drill the sentences with weak “than” /ðən/."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. write the comparative form of the adjectives in brackets (Task B).", "Pair check; T. corrects on the board, focusing on spelling."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. compare the two things in each line using the information and the adjective, then write a second sentence with the opposite adjective (Task C).", "Ss. read their sentences to a partner, who checks -er / more and than."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["“Which is better?”: Ss. choose two places or things (the souk / the mall, online / in a shop …) and write four comparative sentences (Task D).", "Ss. discuss their choice with a partner: “I think the souk is better because it's cheaper.” Volunteers report to the class.", "T. gives delayed feedback on common errors (*more cheaper, *than / that)."]}]}, {"id": "cc-u3-l6", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 6, "dir": "6 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Grammar Part 2: Pronouns & possessives (ECRIF)", "topic": "Pronouns & possessives", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use subject and object pronouns, possessive adjectives and possessive pronouns correctly to say who things belong to (Whose … is this? — It's mine / hers).", "words": [], "point": "Subject pronoun before the verb: She buys … · Object pronoun after a verb or preposition: Give them to me.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. takes a student's pen and asks: “Whose pen is this? Is it yours?” — S: “Yes, it's mine.” T. repeats with 2–3 objects and writes one exchange on the board.", "T. displays the two pictures and asks: “Where are they? What's in the bags?”", "Ss. read the dialogue and answer: “Whose scarf is it? Whose trainers are they?” (Kawtar's · Ayoub's)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. look at the highlighted words in the dialogue and complete the table (Task A) in pairs.", "T. elicits the table and clarifies: subject pronoun before the verb; object pronoun after a verb or a preposition; possessive adjective + noun (my jacket); possessive pronoun alone (It's mine); its ≠ it's; Whose …? → It's Kawtar's / hers.", "CCQs: “‘It's mine.’ — is there a noun after mine? (No) Can we say ‘mine jacket’? (No)”. Drill Whose …? — It's mine / yours / his / hers."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct word in each sentence (Task B).", "Pair check; T. corrects on the board and asks Ss. to say why (before / after the verb, + noun or alone)."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. rewrite the sentences, replacing the underlined words with a pronoun or a possessive (Task C).", "Ss. compare with a partner; volunteers write their sentences on the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["“Whose is it?” game: in groups of four, Ss. put one personal thing each in a box, take one and ask: “Whose … is this? Is it yours?” — “No, it isn't mine. I think it's hers.” (Task D)", "Ss. write four sentences about the things in their group (Task D); volunteers read them to the class.", "T. gives delayed feedback on common errors (*mine jacket, *to she, *it's / its)."]}]}, {"id": "cc-u3-l7", "level": "Common Core", "unit": 3, "unitName": "Our Shopping Habits", "unitDir": "Unit 3 - Our Shopping Habits", "no": 7, "dir": "7 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Writing: A reply letter (Product)", "topic": "A reply letter", "approach": "Product", "objective": "By the end of the lesson, students will be able to write an informal reply letter to a pen friend about their shopping habits, giving opinions and using comparatives, possessives and the layout of a letter.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Hind's letter (Reading lesson): “Who is Hind? What three questions does she ask?”", "Ss. read Yasmine's reply and answer: “Does Yasmine prefer the souk or the mall? Why?”", "Ss. label the eight parts of the reply letter (Task A); T. checks and highlights the fixed phrases: Dear …, · Thank you for your letter. · Please write back soon. · Best wishes, + name."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put the parts of Othmane's reply in the right order (Task B); pair check.", "Ss. rewrite the lines with capital letters, commas, full stops, apostrophes and question marks (Task C); T. corrects on the board (its / it's, brother's)."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. plan their reply to Hind in the outline (Task D): opening · where I shop · my opinion · pocket money · my questions — notes only.", "Ss. turn the notes into sentences with the sentence starters (I prefer … because it's cheaper than … / In my opinion, …), then compare with a partner. T. monitors and helps."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write the full reply letter (60–80 words) in the letter frame (Task E).", "Ss. check their letter with the self-assessment checklist and correct it. T. collects the letters for written feedback."]}]}, {"id": "cc-u4-l1", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Vocabulary: Cinema, theatre, music & art (ECRIF)", "topic": "Cinema, theatre, music & art", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words about cinema, theatre, music and art, and common arts collocations, to talk and write about their artistic interests.", "words": ["watch a film", "play the guitar", "visit an exhibition", "go to a concert", "perform a play", "buy tickets"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the four pictures and asks: “What can you see? Which one do you like most: cinema, theatre, music or art?”", "Ss. name the places / activities they know.", "Ss. read Hajar's blog and answer the gist question: “Which arts does Hajar love?” (cinema, theatre, art and music)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the highlighted words and write them in the right column (Task A), then compare with a partner.", "T. elicits answers and builds a word map on the board: Cinema / Theatre / Music / Art.", "T. checks meaning with pictures, mime and CCQs: “Is a stage in a cinema or a theatre?” “Does a painter sing?”", "T. drills pronunciation and stress: theatre, exhibition, gallery, concert, audience."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. find the ten arts words in the word search and write C, T, M or A next to each one (Task B).", "Ss. match the verbs with the words to make collocations (Task C).", "T. corrects on the board: watch a film, play the guitar, visit an exhibition…"]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the sentences with the collocations in the box (Task D).", "Ss. check in pairs; T. elicits answers and Ss. read the sentences aloud.", "T. asks quick personal questions with the collocations: “When do you watch a film?” “Do you play the guitar?”", "Ss. answer with full sentences."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four sentences about their artistic interests, using four words and two collocations from the lesson (Task E).", "Ss. read their sentences to a partner, who finds one thing they have in common.", "T. invites 3–4 Ss. to share and gives feedback on word use and spelling."]}]}, {"id": "cc-u4-l2", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 2, "dir": "2 Functions - Part 1", "skill": "Functions", "part": "Part 1", "label": "Functions - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Functions Part 1: Likes & dislikes (ECRIF)", "topic": "Likes & dislikes", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to express likes and dislikes about films, music, theatre and art, and pronounce the third-person -s correctly.", "words": ["likes", "loves", "hates", "enjoys", "watches", "paints", "dances", "plays", "practises", "listens", "acts", "relaxes", "love", "can't bear", "keen on", "don't mind", "enjoy"], "point": "I love / like / enjoy / don't mind / hate / can't bear + noun or verb-ing: I love music. I enjoy playing the guitar.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. tells the class: “I love films, but I can't bear horror films!” and asks: “What about you?”", "Ss. answer freely.", "T. shows the two pictures; Ss. read the dialogue and answer: “What does Kenza love? What does Anas hate?” (painting / horror films)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the highlighted expressions and write them in the right column (Task A).", "T. builds a scale on the board: ☺☺ love / adore … ☹☹ hate / can't bear.", "T. clarifies form: love / enjoy / don't mind + noun or verb-ing (Remember box).", "Pronunciation: Ss. say the verbs and classify the -s ending as /s/, /z/ or /ɪz/ (Task B); T. drills watches, dances, practises."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogues with the expressions in the box (Task C).", "Ss. check in pairs, then open pairs read the mini-dialogues aloud.", "T. corrects and re-drills difficult lines."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models cue 1: “Yasmine loves dancing.”", "Ss. write a sentence for each cue, using a different expression each time (Task D).", "Ss. read their sentences; T. checks the -s ending and verb-ing."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task E). Ss. role-play the Arts Club survey and give reasons, then swap roles.", "Ss. report to the class about their partner: “Kenza loves painting, but she can't bear …”", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "cc-u4-l3", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 3, "dir": "3 Functions - Part 2", "skill": "Functions", "part": "Part 2", "label": "Functions - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Functions Part 2: Inviting (ECRIF)", "topic": "Inviting", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to invite friends to artistic events and accept or refuse invitations politely, giving a reason.", "words": ["Would you like", "I'd love to", "How about", "Sorry, I can't", "Maybe next time", "That sounds great"], "point": "Would you like to / Do you want to + verb: Would you like to come? · How about + verb-ing: How about inviting Yasmine?", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the film night poster and asks: “What is it? When is it? Would you like to go?”", "Ss. answer freely.", "Ss. read the dialogue and answer: “Where are Mehdi and Salma going? When?” (to film night, Saturday at six)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the highlighted expressions and write them in the right column (Task A), then compare with a partner.", "T. builds the board: Inviting / Accepting / Refusing.", "T. clarifies form: Would you like to + verb; How about + verb-ing (Remember box).", "CCQs: “Does Salma go for a juice? (No) Is she polite? (Yes — she says sorry and gives a reason.)”", "T. drills the expressions with rising intonation on the invitations."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the expressions in the box (Task B).", "Ss. check in pairs and read the dialogue aloud; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models invitation 1 with a strong student.", "Ss. accept or refuse each invitation as in the cue, giving a reason when they refuse (Task C).", "Pairs read their exchanges; the class checks that each refusal has a reason."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task D). Ss. role-play inviting and answering with their diaries, then swap roles.", "Ss. write their weekend plan; 2–3 pairs perform for the class.", "T. gives delayed feedback on the board."]}]}, {"id": "cc-u4-l4", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 4, "dir": "4 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Reading: Meet Nada, the young artist (PDP)", "topic": "Meet Nada, the young artist", "approach": "PDP", "objective": "By the end of the lesson, students will be able to scan the text “Meet Nada, the young artist of Ouarzazate” to find factual details such as ages, numbers, places and days.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “Do you know a young artist? What does he / she do?”", "T. pre-teaches kasbah, exhibition, fine arts, film studio and oud with the pictures.", "Ss. look at the title and the pictures and predict what the text is about (Task A — tick one option).", "T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the text to check their predictions (Task A). T. asks: “Which words helped you?”", "Ss. decide if the statements are true or false and justify with words from the text (Task B).", "Pair check; feedback with the lines.", "T. shows how to scan: read the fact, find the key word (a number, a day, a place), then read that sentence.", "Ss. complete Nada's fact file (Task C); volunteers write the answers on the board.", "Ss. answer the detail questions (Task D); T. checks orally."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. write three sentences about which of Nada's activities they would like to do and why (Task E).", "Ss. read their sentences to a partner; 2–3 Ss. read to the class.", "T. gives feedback and links to the next lesson (Nada's week)."]}]}, {"id": "cc-u4-l5", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 5, "dir": "5 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Grammar Part 1: Adverbs of frequency (ECRIF)", "topic": "Adverbs of frequency", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use adverbs of frequency in the right position to talk about their artistic habits.", "words": [], "point": "Adverb before the main verb: I often listen to music. · She usually paints at the weekend.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “How often do you go to the cinema?” and writes Ss' answers on the board.", "Ss. look at the pictures and read Nada's week; they answer: “How often does Nada paint?” (usually, at the weekend)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the highlighted adverbs and put them on the scale from 100% to 0% (Task A).", "T. checks meaning with CCQs: “I rarely watch TV — a lot? (No, almost never)”.", "Ss. complete the two sentences about position (Task A); T. builds the rule: adverb before the main verb, after be (Remember box).", "T. drills pronunciation: always, usually, often."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the adverb in the right place and rewrite the sentences (Task B).", "Pair check; volunteers write the sentences on the board; T. corrects."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models sentence 1 from Othmane's week: “He always practises the guitar.”", "Ss. write a sentence for each activity with the right adverb (Task C).", "T. checks the position after be (He is usually tired) and the -s ending."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. ask a partner “How often do you …?” and complete the arts habits survey (Task D).", "Ss. write three sentences comparing themselves with their partner; 3–4 Ss. read them aloud.", "T. gives delayed feedback on the board."]}]}, {"id": "cc-u4-l6", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 6, "dir": "6 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Grammar Part 2: How often / long / many / much (ECRIF)", "topic": "How often / long / many / much", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask and answer questions with How often, How long, How many and How much about artistic hobbies.", "words": [], "point": "How many + plural noun: How many paintings …? · How much + uncountable noun: How much time / money …?", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the pictures and asks: “Who is he? What does he play?”", "Ss. read the interview and answer: “What instrument does Othmane play? How many people are in his band?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match each question word with what it asks about and find an example answer in the interview (Task A).", "T. clarifies form: question word + do / does + subject + verb; How many + plural noun; How much + uncountable noun / price (Remember box).", "CCQs: “Can we count guitars? Can we count music?”; T. drills the questions."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the questions with How often, How long, How many or How much (Task B).", "Ss. check in pairs, then read the questions and answers aloud in open pairs."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models item 1: “How often does Nada paint?”", "Ss. write questions for the underlined words (Task C).", "Volunteers write the questions on the board; T. corrects do / does and the noun after many / much."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write one question with each question word about a classmate's favourite art or hobby (Task D).", "Ss. interview a classmate and note the answers.", "Ss. write a short report and tell the class about their classmate.", "T. gives delayed feedback on the board."]}]}, {"id": "cc-u4-l7", "level": "Common Core", "unit": 4, "unitName": "Artistic Interests", "unitDir": "Unit 4 - Artistic Interests", "no": 7, "dir": "7 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Writing: A film review (Product)", "topic": "A film review", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a short film review with basic information, the story, their opinion and a rating.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. shows the film poster and asks: “What kind of film is it? Do you read film reviews?”", "Ss. read Kenza's review and answer: “Does Kenza like the film?” (Yes, but not the ending.)", "Ss. number the parts of the review in the boxes (Task A).", "T. writes the layout on the board: title – basic information – story – opinion – rating."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. match the adjectives with their meanings (Task B); T. checks and drills them.", "Ss. complete the sentences with and, but, because or so (Task C).", "T. corrects on the board and points out the linkers in Kenza's review."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. elicits films Ss. know and brainstorms types of films on the board (comedy, cartoon, drama, action).", "Ss. choose a film and write notes for each part using the sentence starters (Task D).", "T. goes round and helps with vocabulary."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their film review (60–80 words) for the school magazine (Task E).", "Ss. check their review with the checklist and correct their mistakes.", "T. collects the reviews for marking."]}]}, {"id": "cc-u5-l1", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Vocabulary: Food, meals & eating habits (ECRIF)", "topic": "Food, meals & eating habits", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words about food, meals, preparing meals and eating habits to describe their own family's eating habits.", "words": ["breakfast", "healthy", "plan", "fast food", "wash", "lunch", "dinner", "rice", "boil", "cut", "skip breakfast", "fish", "fry", "eat fast food", "lentils", "drink water", "snack"], "point": "have breakfast / lunch / dinner · skip a meal · plan the meals · prepare a meal · make a shopping list · a healthy snack / diet · wash, peel, chop, boil, fry vegetables", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the three pictures and asks: “What can you see? What do you usually have for breakfast?”", "Ss. answer and T. writes their food words on the board.", "Ss. read Salma's text and answer the gist question: “Which meal does Salma never skip?” (breakfast)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the words with their meanings (Task A), then compare with a partner.", "T. checks the answers and shows meaning with pictures and mime (wash, peel, chop).", "T. asks CCQs: “Is an apple at 10 a.m. a meal or a snack? (a snack) If I skip lunch, do I eat at 1 p.m.? (No)”", "T. models and drills vegetables, breakfast, dessert (≠ desert); Ss. repeat chorally, then individually."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B).", "Ss. check in pairs; volunteers read the sentences aloud and T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. put the words from the box in the right group: Meals, Food, Preparing food, Eating habits (Task C).", "Ss. add one word of their own to each group.", "T. elicits the new words, reads the collocations in the Remember box with the class and adds them to the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five sentences about their family's eating habits with the new words (Task D).", "Ss. read their sentences to a partner and find two differences; 2–3 Ss. report to the class.", "T. monitors and gives delayed feedback on word use."]}]}, {"id": "cc-u5-l2", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 2, "dir": "2 Functions - Part 1", "skill": "Functions", "part": "Part 1", "label": "Functions - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Functions (Part 1): Agreeing & disagreeing (ECRIF)", "topic": "Agreeing & disagreeing", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to agree and disagree with other people's opinions about food and eating habits, giving a simple reason.", "words": ["too", "So do I", "Surely not", "Me neither"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. says: “I love pizza!” and asks 3–4 Ss.: “Do you like pizza too?” T. writes their answers on the board.", "T. shows the two pictures and asks: “Where are they? What are they talking about?”", "Ss. read the dialogue and answer: “Who likes pizza? Who prefers couscous?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the expressions in the dialogue and write them in the right column (Task A), then compare with a partner.", "T. builds the board: Agreeing / Disagreeing.", "T. asks CCQs: “Hamza says ‘I don't like vegetables.’ Nora agrees: So do I or Me neither? (Me neither) Is ‘Surely not!’ soft or strong? (strong)”", "T. models stress and intonation: Me TOO! · SUREly NOT!; Ss. repeat chorally, then individually."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogues with the expressions in the box (Task B).", "Ss. check in pairs; open pairs read the exchanges aloud with the right intonation."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models statement 1 with a strong student.", "Ss. agree or disagree with each statement and write a reason (Task C), then read their answers to a partner.", "3–4 Ss. read a statement aloud; the class reacts with an agreeing or disagreeing expression and a reason."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task D). Ss. role-play the food debate, giving opinions and reacting to each one with a reason.", "Pairs note three things they agree on and report to the class.", "T. monitors, notes errors (Me too / Me neither) and gives delayed feedback on the board."]}]}, {"id": "cc-u5-l3", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 3, "dir": "3 Functions - Part 2", "skill": "Functions", "part": "Part 2", "label": "Functions - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Functions (Part 2): Ordering a meal (ECRIF)", "topic": "Ordering a meal", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to order a meal politely in a restaurant and ask for the bill, and take a customer's order as a waiter.", "words": ["ready", "I'd like", "would you like", "Can I have", "Anything else", "the bill"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “Do you go to restaurants? What do you order?” and writes Ss' food words on the board.", "T. shows the two pictures; Ss. read the dialogue and answer: “What do Salma and her father order?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. decide who says each expression and write it in the right column (Task A).", "T. checks and builds the board: The waiter says / The customer says.", "T. asks CCQs: “Who asks ‘Anything else?’ (the waiter) Is ‘I want the fish’ polite? (not very) What is ‘the bill’? (the paper with the price)”", "T. drills I'd like / Can I have …, please? with polite rising intonation."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the waiter–customer dialogue with the words in the box (Task B).", "Ss. check in pairs, then open pairs perform it."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1.", "Ss. write what they say in each situation (Task C), then practise the exchanges with a partner and swap roles.", "3 pairs act out one situation; the class says which expression they used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. sets up a restaurant corner. Ss. role-play the waiter and the customer with the Dar Salam menu and the role cards (Task D): order a full meal, then ask for the bill.", "Ss. swap roles and write their order and the bill.", "T. monitors and gives delayed feedback on polite forms and prices."]}]}, {"id": "cc-u5-l4", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 4, "dir": "4 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Reading: What do Fez teenagers eat? (PDP)", "topic": "What do Fez teenagers eat?", "approach": "PDP", "objective": "By the end of the lesson, students will be able to scan the text “What do Fez teenagers eat?” to find specific numbers and details quickly, and read and recite a short poem about healthy food.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks: “What do you have for breakfast? How often do you eat fast food?”", "T. pre-teaches survey, results, fizzy drinks and worried with pictures and examples.", "Ss. look at the title and the four pictures and predict what the text is about (Task A — tick one option). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. read the text quickly to check their predictions (Task A). T. asks: “Was your prediction right? Which words helped you?”", "T. explains scanning: look only for the numbers, don't read every word.", "Ss. scan the text in two minutes and write what each number refers to (Task B). Pair check; feedback with the paragraph.", "Ss. scan the text to decide if the statements are true or false and justify with words from the text (Task C). Volunteers read the justifications aloud."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["T. reads the poem aloud; Ss. underline the food words. Ss. read it chorally, then in pairs, line by line, and recite it from memory (Task D).", "Ss. write two new lines about their favourite healthy food; 3–4 Ss. read their lines to the class."]}]}, {"id": "cc-u5-l5", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 5, "dir": "5 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Grammar (Part 1): the present continuous (ECRIF)", "topic": "the present continuous", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the present continuous in the affirmative, negative and interrogative forms to talk about actions happening now.", "words": [], "point": "Form: am / is / are + verb-ing · Use: an action happening now — now, right now, at the moment, Look!, Listen!", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. mimes cooking and asks: “What am I doing?” Ss. guess: “You're cooking.”", "T. shows the two pictures; Ss. read the phone dialogue and answer: “What is Salma doing? What is her dad doing?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the present continuous verbs in the dialogue and complete the table (Task A); pair check.", "T. builds the form on the board: am / is / are + verb-ing.", "T. asks CCQs: “Is Salma cooking now or every day? (now) Is Ayoub helping in the kitchen? (No, he isn't)”", "T. reads the Remember box with the class: time words and spelling (making, cutting, sitting)."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in brackets in the present continuous (Task B).", "Ss. check in pairs; T. corrects on the board and highlights the spelling changes."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. look at the clues and write what each person is or isn't doing, then a question and a short answer (Task C).", "Ss. ask and answer the questions with a partner; T. checks question order and short answers."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. play “Guess what I'm doing!”: one S. mimes a kitchen action, the partner asks Yes / No questions to guess it (Task D).", "Ss. write four sentences about what their family is doing right now and read them to a partner.", "T. monitors and gives delayed feedback on the board."]}]}, {"id": "cc-u5-l6", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 6, "dir": "6 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Grammar (Part 2): quantifiers & articles (ECRIF)", "topic": "quantifiers & articles", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the quantifiers a few, a little, a lot of, many and much, and the articles a, an, the and no article, to talk about food and quantities.", "words": [], "point": "How many + countable? · How much + uncountable? · a lot of = countable and uncountable", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the pictures and asks: “What can you see in Grandma's kitchen? What can she make with lentils?”", "Ss. read the dialogue and answer: “What are Grandma and Salma making?” (lentil soup)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the quantifiers in the dialogue, tick the right column and write an example (Task A); pair check.", "T. sorts countable / uncountable nouns on the board.", "T. asks CCQs: “Can we count tomatoes? (yes) Salt? (no) Why ‘the cumin’? (a specific one) Why no article in ‘Soup is good for you’? (soup in general)”", "T. reads the Remember box with the class (a / an / the / Ø, How many / How much)."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct quantifier (Task B), then complete the sentences with a, an, the or Ø (Task C).", "Ss. check in pairs; T. corrects on the board and asks Ss. to explain each choice."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. look at what is in Grandma's kitchen and write a sentence for each item with a quantifier or an article (Task D).", "Ss. read their sentences to a partner, who checks the quantifier and the article; 3 Ss. write theirs on the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. plan the food and drinks for a class picnic in Ifrane with a partner, using the useful language (Task E).", "Pairs write their list in sentences and present it to another pair, who asks “How many …? / How much …?”", "T. monitors and gives delayed feedback."]}]}, {"id": "cc-u5-l7", "level": "Common Core", "unit": 5, "unitName": "Our Eating Habits", "unitDir": "Unit 5 - Our Eating Habits", "no": 7, "dir": "7 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Writing: A recipe (Product)", "topic": "A recipe", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a simple recipe for a Moroccan dish with a title, a list of ingredients and ordered steps, using imperatives, sequencers and quantifiers.", "words": ["First", "Then", "Next", "After that", "Finally", "peel", "cut", "mix", "add", "serve"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss. of Grandma Fatima's lentil soup (Grammar lesson) and shows the pictures.", "Ss. read the model recipe and answer: “How many ingredients are there? How long does it take?”", "Ss. write the number of each part in the boxes of the recipe (Task A). T. checks and highlights the sequencers (First, Then, Next, After that, Finally) and the imperatives."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put the steps for Moroccan mint tea in the right order (Task B); pair check.", "Ss. complete the salad steps with a sequencer and a verb from the boxes (Task C), with a comma after each sequencer."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. choose their favourite Moroccan dish and plan the recipe in the outline (Task D): title, serves / time, ingredients, method, tip — notes only.", "Ss. turn the notes into short steps with the sentence starters and compare with a partner. T. monitors and helps with food words."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their recipe (60–80 words) in the frame (Task E).", "Ss. check their recipe with the checklist and correct it. T. collects the recipes for written feedback."]}]}, {"id": "cc-u6-l1", "level": "Common Core", "unit": 6, "unitName": "How We Keep Healthy", "unitDir": "Unit 6 - How We Keep Healthy", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Vocabulary: Keeping clean, medical care & prevention (ECRIF)", "topic": "Keeping clean, medical care & prevention", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to recognise and use words about personal hygiene, medical care and prevention to talk about what they do to keep clean and healthy.", "words": ["brush", "soap", "cough", "syrup", "check-up", "healthy diet", "comb your hair", "injection", "vaccine", "cut your nails", "prescription", "exercise", "take a shower", "thermometer", "brush your teeth", "tablets", "sleep well"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. mimes washing hands and brushing teeth and asks: “What am I doing? Why is it important?”", "Ss. guess the actions and answer.", "T. displays the four pictures and elicits what Ss can see.", "Ss. read Salma's text and answer the gist question: “How does Salma keep healthy?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the words with their meanings (Task A), then compare answers.", "T. checks answers and writes the words on the board in three groups: hygiene / medical care / prevention.", "T. checks meaning with CCQs: “Where do you buy medicine? (at the chemist's) Who writes a prescription? (the doctor) Does a vaccine cure or prevent an illness? (prevent)”.", "T. drills pronunciation and stress: germs, cough /kɒf/, chemist's /k/, prescription (oOo), temperature (Ooo)."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B).", "T. corrects on the board.", "Ss. find the eight health words in the word search (Task C) and write them next to the puzzle.", "The first S. to finish reads the words aloud and spells two of them."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. classify the twelve words in the table (Task D).", "Ss. add one more word of their own to each column, then compare with a partner.", "T. elicits Ss' extra words and adds them to the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. asks: “What do you and your family do to keep healthy?” and gives an example.", "Ss. write four sentences about their family's healthy habits with words from the lesson (Task E).", "Ss. read their sentences to a partner, who says one habit they share.", "T. gives delayed feedback on spelling and word use."]}]}, {"id": "cc-u6-l2", "level": "Common Core", "unit": 6, "unitName": "How We Keep Healthy", "unitDir": "Unit 6 - How We Keep Healthy", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Functions: Asking about health & asking for help (ECRIF)", "topic": "Asking about health & asking for help", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask about someone's health, say how they feel, and ask for help politely using tags (You don't have …, do you?) and Could you …?", "words": ["How are things going", "What's the matter", "I've got", "You don't have", "do you", "Could you"], "point": "Asking for help with a tag: You don't have a tissue, do you? ↘ (falling tone: you think the answer is no, but you ask politely)", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. holds his head and says: “I've got a headache. How are things going with you?”", "Ss. answer freely: “Fine, thanks.” / “Not bad.”", "T. shows the two pictures and asks: “Where is Ayoub? How does he feel?”", "Ss. listen to and read the dialogue, then answer: “What's wrong with Ayoub? Who does he ask for help?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the expressions in the dialogue and write them in the right column (Task A).", "T. checks and builds the board: asking about health / saying how you feel / asking for help.", "T. explains the Remember box: You don't have …, do you? = a polite request; answers Yes, I do. / Sorry, I don't.", "T. drills the falling tone on the tag: “You don't have a tissue, ↘do you?”", "Ss. listen to six short exchanges and tick the correct response (Task B).", "Ss. listen again to check; T. corrects and reads the tapescript lines aloud."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogues with the expressions in the box (Task C).", "Ss. check with a partner and read the mini-dialogues aloud.", "T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1 with a strong student.", "Ss. write a short exchange for each situation (Task D), then practise it with a partner, changing roles.", "Two or three pairs act out their exchanges; the class names the expression used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task E).", "Ss. role-play the situation without looking at the dialogue, then swap roles with a new health problem.", "Two or three pairs perform for the class.", "T. gives delayed feedback on common errors (*Yes, I have. → Yes, I do. / *don't you? → do you?)."]}]}, {"id": "cc-u6-l3", "level": "Common Core", "unit": 6, "unitName": "How We Keep Healthy", "unitDir": "Unit 6 - How We Keep Healthy", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Reading: From our school magazine (PDP)", "topic": "From our school magazine", "approach": "PDP", "objective": "By the end of the lesson, students will be able to read a short magazine article for gist, choose its best title and identify the main idea of each paragraph about healthy habits.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. asks: “Do you often feel tired at school? What do you do to stay healthy?”", "Ss. answer freely.", "Ss. look at the four pictures and say what they have in common.", "T. pre-teaches germs, spread, skip (breakfast), check-up and prevention with pictures and mime.", "Ss. tick what they think the text is about (Task A)."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["T. sets a 2-minute limit. Ss. read the text quickly and check their prediction (Task A).", "T. asks: “Was your prediction right? Which words helped you?”", "Ss. read quickly again and choose the best title (Task B).", "T. checks and explains why the other titles are about one detail only.", "T. shows how the first sentence of a paragraph gives its main idea.", "Ss. write the number of the paragraph for each main idea (Task C), then compare with a partner.", "Ss. read carefully and decide if the sentences are true or false, and justify from the text (Task D).", "T. corrects; Ss. read the justifying lines aloud."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. choose the most useful tip for them and write two or three sentences explaining why (Task E).", "Ss. compare with a partner; volunteers read their answers to the class.", "T. lists the class's favourite tips on the board for the Writing lesson."]}]}, {"id": "cc-u6-l4", "level": "Common Core", "unit": 6, "unitName": "How We Keep Healthy", "unitDir": "Unit 6 - How We Keep Healthy", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Grammar Part 1: must, mustn't, don't have to (ECRIF)", "topic": "must, mustn't, don't have to", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use must, mustn't and don't have to to talk about obligation, prohibition and no obligation in rules for a healthy school.", "words": [], "point": "must → obligation ✓ · mustn't → prohibition ✗ (= Don't!) · don't have to → not necessary (you can if you want)", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows a “No smoking” sign and a hand-washing sign and asks: “What do these signs tell us?”", "Ss. answer freely.", "Ss. look at the pictures, read the dialogue and answer: “When must the club members come? What mustn't they do?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline must, mustn't and don't have to in the dialogue and complete the table (Task A).", "T. checks the table and clarifies meaning with a ✓ / ✗ / ? board: must = necessary; mustn't = not allowed; don't have to = not necessary.", "CCQs: “You don't have to wear a white coat. Can you wear one? (Yes) Is it necessary? (No)”.", "T. points out the form (must + base verb, doesn't have to) and drills mustn't /ˈmʌsnt/."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct answer in the eight sentences (Task B).", "Ss. check with a partner; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. write a rule for each idea with must, mustn't or don't have to (Task C).", "Ss. compare their rules with a partner and discuss any differences.", "T. elicits one rule per idea and corrects the form."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five rules for their class Healthy Life Club poster (Task D).", "Volunteers present their rules; the class votes for the best poster.", "T. gives delayed feedback on common errors (*must to, *don't must)."]}]}, {"id": "cc-u6-l5", "level": "Common Core", "unit": 6, "unitName": "How We Keep Healthy", "unitDir": "Unit 6 - How We Keep Healthy", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Grammar Part 2: Reflexive pronouns (ECRIF)", "topic": "Reflexive pronouns", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use reflexive pronouns (myself, yourself, himself …) correctly to talk about looking after themselves and safety at home.", "words": [], "point": "We use a reflexive pronoun when the subject and the object are the same person: I cut myself. I cut me. ✗", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. mimes cutting a finger and putting on a plaster and says: “I cut myself. I put on the plaster myself.”", "Ss. say what happened.", "Ss. look at the pictures, read the dialogue and answer: “What is the lesson about? Who lives alone?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the reflexive pronouns in the dialogue and complete the table (Task A).", "T. checks the table and clarifies use: subject = object (I cut myself); by myself = alone, without help.", "CCQs: “He hurts himself. Who is hurt? (he) I do it myself. Does someone help me? (No)”.", "T. highlights -self / -selves and drills the stress on self."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the eight sentences with the correct reflexive pronoun (Task B).", "Ss. check with a partner; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. answer the four questions with full sentences (Task C).", "Ss. ask a partner the same questions and note his / her answers.", "Volunteers report: “Hiba makes her breakfast herself.”"]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four safety tips for a “Stay safe at home” leaflet with reflexive pronouns (Task D).", "Ss. read their tips to a partner, then a few to the class.", "T. gives delayed feedback on common errors (*hisself, *I cut me)."]}]}, {"id": "cc-u6-l6", "level": "Common Core", "unit": 6, "unitName": "How We Keep Healthy", "unitDir": "Unit 6 - How We Keep Healthy", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Writing: A letter of advice (Product)", "topic": "A letter of advice", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a short letter of advice to a friend with a health problem, using should, mustn't and Why don't you …? with the correct layout.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Salma's tips from the Reading lesson and asks: “What can you say to a friend who always feels tired?”", "Ss. read Salma's letter to Ayoub and answer: “What is Ayoub's problem? How many pieces of advice does Salma give?”", "Ss. write the number of each part in the boxes of the letter (Task A); T. checks."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["T. elicits the advice expressions from the letter and the box: should / shouldn't / Why don't you …? / Try to … / must, mustn't.", "Ss. match each problem with the best advice (Task B).", "Ss. rewrite the four lines with capitals and punctuation (Task C).", "T. corrects on the board."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. read Hamza's letter and underline his problems.", "T. elicits one piece of advice for each problem.", "Ss. plan their reply in the table with the sentence starters (Task D).", "T. monitors and helps with ideas and language."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their letter of advice to Hamza (60–80 words) in the frame (Task E).", "Ss. check their letter with the checklist and correct their mistakes.", "T. collects the letters for marking."]}]}, {"id": "cc-u7-l1", "level": "Common Core", "unit": 7, "unitName": "Our Hobbies", "unitDir": "Unit 7 - Our Hobbies", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Vocabulary: Hobbies, Sports & Games (ECRIF)", "topic": "Hobbies, Sports & Games", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words about leisure activities, sports and games with play, go and do, use a dictionary entry (part of speech, plural, synonym, alphabetical order) and replace words with their synonyms.", "words": ["play", "go", "do"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “What do you do in your free time?” and writes Ss’ ideas on the board.", "T. shows the three pictures and Ss. name the activities (chess, swimming, hiking).", "Ss. read Ilyas’s text and answer: “What are Salma’s hobbies?” (collecting stamps, reading comics, painting)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the highlighted words with their meanings (Task A), then compare with a partner.", "T. checks the answers and drills the stress: HOBby, PAINTing, PAStime.", "T. uses the text to build the board: play + games (play football, chess) · go + -ing (go swimming, go hiking) · do + karate / yoga.", "CCQs: “Do we say ‘go football’?” (No, play football) · “Chess or swimming: which one is a board game?” (chess)"]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with play, go or do (Task B).", "Ss. check with a partner; T. corrects on the board and points out does with he / she."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. shows how to read a dictionary entry: word, pronunciation, part of speech, plural, example, synonym.", "Ss. answer the dictionary questions and put words in alphabetical order (Task C).", "Ss. match each word with its synonym (Task D).", "T. checks and Ss. say a sentence with one synonym: “In my spare time, I …”."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five sentences about their hobbies and free time, using play / go / do and two synonyms (Task E).", "Ss. read their sentences to a partner, who finds one thing in common.", "T. monitors and gives delayed feedback on collocations and spelling."]}]}, {"id": "cc-u7-l2", "level": "Common Core", "unit": 7, "unitName": "Our Hobbies", "unitDir": "Unit 7 - Our Hobbies", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Functions: Describing Past Actions (ECRIF)", "topic": "Describing Past Actions", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask and answer about past actions (What did you do …? Where did you go? Did you …? — Yes, I did. / No, I didn’t.), react to what others say and take notes while listening.", "words": ["What did you do last weekend?", "Where did you go?", "Did you win?", "I played in …", "We went to …", "We had a picnic.", "It was amazing!", "That sounds fun!", "Yes, I did.", "did you do", "went", "Did you", "didn't", "What", "played", "was"], "point": "Did you + verb …? → Did you win? — Yes, I did. / No, I didn't. · What / Where did you + verb …?", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. tells the class about his weekend: “Last Sunday, I went to the beach. I played football with my son.”", "T. shows the two pictures and asks: “What did they do last weekend?”", "Ss. listen to Salma and Anas and take notes in the table: when, where, who with (Task A).", "Ss. listen a second time and complete what they did and how it was."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. listen again and put the expressions in the right column (Task B).", "T. elicits and builds the board: Asking (What did you do …? Did you …?) / Describing (I played …, We went to …) / Reacting (That sounds fun!).", "CCQs: “Is Anas talking about now or the past?” (the past) · “Did you win? — Yes, I did. Can we say ‘Yes, I won’ too?” (yes, but the short answer is ‘Yes, I did.’)", "T. reads the Remember box with Ss.: Did + base verb; went, had, won, took, saw; choral and individual drilling of the questions."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the expressions in the box (Task C).", "Ss. check with a partner, then two Ss. read the dialogue aloud.", "T. corrects on the board and re-drills difficult lines."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models cue 1 with a strong student: “What did you do last Saturday?” — “I watched a basketball match on TV.”", "Ss. write and practise a question and an answer for each cue (Task D), then swap roles.", "2–3 Ss. perform; the class says which past form they heard."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task E). Ss. role-play talking about last weekend without looking at the dialogue.", "Ss. change partners and tell a new partner about their weekend.", "T. monitors, notes errors (*Did you went?) and gives delayed feedback on the board."]}]}, {"id": "cc-u7-l3", "level": "Common Core", "unit": 7, "unitName": "Our Hobbies", "unitDir": "Unit 7 - Our Hobbies", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Reading: My Camera, My Best Friend (PDP)", "topic": "My Camera, My Best Friend", "approach": "PDP", "objective": "By the end of the lesson, students will be able to read a text about a hobby for relevant details, justify answers from the text and work out implied meaning from clues.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. shows an old camera (or a picture) and asks: “Do you take photos? What do you take photos of?”", "T. pre-teaches shy, coach, exhibition and visitor with pictures and mime.", "Ss. look at the title and the pictures and guess what Salma’s “best friend” is (Task A)."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. read the text quickly and check their guess in Task A.", "T. elicits the answer and the words that helped (camera, photos, club).", "T. explains how to find relevant details: underline the key word in the sentence, find it in the text, read only that part.", "Ss. decide if the sentences are true or false and justify with a line from the text (Task B).", "Ss. answer the detail questions (Task C), then compare with a partner.", "T. checks answers and Ss. say the paragraph number.", "T. models question 1: “The text doesn’t say ‘I’m not shy now’. Which sentence tells us?” (I talked to a lot of visitors).", "Ss. read between the lines and answer the questions with clues (Task D).", "T. elicits the clues and accepts reasonable answers."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. write 2–3 sentences about a hobby that helps them (Task E).", "Ss. read their sentences to a partner, then 3–4 Ss. share with the class.", "T. tells Ss. that Salma’s text will be the model for the writing lesson."]}]}, {"id": "cc-u7-l4", "level": "Common Core", "unit": 7, "unitName": "Our Hobbies", "unitDir": "Unit 7 - Our Hobbies", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Grammar Part 1: the verb be in the past simple (ECRIF)", "topic": "the verb be in the past simple", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the verb be in the past simple (was / were) in affirmative, negative and interrogative sentences and give short answers.", "words": [], "point": "am / is → was · are → were · I / he / she / it → was · you / we / they → were", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "ste
