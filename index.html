<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fb;--panel:#fff;--ink:#14213d;--ink2:#56627a;--line:#e3e7ef;--soft:#eef1f7;
  --accent:#14213d;--accent-ink:#fff;--shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px -12px rgba(20,33,61,.18);
  --vocab:#0e9f8e;--func:#7c5cff;--read:#2f6fed;--gram:#f28c28;--writ:#e0457b;
  --ok:#1f9d63;--warn:#d98a00;--bad:#d64545;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,"Segoe UI",Roboto,sans-serif;
}
[data-theme=dark]{
  --bg:#0d1424;--panel:#141d33;--ink:#e9eefb;--ink2:#9aa7c4;--line:#243049;--soft:#1b2640;
  --accent:#e9eefb;--accent-ink:#0d1424;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --vocab:#2fc9b6;--func:#a28fff;--read:#6b9bff;--gram:#ffaa55;--writ:#ff6f9e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--read);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;line-height:1.15}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:conic-gradient(var(--vocab) 0 20%,var(--func) 0 40%,var(--read) 0 60%,var(--gram) 0 80%,var(--writ) 0);display:grid;place-items:center}
.logo i{width:18px;height:18px;border-radius:6px;background:var(--panel);display:block}
.brand b{font:700 17px var(--display);display:block}
.brand small{color:var(--ink2);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav button,.unit-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:500;width:100%}
.nav button:hover,.unit-btn:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
.side h3{font-size:12px;color:var(--ink2);font-weight:600;padding:8px 10px 4px;font-family:var(--body)}
.levels{display:flex;gap:6px;padding:0 6px 10px}
.levels button{flex:1;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.levels button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.unit-btn .n{width:24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:600 12px var(--body);color:var(--ink)}
.unit-btn .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-btn[aria-current=true]{background:var(--soft);color:var(--ink)}
.ring{--p:0;width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--panel)}
.sidefoot{margin-top:16px;padding:10px;border-top:1px solid var(--line);color:var(--ink2);font-size:12px}
/* main */
.main{padding:22px clamp(16px,3vw,40px) 80px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 44px 12px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.search svg{position:absolute;left:13px;top:13px;opacity:.5}
.search kbd{position:absolute;right:12px;top:11px;font:600 12px var(--body);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink2)}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;font-weight:500}
.ibtn:hover{background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink2))}
.chip[aria-pressed=true]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.chip[aria-pressed=true] i{background:#fff}
.chip.all[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.page-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{font-size:clamp(26px,3.4vw,38px)}
.page-title p{margin:4px 0 0;color:var(--ink2)}
/* unit strips */
.unit{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.unit-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.unit-head h2{font-size:20px}
.unit-head .meta{color:var(--ink2);font-size:13px}
.unit-head .bar{flex:1;min-width:80px;height:6px;background:var(--soft);border-radius:9px;overflow:hidden;max-width:220px;margin-left:auto}
.unit-head .bar span{display:block;height:100%;background:var(--ok)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;border-radius:14px;background:var(--soft);padding:12px 12px 12px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .15s}
.tile::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 5px 5px 0;background:var(--c)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{font:700 15px var(--display)}
.tile .sub{font-size:12px;color:var(--ink2)}
.tile .foot{display:flex;gap:6px;align-items:center;margin-top:8px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--ink2);border:1px solid var(--line)}
.badge.p{color:var(--c);border-color:var(--c)}
.dot{width:9px;height:9px;border-radius:50%;margin-left:auto;background:var(--ink2)}
.st-ready .dot,.st-taught .dot{background:var(--ok)}.st-review .dot{background:var(--warn)}.st-work .dot{background:var(--bad)}
.st-taught{outline:2px solid color-mix(in srgb,var(--ok) 55%,transparent)}
.flag{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;color:#fff;background:var(--bad);border-radius:6px;padding:1px 6px}
.tile .topic{font-size:12px;color:var(--ink);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* search results */
.results{display:flex;flex-direction:column;gap:10px}
.hit{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.hit:hover{background:var(--soft)}
.hit .meta{font-size:12px;color:var(--ink2)}
.hit .meta .where{font-weight:600;color:var(--ink)}
.hit b{font:700 16px var(--display);display:block;margin:2px 0}
.hit .snip{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
mark{background:color-mix(in srgb,var(--gram) 38%,transparent);color:inherit;border-radius:3px;padding:0 1px}
/* lesson details */
.kv h3{font:600 13px var(--body);color:var(--ink2);margin:0 0 4px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.tbar{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;margin:4px 0 10px;background:var(--soft)}
.tbar span{background:var(--c)}
.tbar span:nth-child(even){opacity:.55}
.stages{display:flex;flex-direction:column;gap:6px}
details.stage{border:1px solid var(--line);border-radius:10px;padding:7px 10px}
details.stage summary{cursor:pointer;font-weight:600;font-size:14px}
details.stage summary .m{float:right;color:var(--ink2);font-weight:500}
details.stage ul{margin:6px 0 2px;padding-left:18px;color:var(--ink2);font-size:13px}
.kpi.ok{color:var(--ok)}.kpi.bad{color:var(--bad)}.kpi.warn{color:var(--warn)}
/* list view */
.table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table th{font-size:12px;color:var(--ink2);text-align:left;padding:10px 12px;background:var(--soft);font-weight:600}
.table td{padding:9px 12px;border-top:1px solid var(--line)}
.table tr:hover td{background:var(--soft);cursor:pointer}
/* dashboard */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:10px}
.kpi{font:700 38px var(--display);line-height:1}
.hbar{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--soft);margin:8px 0}
.hbar span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.sev{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.ok{background:var(--ok)}
.row .sev{align-self:center;flex:none}
.card a{color:var(--read)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);z-index:21;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.drawer.on{transform:none;visibility:visible;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);transition:transform .25s ease}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between}
.dh h2{font-size:22px}
.db{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;gap:8px;justify-content:center;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--c,var(--accent));color:#fff;border-color:transparent}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
label.f{display:grid;gap:5px;font-size:13px;color:var(--ink2);font-weight:600}
select,textarea,.inp{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
textarea{min-height:110px;resize:vertical}
.preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:340px}
.preview iframe{width:100%;height:100%;border:0}
.empty{padding:40px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mobile-only{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .units{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.top,.chips,.drawer,.scrim{display:none}.app{display:block}}
</style>
</head>

      <div id="mode"></div>

        <button class="ibtn" id="studentBtn">Student view</button>
        <button class="ibtn" id="settingsBtn">Settings</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>

        <kbd>/</kbd>

      <button class="ibtn" id="viewBtn">List view</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 Education — Functions: Opinions, Agreeing & Disagreeing", "topic": "Opinions, Agreeing & Disagreeing", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to express their opinions about school issues and agree or disagree politely, using: \"In my opinion… / I think… / I agree. / You're right. / I don't agree. / I see your point, but…\"", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “Do you like homework? How much homework do you do every day?”", "Ss. answer freely.", "T. reads / plays the dialogue and sets the gist question: Who is for homework every day? Who is against?", "Ss. listen, read and answer (for: Salma — against: Yassine, Hind)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["T. asks Ss to find the expressions in the dialogue and classify them.", "Ss. complete Task A (opinion / agreeing / disagreeing) individually, then compare in pairs.", "T. checks meaning with CCQs: “I see your point, but…” — Does she agree 100%? (No.) Is it polite? (Yes.)", "T. drills stress and intonation: “I don't think so!”, “Exactly!”, “You're right.” — Ss. repeat chorally and individually."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["T. explains Task B and the expression box.", "Ss. complete the mini-dialogues individually, then check in pairs.", "Ss. read the dialogues aloud in pairs; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models statement 1 of Task C with a strong student.", "Ss. react to each statement in pairs (agree / disagree / give an opinion + a reason) and write their exchange.", "T. monitors; 3–4 pairs act out their exchanges."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. sets the situation: a class council must choose ONE project — a computer room or a school bus.", "Ss. read their role cards (Task D), note ideas (2 min), then role-play and reach a decision.", "2–3 pairs perform; the class votes.", "T. gives delayed feedback on the errors noted (e.g. *I am agree)."]}]}, {"id": "bac-u1-l3", "level": "1st BAC", "unit": 1, "unitName": "Education", "unitDir": "Unit 1 - Education", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 Education — Reading: Why Do Children Leave School?", "topic": "Why Do Children Leave School?", "approach": "PDP", "objective": "By the end of the lesson, students will be able to show understanding of the text \"Why Do Children Leave School?\" by getting the main idea of each paragraph, understanding details and giving their opinion about solutions.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. shows the four pictures and asks: What problem does the text talk about? Why do some children leave school?", "Ss. brainstorm reasons in pairs; T. writes them on the board and pre-teaches poverty, countryside, diploma."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Skimming: Ss. read quickly (2 min) and tick the best title (Task A); T. checks the predictions on the board.", "Scanning: Ss. decide true or false and justify with a quote (Task B); pairs compare", "Main ideas: Ss. write the main idea of paragraphs 2, 3 and 4 and answer the interpretation question (Task C). T. checks."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. discuss in groups: What is the best way to stop school dropout in your region? Each group agrees on two ideas.", "Ss. write their view (Task D); group reporters share; the class votes on the best idea.", "Interaction: Group / Ind. · Material: Worksheet – Task D"]}]}, {"id": "bac-u1-l4", "level": "1st BAC", "unit": 1, "unitName": "Education", "unitDir": "Unit 1 - Education", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 Education — Grammar: The Simple Past", "topic": "The Simple Past", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to talk about school experiences in the past using the simple past tense (regular and irregular verbs, was / were, didn't, Did…?)", "words": [], "point": "• Regular verbs: verb + -ed → walked, loved, studied, stopped. • Irregular verbs: learn them by heart → go → went, have → had, write → wrote.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the pictures (a louh, a village school in the 1960s) and asks: “Where did your grandparents go to school?”", "Ss. read Salma's text about her grandfather and answer: Did Hajj Ahmed go to high school? Why?", "Ss. underline the verbs in the past."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["T. writes two examples on the board: He walked to school. / He went to the msid. — CCQs: Now or in the past? (Past.) Is it finished? (Yes.)", "Ss. complete the table (Task A: regular, irregular, be) guided by line 1.", "T. elicits the rules and completes the Remember box with Ss (-ed; did / didn't + base verb; was / were).", "T. drills the three -ed sounds: /t/ walked, /d/ loved, /ɪd/ started."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in the simple past (Task B) individually.", "Ss. check in pairs; T. corrects on the board and focuses on irregular verbs."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. transform the sentences into the negative and yes / no questions (Task C).", "Ss. ask and answer the questions in pairs with short answers (Yes, he did. / No, they weren't.)."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five sentences about their first year at primary school (Task D).", "In pairs, Ss. read their sentences and ask one follow-up question (Did you…?).", "T. monitors and gives delayed feedback (*didn't went, *Did you went)."]}]}, {"id": "bac-u1-l5", "level": "1st BAC", "unit": 1, "unitName": "Education", "unitDir": "Unit 1 - Education", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 Education — Grammar: Reflexive Pronouns", "topic": "Reflexive Pronouns", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to talk about their school life using reflexive pronouns (myself … themselves; by + myself).", "words": [], "point": "• Use a reflexive pronoun when the subject and the object are the same person: He hurt himself.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the pictures and asks: “Would you like to study at a boarding school? Why / why not?”", "Ss. read Hind's text and answer: How did Hind feel at the end of the week?", "Ss. circle the words ending in -self / -selves."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["T. mimes “I look at myself in the mirror” — CCQs: Who do I look at? (Me.) Same person? (Yes.)", "Ss. complete the table (Task A) and find an example for each pronoun in the text.", "T. elicits the rules (Remember box): subject = object; -self / -selves; by + myself = alone; emphasis.", "T. drills stress: mySELF, ourSELVES, themSELVES."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the correct reflexive pronoun (Task B).", "Pairs check; T. corrects and highlights common errors (*hisself, *theirselves)."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. goes through the example in Task C (Nobody helped me… → I did it by myself.).", "Ss. rewrite the sentences with by + reflexive pronoun and make a simple past question.", "Ss. ask and answer the questions in pairs."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five true sentences about their school life using the prompts (Task D).", "Ss. share in groups of three; each group chooses the most interesting sentence for the class.", "T. gives feedback on pronoun and past-tense errors."]}]}, {"id": "bac-u1-l6", "level": "1st BAC", "unit": 1, "unitName": "Education", "unitDir": "Unit 1 - Education", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 Education — Writing: A Postcard", "topic": "A Postcard", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a postcard from a summer camp, with the correct layout, the simple past and expressing an opinion while respecting mechanics.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. shows the pictures of Ifrane and asks: Do people still send postcards? Who to?", "Ss. read Salma's postcard and answer: Who is she writing to? Where is she?", "Ss. label the parts of the postcard (Task A); T. checks and highlights layout (address on the right)."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put Yassine's postcard in the right order (Task B).", "Ss. rewrite the sentences with capitals and punctuation (Task C); T. corrects on the board."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. sets the situation: you are on a school trip or at a summer camp in a Moroccan city.", "Ss. plan their postcard with the sentence starters (Task D); pairs share their plans and add one idea."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their postcard in the frame (Task E).", "Ss. check their text with the checklist, then swap with a partner for peer checking.", "T. collects the postcards to mark with the marking guide."]}]}, {"id": "bac-u2-l1", "level": "1st BAC", "unit": 2, "unitName": "Society", "unitDir": "Unit 2 - Society", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 - Society — Vocabulary (ECRIF)", "topic": "Society: generations & social problems", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to understand and use vocabulary related to the generation gap and social problems (childhood, adolescence, generation gap, autonomy, tolerance, homeless, jobless) to talk about society in the past and today.", "words": ["autonomy", "homeless", "childhood", "tolerance", "jobless", "generation gap", "adolescence"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. writes “Society: then and now” on the board and asks: “Who lives with their grandparents? What is different between your life and theirs?”", "Ss. share ideas; T. writes key ideas on the board.", "T. shows the three pictures; Ss. describe them.", "Ss. read Salma's text twice and answer: “What worries Salma's grandfather?” (jobless graduates, homeless people)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the seven words with their definitions (Task A), then compare answers with a partner.", "T. checks orally and refers Ss. back to the highlighted words in the text.", "T. checks meaning with CCQs: “Is a homeless person without a job or without a house? (a house)” · “Childhood or adolescence: 15 years old? (adolescence)” · “Autonomy: do you decide or do your parents decide? (I decide)”.", "T. shows the suffix -less in homeless / jobless (= without).", "Pronunciation: stress in adolescence (ooOo), autonomy (oOoo), tolerance (Ooo); choral and individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the seven sentences with words from the box (Task B).", "T. corrects; Ss. read the sentences aloud.", "Ss. cross out the odd word in each line (Task C) and justify orally: “homeless — it isn't a period of life.”"]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models the first sentence about himself: “The best memory of my childhood is …”.", "Ss. complete the five personal sentences (Task D).", "Ss. read their sentences to a partner, who asks one follow-up question.", "T. invites 3–4 Ss. to share and corrects word use."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write 4–5 sentences comparing teenagers' life in their grandparents' time and today, using at least four new words (Production).", "Ss. read their sentences to the class; classmates count the new words used.", "T. gives delayed feedback on the board."]}]}, {"id": "bac-u2-l2", "level": "1st BAC", "unit": 2, "unitName": "Society", "unitDir": "Unit 2 - Society", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 - Society — Functions: complaining (ECRIF)", "topic": "complaining", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to recognise and use expressions for complaining and for responding to a complaint, identify speakers' opinions in a short reading dialogue and transfer information from what they read.", "words": ["complain about", "sorry to hear", "fed up with", "understand how", "not good enough", "sick and tired of", "sounds"], "point": "Complaining: I'm fed up with / sick and tired of + noun / -ing · I'd like to complain about + noun · It's not good enough! · I'm afraid I have to say …", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “What makes people angry in a neighbourhood?”", "Ss. tick three problems they expect to read about (Task A).", "Ss. read the short radio dialogue “Your Voice” silently once, check their predictions and complete the table: caller, city, complaint, opinion (Task B).", "Ss. compare answers with a partner."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. read the dialogue again and write the name of the speaker who has each opinion (Task C).", "T. checks answers and asks: “Which phrases show an opinion?” (In my opinion, I think, I believe …).", "Ss. scan the dialogue and complete the extracts, then mark them C (complaining) or R (responding) (Task D).", "T. builds the board: Complaining / Responding (Remember box).", "Form: fed up with / sick and tired of + noun or -ing; complain about + noun.", "Pronunciation: stress on key words and falling intonation for strong feelings: “I'm SICK and TIRED of it!”; choral and individual drilling; Ss. read the extracts aloud."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the four mini-dialogues with the expressions in the box (Task E).", "T. corrects; Ss. read the dialogues aloud with the right intonation."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1 with a strong student.", "Ss. write a complaint and a response for each situation (Task F), then practise them with a partner.", "2–3 pairs perform; the class says which expressions they used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task G). Ss. prepare for one minute without writing full sentences.", "Ss. role-play the neighbour situation, then swap roles.", "Two pairs perform for the class.", "T. gives delayed feedback on expressions and intonation."]}]}, {"id": "bac-u2-l3", "level": "1st BAC", "unit": 2, "unitName": "Society", "unitDir": "Unit 2 - Society", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 - Society — Reading (PDP)", "topic": "Then and now: a grandfather remembers", "approach": "PDP", "objective": "By the end of the lesson, students will be able to predict the content of a text on social issues and check their predictions, read for specific information and inference, and associate words with ideas in the text.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. asks: “How was life different when your grandparents were young?” and writes Ss.' ideas on the board.", "T. pre-teaches obey, graduate, solidarity and lonely with pictures and mime.", "Ss. look at the title and the pictures and tick the ideas they expect in the text (Task A)."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the text in two minutes and check their predictions in Task A.", "Ss. choose the best title (Task B); T. asks which words helped them.", "Ss. read carefully and decide if the statements are true or false, justifying from the text (Task C).", "T. checks; Ss. read the justification aloud.", "Ss. answer the questions (Task D), including the inference question: “What does he mean by ‘Every generation has its problems’?”", "Ss. find words in the text associated with values of the past, social problems today and modern life (Task E).", "T. collects the words in three columns on the board."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["T. asks: “Do you agree with Hajj Driss? Was life better in the past?”", "Ss. write 3–4 sentences giving their opinion (Task F).", "Ss. compare their opinions with a partner, then 3–4 Ss. share with the class.", "T. links the ideas to the next lessons: used to and writing about past habits."]}]}, {"id": "bac-u2-l4", "level": "1st BAC", "unit": 2, "unitName": "Society", "unitDir": "Unit 2 - Society", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 - Society — Grammar Part 1: used to (ECRIF)", "topic": "used to", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use used to and didn't use to to talk about past habits and states that are no longer true, and ask questions with Did … use to …?", "words": [], "point": "used to + base form = a past habit or state that is not true now: I used to get up at dawn. (now I don't)", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows a picture of himself as a child and says: “I used to play football in the street every day. Now I don't.”", "Ss. look at the two pictures and say what is different.", "Ss. read the dialogue between Salma and Grandma Rkia and answer: “What did Grandma use to do every day?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline used to in the dialogue and complete the table (Task A).", "T. checks and draws a timeline: past ✕✕✕✕ | now ✗.", "CCQs: “Does Grandma fetch water now? (No) Did she do it once or many times? (many times)”.", "T. highlights didn't use to / Did … use to …? and the pronunciation /ˈjuːstə/ (Remember box); choral drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the eight sentences with the correct form of used to and the verb (Task B).", "T. corrects on the board, focusing on use after did / didn't."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. does the example about Mr. Bennani.", "Ss. write then-and-now sentences from the table (Task C).", "Ss. read their sentences aloud; T. corrects."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four true sentences about their childhood with used to / didn't use to (Task D).", "Ss. interview a partner with Did you use to …? questions and report: “Nadia used to …, but she didn't use to …”.", "T. monitors and gives delayed feedback."]}]}, {"id": "bac-u2-l5", "level": "1st BAC", "unit": 2, "unitName": "Society", "unitDir": "Unit 2 - Society", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 - Society — Grammar Part 2: articles (ECRIF)", "topic": "articles", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the articles a, an and the, and no article, correctly when they talk and write about people and places in their community.", "words": [], "point": "a + consonant sound: a bed, a university /j/, a European city · an + vowel sound: an old man, an hour (silent h), an honest girl", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “Have you ever helped people in need? Is there an association in your town?”", "Ss. look at the two pictures and guess the place.", "Ss. read Salma's diary and answer: “Where did Salma and Yassine go? Who did they help?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find examples of each use in the text and complete the table (Task A).", "T. checks answers on the board.", "CCQs: “‘a shelter’ — do we know it already? (No) ‘The shelter’ — which one? (the one in the medina) ‘Homeless people’ — specific or in general? (in general)”.", "T. presents a + consonant sound / an + vowel sound (an hour, a university) and the uses of the and Ø (Remember box)."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with a, an, the or Ø (Task B).", "T. corrects and asks Ss. to justify each answer."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the text about the association in Fes (Task C).", "Ss. explain their choices to a partner: first mention, job, general or specific.", "T. checks with the whole class."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write 5–6 sentences about a person or an association that helps people in their town, and underline the articles (Task D).", "Ss. exchange papers and check the articles; 2–3 Ss. read their sentences aloud.", "T. gives delayed feedback on common errors."]}]}, {"id": "bac-u2-l6", "level": "1st BAC", "unit": 2, "unitName": "Society", "unitDir": "Unit 2 - Society", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 - Society — Writing: past habits (Product approach)", "topic": "past habits", "approach": "Product approach", "objective": "By the end of the lesson, students will be able to write a well-organised paragraph of 100–120 words about past habits, with a topic sentence, supporting ideas, connectors and a concluding sentence.", "words": ["First", "Also", "However", "Finally", "In short"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss. of Hajj Driss's interview and asks: “What did people use to do in the past?”", "Ss. read Salma's model paragraph and say what it is about.", "Ss. write the number of each part in the boxes (topic sentence, supporting idea, concluding sentence) and circle the connectors (Task A).", "T. checks and shows the paragraph plan on the board."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put Karim's paragraph in the right order (Task B) and explain which words helped them.", "Ss. complete the sentences with the connectors in the box (Task C).", "T. corrects and stresses the comma after each connector."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. presents the topic: “How life used to be when my parents or grandparents were young.”", "Ss. brainstorm ideas together; T. writes useful verbs on the board.", "Ss. complete the outline with notes, using the sentence starters (Task D).", "T. monitors and helps Ss. choose three supporting ideas."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their paragraph of 100–120 words with a title (Task E).", "Ss. check their paragraph with the checklist and correct their mistakes.", "T. collects the paragraphs for marking with the marking guide."]}]}, {"id": "bac-u3-l1", "level": "1st BAC", "unit": 3, "unitName": "Health and Welfare", "unitDir": "Unit 3 - Health and Welfare", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Vocabulary: Health, illness & fitness (ECRIF)", "topic": "Health, illness & fitness", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use lexis related to health, diseases, fitness and medicine to describe health problems, treatments and healthy habits.", "words": ["flu", "fever", "cough", "tablets", "diabetes", "headache", "injection", "balanced diet", "asthma", "jogging", "sore throat", "cough syrup", "eight hours of sleep", "a cold", "symptoms", "prescription", "recovered", "keep fit", "junk food", "check-up", "examined", "catch a cold", "take medicine", "go on a diet", "see a doctor", "have a check-up"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “When was the last time you were ill? What did you do?” and elicits a few words (ill, doctor, medicine).", "T. displays the four pictures; Ss. say what they can see.", "Ss. read Yassine’s blog post and answer the gist question: “Why did he go to the health centre?” (he had the flu)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the words with their meanings (Task A), then compare with a partner.", "T. checks and asks CCQs: “Is flu a symptom or an illness?” “Can you buy these tablets without a prescription?”", "Ss. classify the words in the box into the four columns (Task B).", "T. drills the pronunciation and word stress: cough /kɒf/, throat, disease, prescription (oOo), obesity (oOoo)."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words from the text (Task C).", "Ss. check in pairs; volunteers read the sentences aloud and T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. presents the collocations in the box: catch a cold, take medicine, keep fit, go on a diet, see a doctor, have a check-up.", "Ss. complete the sentences about themselves (Task D), then read them to a partner, who asks one follow-up question."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write a short message to a cousin who is often ill, with tips to stay healthy, using at least six words from the lesson (Task E).", "2–3 Ss. read their messages; the class counts the target words used.", "T. gives delayed feedback on collocation errors (e.g. *take a cold → catch a cold)."]}]}, {"id": "bac-u3-l2", "level": "1st BAC", "unit": 3, "unitName": "Health and Welfare", "unitDir": "Unit 3 - Health and Welfare", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Functions: Seeking & giving advice (ECRIF)", "topic": "Seeking & giving advice", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to seek and give advice and talk about health problems in short conversations, and identify a speaker’s attitude and specific information in a listening text.", "words": ["What’s the matter", "a toothache", "sorry", "should", "Why don’t you", "If I were you", "idea"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. mimes a headache and asks: “What’s the matter with me? What should I do?” Ss. suggest ideas.", "T. displays the pictures and asks: “Where is Salma? How does she feel?”", "Ss. listen to Salma and the school nurse and complete the nurse’s card (Task A).", "Ss. listen again and tick the speakers’ attitude (Task B), then justify with the words or tone they heard."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. read the dialogue between Yassine and Imane and answer: “What are Yassine’s problems? What advice does Imane give?”", "Ss. find the expressions and write them in the right column (Task C); T. builds the board: health problems / asking for advice / giving advice / responding.", "CCQs: “‘You’d better see a doctor’ — is it strong or weak advice?” “Does ‘If I were you’ talk about me or you?”", "Form & pronunciation: should + base verb, Why don’t you …?, If I were you, I’d …; silent l in should; stress and sympathetic falling tone (I’m SOrry to HEAR that). Choral and individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the expressions in the box (Task D).", "Ss. check in pairs, then open pairs read the dialogue aloud; T. re-drills difficult lines."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1 with a strong student.", "Ss. write and practise a short exchange for each situation (Task E): ask about the problem, then give advice. They swap roles.", "2–3 pairs perform; the class says which expression they used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task F). Ss. role-play a friend with a health problem and a friend who gives at least three pieces of advice, without looking at the dialogue.", "Ss. swap roles and choose a new problem.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u3-l3", "level": "1st BAC", "unit": 3, "unitName": "Health and Welfare", "unitDir": "Unit 3 - Health and Welfare", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Reading: Healthy teens, happy teens (PDP)", "topic": "Healthy teens, happy teens", "approach": "PDP", "objective": "By the end of the lesson, students will be able to use reading strategies (predicting, skimming, scanning and guessing from context) to understand a text about teenage health, take notes and summarise it.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “How many hours do you sleep? What do you eat for breakfast?” and writes key words on the board.", "T. pre-teaches concentrate, tooth decay and anxious with examples and mime.", "Ss. look at the title and the four pictures and predict what the text is about (Task A — tick one option). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. read the text quickly to check their predictions (Task A).", "Ss. skim the first lines of each paragraph and tick the main idea of the text (Task B).", "Ss. scan the text and decide if the statements are true or false, justifying with words from the text (Task C). Pair check; feedback with the paragraph numbers.", "Ss. guess the meaning of the words and the expression from context (Task D). T. asks: “Which words around it helped you?”", "T. shows how to take notes (key words, no full sentences).", "Ss. take notes on the doctor’s advice for each key (Task E), then compare with a partner."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. use their notes to write a 4–5 sentence summary of the text (Task F), starting with the given sentence.", "Ss. exchange summaries and check that the four keys are there; 2–3 Ss. read theirs to the class.", "T. links to the Writing lesson: “What problem would you write to Dr. Idrissi about?”"]}]}, {"id": "bac-u3-l4", "level": "1st BAC", "unit": 3, "unitName": "Health and Welfare", "unitDir": "Unit 3 - Health and Welfare", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Grammar Part 1: Modals (ECRIF)", "topic": "Modals", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the modals should / shouldn’t, must / have to, mustn’t / don’t have to and may / might / could to express advice, obligation, prohibition and possibility about health.", "words": ["advice", "obligation", "no obligation", "prohibition", "possibility"], "point": "Modal + base verb: You should rest. ✓ You should to rest ✗ · She musts ✗ → She must / She has to · Questions: Should I …? / Do I have to …?", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. displays the two pictures and asks: “What happened to Hamza? Where is he now?”", "Ss. read the dialogue and answer: “What’s wrong with Hamza? Can he play in the final?”", "T. checks the answers and writes four sentences from the dialogue on the board."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the modals in the dialogue and complete the table with the function and an example (Task A); pair check.", "T. elicits the rules from the Remember box: modal + base verb, questions with Should I …? / Do I have to …?", "CCQs: “‘You mustn’t walk’ — can he walk?” “‘You don’t have to stay’ — is it necessary?” “‘It might be a sprain’ — is the doctor sure?” Pronunciation: mustn’t, have to."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct modal in each sentence (Task B).", "Ss. compare in pairs; T. corrects on the board and asks Ss. to say why (advice, obligation, prohibition or possibility)."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1: “Omar should see a dentist.”", "Ss. write a sentence for each situation with the modal given (Task C), then read them to a partner, who checks the meaning.", "Volunteers write their sentences on the board for class correction."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write six rules and tips for a “healthy school charter” with must / have to, mustn’t, don’t have to, should / shouldn’t and one sentence with might (Task D).", "Ss. compare charters with a partner and choose the three best rules for a class poster.", "T. gives delayed feedback on common errors (*should to, *musts, mustn’t vs don’t have to)."]}]}, {"id": "bac-u3-l5", "level": "1st BAC", "unit": 3, "unitName": "Health and Welfare", "unitDir": "Unit 3 - Health and Welfare", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Grammar Part 2: The present perfect (ECRIF)", "topic": "The present perfect", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the present perfect with for, since, ever, never, just, already and yet to talk about recent changes and experiences related to health.", "words": ["for", "since", "ever", "never", "already", "yet"], "point": "have / has + past participle (regular: stop → stopped; irregular: go → gone, eat → eaten, lose → lost, feel → felt, have → had)", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. reminds Ss of Yassine’s problem (Reading / Functions lessons): “Remember Yassine? He was always tired. What should he do?”", "Ss. read Yassine’s message to Imane and answer: “What has he changed?”", "T. checks and writes three sentences on the board: I’ve joined the team. I haven’t eaten crisps for a month. Have you ever tried yoga?"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the present perfect in the message and complete the form table (Task A).", "T. elicits the form: have / has + past participle; short answers; regular and irregular participles (gone, eaten, lost, felt).", "Ss. find the time words in the message and complete their meaning (Task A — time words).", "CCQs: “‘I’ve joined the team’ — is he in the team now?” “‘for six weeks’ — when did he start?” Pronunciation: weak forms I’ve, has, Have you ever …?"]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in brackets in the present perfect (Task B), paying attention to the position of never, just and already.", "Pair check; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the sentences with for, since, ever, never, already or yet (Task C).", "T. draws a timeline for for / since; Ss. justify their answers.", "Ss. write two true sentences about themselves with for and since and read them to a partner."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write a short message to a friend about what they have / haven’t done this year to stay healthy, with one Have you ever …? question (Task D).", "Ss. exchange messages and answer their partner’s question in writing.", "T. gives delayed feedback on errors (*I have stop, *since two months, present perfect with yesterday)."]}]}, {"id": "bac-u3-l6", "level": "1st BAC", "unit": 3, "unitName": "Health and Welfare", "unitDir": "Unit 3 - Health and Welfare", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 3 — Writing: A letter asking for advice (Product)", "topic": "A letter asking for advice", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a letter asking for advice about a health problem, using the layout of a letter, connectors and expressions for describing a problem and asking for advice.", "words": ["writing", "worries", "should", "tell", "grateful", "hearing"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Dr. Idrissi’s article (Reading lesson): “Who is Dr. Idrissi? Why do students write to her?”", "Ss. read Yassine’s letter and answer: “What is his problem? What does he ask?”", "Ss. number the eight parts of the letter (Task A); T. checks and highlights the fixed phrases: Dear Dr. …, I am writing to ask for your advice …, What do you think I should do?, I look forward to hearing from you., Yours sincerely,"]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. complete the useful expressions with the words in the box (Task B); pair check.", "Ss. join the sentences with because, so, but and also (Task C). T. elicits the punctuation rules (comma before so and but)."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. choose a health problem from the box and plan their letter in the outline (Task D): introduction, the problem, what I have tried, asking for advice, closing — notes only.", "Ss. turn their notes into sentences with the sentence starters, then compare with a partner. T. monitors and helps with the present perfect and should."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their full letter to Dr. Idrissi (100–120 words) in the letter frame (Task E).", "Ss. check their letter with the self-assessment checklist and correct it. T. collects the letters for written feedback."]}]}, {"id": "bac-u4-l1", "level": "1st BAC", "unit": 4, "unitName": "Environment and Ecology", "unitDir": "Unit 4 - Environment and Ecology", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Vocabulary: Waste, energy, pollution & recycling (ECRIF)", "topic": "Waste, energy, pollution & recycling", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use vocabulary related to waste, energy, pollution and recycling to describe environmental problems and solutions in their town.", "words": ["environment", "recycling bins", "pollution", "solar", "wind farm", "waste", "litter", "smoke", "reuse", "wind", "landfill", "exhaust fumes", "bottle bank", "rubbish", "fossil fuels", "oil spill", "compost"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the four pictures and asks: “What can you see? Which pictures show a problem? Which show a solution?”", "Ss. answer with the words they know; T. writes them on the board.", "Ss. read Salma's post and answer the gist question: “What are the two problems in Agadir? What does the Green Club do?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the six words with their meanings (Task A), then compare with a partner.", "T. checks and builds a word map on the board: Waste / Energy / Pollution / Recycling.", "CCQs: “Is a plastic bottle on the beach litter? (Yes) Can we use the sun again tomorrow? (Yes — it is renewable) Is oil renewable? (No — a fossil fuel)”.", "Pronunciation: stress in pollute / pollution, recycle, environment; waste = waist; choral then individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B).", "Ss. check in pairs; volunteers read the sentences aloud; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. classify the twelve words in the table (Task C) and justify one choice to a partner.", "Ss. complete the word-building table and the three sentences (Task D).", "T. highlights the suffixes -tion, -able, -ful and checks with a dictionary."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four sentences about environmental problems in their town and what people can do (Task E), using at least four new words.", "Ss. read their sentences to a partner, who suggests one more solution.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u4-l2", "level": "1st BAC", "unit": 4, "unitName": "Environment and Ecology", "unitDir": "Unit 4 - Environment and Ecology", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Functions: Making & responding to suggestions (ECRIF)", "topic": "Making & responding to suggestions", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to make suggestions and accept or refuse them politely when planning actions to protect the environment.", "words": ["Let's", "How about", "Why don't", "I'm afraid", "great idea", "suggest"], "point": "Let's + base verb · Why don't we / you + base verb? · Shall we + base verb? · We could + base verb", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures; Ss. answer the questions and predict the topic of the interview (Task A).", "Ss. listen to the radio interview and tick the main topic (Task B).", "Ss. listen again and complete the fact file (Task C); pair check."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. listen a third time and say who uses each expression (Task D).", "Ss. read the tapescript and classify the expressions: making / accepting / refusing (Task E). T. builds the board.", "T. focuses on form with the Remember box: Let's / Why don't we / Shall we + base verb; How about / I suggest + -ing.", "CCQs: “Is ‘I'm afraid I can't’ a yes or a no? (No — polite) After ‘How about’, do we say ‘to bring’ or ‘bringing’? (bringing)”.", "Pronunciation: stress on the key word and friendly intonation; choral then individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the dialogue between Hiba and Ilyas with the expressions in the box (Task F).", "Ss. check in pairs; two pairs read the dialogue aloud; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models problem 1 with a strong student.", "Ss. write a suggestion for each problem and their partner's answer, using a different expression each time (Task G), then swap roles.", "2–3 pairs perform; the class says which expressions they used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task H). Ss. role-play planning World Environment Day without looking at the dialogue and agree on a plan.", "Pairs present their plan to the class; the class votes for the best idea.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u4-l3", "level": "1st BAC", "unit": 4, "unitName": "Environment and Ecology", "unitDir": "Unit 4 - Environment and Ecology", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Reading: Can we still save our coast? (PDP)", "topic": "Can we still save our coast?", "approach": "PDP", "objective": "By the end of the lesson, students will be able to identify the main idea of each paragraph and specific details in an article about environmental problems, and suggest solutions to a local problem.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “What did you see on the beach last summer? Is our town clean?”", "T. pre-teaches drought, ban, tiny, rare with the pictures and examples.", "Ss. look at the title and the four pictures and predict what the text is about (Task A — tick one option). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the article in two minutes to check their predictions (Task A), then match each paragraph with its main idea (Task B). Pair check; feedback with the key words.", "Ss. scan the text to decide if the statements are true or false and correct the false ones (Task C). Volunteers read the lines that justify their answers.", "Ss. find what the underlined words refer to and the words with the given meanings (Task D). T. shows how the context helps.", "Ss. complete the problem–solution table with information from the text (Task E); T. builds the table on the board."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. choose a problem in their town, describe it and suggest two solutions (Task F).", "In groups, Ss. compare their solutions and choose the best one; one S. per group reports to the class."]}]}, {"id": "bac-u4-l4", "level": "1st BAC", "unit": 4, "unitName": "Environment and Ecology", "unitDir": "Unit 4 - Environment and Ecology", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Grammar Part 1: Too & enough (ECRIF)", "topic": "Too & enough", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use too, too much / too many and (not) enough correctly to describe environmental problems in their school and town.", "words": ["too", "too much", "too many", "enough"], "point": "too goes before the adjective: too hot · enough goes after the adjective but before the noun: warm enough / enough water", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “Can you swim in this river? Why not? Is there space for more rubbish in the bin?”", "Ss. answer freely; T. recasts: “It's too dirty to swim in.”", "Ss. read the dialogue and answer the gist question: “What problems did the Green Club find?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. look at the highlighted phrases and complete the table with examples from the dialogue (Task A); pair check.", "T. builds the rules on the board.", "CCQs: “The water is too cold. Can we swim? (No) Is ‘too’ the same as ‘very’? (No — too has a negative result) Before or after the adjective does ‘enough’ go? (after) And with a noun? (before)”.", "T. uses the Remember box; pronunciation: weak form /tə/ in “too dirty to swim”."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with too, too much, too many or enough (Task B).", "Ss. check in pairs; T. corrects on the board and asks Ss to justify each choice."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models the example on the board.", "Ss. join the sentences with too … to or (not) … enough to (Task C), then compare with a partner.", "Volunteers write their sentences on the board; the class corrects them."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write four sentences about real problems in their school or town with too, too much / many and (not) enough (Task D).", "In groups, Ss. compare their sentences and choose the biggest problem; one S. reports it to the class.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u4-l5", "level": "1st BAC", "unit": 4, "unitName": "Environment and Ecology", "unitDir": "Unit 4 - Environment and Ecology", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Grammar Part 2: Prepositions after adjectives & verbs (ECRIF)", "topic": "Prepositions after adjectives & verbs", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the correct prepositions after common adjectives and verbs to talk about environmental problems and their own actions.", "words": ["about", "of", "in", "for", "from", "on", "to"], "point": "Some adjectives and verbs always take the same preposition — learn them together: afraid of · proud of · famous for · rich in · harmful to · think about · care about · result in", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “What are the students doing? Why is the field dry?”", "Ss. read Khadija's club report and answer the gist question: “What did the students do last month?” (They took part in a tree-planting day.)"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the highlighted phrases and classify them: adjective + preposition / verb + preposition / verb + object + preposition (Task A); pair check. T. builds the table on the board.", "CCQs: “Can we say ‘interested by’? (No — interested in) What comes after a preposition: recycle or recycling? (recycling)”.", "T. presents the extra phrases in the Remember box; pronunciation: weak forms /əv/, /tə/, /fə/ in connected speech."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the right preposition (Task B).", "Ss. check in pairs; T. corrects on the board and Ss. repeat the full phrases."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the four questions with a preposition (Task C).", "Ss. interview a partner and note the answers, then report one answer to the class: “Salma is worried about …”."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write a short paragraph about themselves and the environment using at least five phrases (Task D).", "Ss. read their paragraphs in groups; the group chooses the most interesting one.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u4-l6", "level": "1st BAC", "unit": 4, "unitName": "Environment and Ecology", "unitDir": "Unit 4 - Environment and Ecology", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 4 — Writing: An opinion paragraph (Product)", "topic": "An opinion paragraph", "approach": "Product", "objective": "By the end of the lesson, students will be able to write an opinion paragraph that describes an environmental problem in their town, gives reasons and examples, and suggests a solution.", "words": ["Firstly", "Secondly", "For example", "because", "Moreover", "In conclusion"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Anas's article (Reading lesson): “What can each of us do for the environment?”", "Ss. read Anas's paragraph and answer: “What is his opinion? Give one of his examples.”", "Ss. label the five parts of the paragraph (Task A); T. checks and highlights the opinion phrases and connectors: In my opinion, Firstly, Secondly, Moreover, In conclusion."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. complete the paragraph about a car-free medina with the connectors in the box (Task B); pair check.", "Ss. rewrite the sentences with capital letters, commas, full stops and apostrophes (Task C). T. stresses the comma after connectors."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. brainstorm environmental problems in their town in pairs; T. collects ideas on the board (litter, polluted river, traffic, wasting water …).", "Ss. choose one problem and plan their paragraph in the outline (Task D): topic sentence · two reasons / effects · solution · conclusion — notes only.", "Ss. turn the notes into sentences with the sentence starters, then compare with a partner. T. monitors and helps."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their opinion paragraph (100–120 words) in the frame (Task E).", "Ss. check their paragraph with the self-assessment checklist and correct it. T. collects the paragraphs for written feedback."]}]}, {"id": "bac-u5-l1", "level": "1st BAC", "unit": 5, "unitName": "Entertainment", "unitDir": "Unit 5 - Entertainment", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Vocabulary: Free time & entertainment (ECRIF)", "topic": "Free time & entertainment", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words related to leisure and recreational activities to talk about their free time, and guess the meaning of unfamiliar words from context and word parts.", "words": ["spare time", "took up", "gripping", "audience", "hang out", "enjoyable"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “What did you do last weekend? Is free time important for you?” and writes Ss' activities on the board.", "T. displays the four pictures; Ss. name the activities.", "Ss. read Yassir's blog post and answer the gist question: “What does Yassir do in his free time?” (hiking, chess, board games, cinema)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the highlighted words with their meanings (Task A), then compare with a partner.", "T. checks and drills the words for stress: PAStime, AUdience, enterTAINment, LEIsure.", "T. presents the strategy box: context, word parts, part of speech, dictionary last.", "Ss. guess the meaning of the words in bold and write the clue (Task B); T. elicits the clues.", "T. asks CCQs: “Is a couch potato active? (No) If you take up a hobby, is it new or old? (new)”."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the word family table (Task C) and check spelling with the dictionary.", "T. corrects on the board and highlights the suffixes -ment, -ion, -ing, -able."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the sentences with the words in the box (Task D), changing the form where needed (hang out → hung out).", "Ss. check in pairs; T. elicits answers and gives feedback."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five sentences about their own free time using at least five new words (Task E).", "Ss. read their sentences to a partner and find one activity they both enjoy; 2–3 Ss. report to the class.", "T. monitors and gives delayed feedback on word form and stress."]}]}, {"id": "bac-u5-l2", "level": "1st BAC", "unit": 5, "unitName": "Entertainment", "unitDir": "Unit 5 - Entertainment", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Functions: Expressing interest & indifference (ECRIF)", "topic": "Expressing interest & indifference", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to express interest, indifference and lack of interest in leisure activities, and react to other people's preferences with appropriate intonation.", "words": ["crazy about", "not bothered", "doesn't interest me", "fascinated by", "I don't mind", "can't stand"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “Who is Anas? What is a school radio?”", "Ss. predict the four activities Anas talks about (Task A).", "Ss. listen to the interview and check their predictions (Task A).", "Ss. listen again and choose the main idea (Task B); T. elicits the answer."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. listen for the last time and write the expressions in the right column (Task C), then compare with a partner.", "T. builds the board: Strong interest / Indifference / No interest, with the prepositions keen on, crazy about, fascinated by, interested in.", "T. asks CCQs: “Does Anas want to play football? (not really) Is ‘I don't mind’ positive or neutral? (neutral)”.", "T. models lively falling intonation for interest and a flat tone for indifference (Say it right box); choral then individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-exchanges with the expressions in the box (Task D).", "Ss. check in pairs, then open pairs read the exchanges aloud with the right intonation."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models one line: “Going to the theatre? I'm really keen on it because …”.", "Ss. write a reaction and a reason for each activity (Task E), then compare with a partner: “Me too!” / “Really? I …”.", "Ss. report one difference with their partner (2–3 Ss.)."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out the role cards (Task F). Ss. role-play the radio interview without looking at the dialogue, then swap roles.", "Ss. perform the radio show (2 pairs); the class says which activity each guest loves and which one he / she doesn't care about.", "T. gives delayed feedback on the board."]}]}, {"id": "bac-u5-l3", "level": "1st BAC", "unit": 5, "unitName": "Entertainment", "unitDir": "Unit 5 - Entertainment", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Reading: The Ciné-Club (PDP)", "topic": "The Ciné-Club", "approach": "PDP", "objective": "By the end of the lesson, students will be able to survey a magazine article to predict its type and content, skim it for the main idea and scan it for specific details about a school film club.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. asks “Do you watch films at school? Would you like a film club?”", "T. pre-teaches screening, projector, sandstorm and membership with the pictures and mime.", "T. explains surveying: title, subtitle, headings, source and pictures.", "Ss. survey the text for one minute and tick what kind of text it is (Task A); T. writes the predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the text in two minutes, reading only the first lines of each paragraph, and tick the main idea (Task B).", "T. checks the predictions from Task A: “Which clues helped you?”", "T. explains scanning: look only for names, numbers and dates.", "Ss. scan the text and answer the detail questions (Task C) against the clock; volunteers write the answers on the board.", "Ss. read carefully and decide if the statements are true or false, justifying with words from the text (Task D).", "Ss. check in pairs; T. gives feedback with the paragraph headings."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. discuss in pairs: “Would you join the Ciné-Club? Which film would you show?” (Task E)", "Ss. write three sentences with their opinion (Task E); 2–3 Ss. read them to the class.", "T. announces the next lessons: the club's film, The Last Caravan, will be the model for the film review."]}]}, {"id": "bac-u5-l4", "level": "1st BAC", "unit": 5, "unitName": "Entertainment", "unitDir": "Unit 5 - Entertainment", "no": 4, "dir": "4 Grammar", "skill": "Grammar", "part": "", "label": "Grammar", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Grammar: Past continuous & simple past (ECRIF)", "topic": "Past continuous & simple past", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to form the past continuous and use it with the simple past, when and while, to describe actions in progress and interrupted actions in the past.", "words": [], "point": "① An action in progress at a time in the past: At 4:45, we were watching a film.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “What were you doing yesterday at 8 p.m.?” and accepts any answer.", "T. shows the pictures: “Where are they? What happened?”", "Ss. read Imane's story and answer: “What happened at 4:45? What was Yassir doing when the power came back?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline was / were + verb-ing in the story and complete the table (Task A); T. checks on the board.", "T. highlights spelling: sit → sitting, dance → dancing.", "T. draws a timeline for “The guide was crossing the desert when the lights went out.”", "T. asks CCQs: “Was the action finished? (no) Which action is short? (went out) Do we use while or when with the short action? (when)”.", "Ss. read the Remember box; T. drills weak forms /wəz/, /wə/."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in the past continuous (Task B), then choose the past continuous or the simple past (Task C).", "Ss. check in pairs; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models sentence 1 with when.", "Ss. join the ideas with when or while (Task D), then read their sentences to a partner.", "T. elicits answers and both word orders: “While …, …” / “… when …”."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write a short story about a funny or surprising moment during a leisure activity using while and when (Task E).", "Ss. tell their story to a partner, who asks the useful questions; 2–3 Ss. tell the class.", "T. notes errors and gives delayed feedback."]}]}, {"id": "bac-u5-l5", "level": "1st BAC", "unit": 5, "unitName": "Entertainment", "unitDir": "Unit 5 - Entertainment", "no": 5, "dir": "5 Writing - Part 1", "skill": "Writing", "part": "Part 1", "label": "Writing - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Writing Part 1: A film review (Process)", "topic": "A film review", "approach": "Process", "objective": "By the end of the lesson, students will be able to analyse the structure and language of a film review and plan their own review of a film they have watched.", "words": ["It stars …", "It is set in …", "The film tells the story of …", "What I liked most was …", "However, …", "I highly recommend it to …", "It is directed by …", "The plot is a bit predictable.", "Don't miss it!", "The acting is superb."], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-writing", "min": 55, "max": 55, "steps": ["T. asks “What was the last film you watched? Would you recommend it?” and recalls the Ciné-Club film The Last Caravan (Reading lesson).", "Ss. read Salma's review and answer: “Did Salma like the film? How many stars did she give?”", "Ss. number the five parts of the review (Task A); T. checks and labels the parts on the board.", "Ss. find the tense, the opinion adjectives, the contrast linker and the recommendation expressions (Task B).", "T. elicits: present simple for the plot, no spoilers, a strength and a weakness with However.", "Ss. sort the expressions into the four columns (Task C); pair check, then whole-class correct
