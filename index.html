ion.", "Ss. choose a film and brainstorm notes in the grid with the help of the word bank (Task D).", "T. monitors and helps with genres and adjectives.", "Ss. turn their notes into an outline with the sentence starters (Task E) and write the first sentence of each part.", "T. reminds Ss to keep the page for Part 2 (drafting)."]}]}, {"id": "bac-u5-l6", "level": "1st BAC", "unit": 5, "unitName": "Entertainment", "unitDir": "Unit 5 - Entertainment", "no": 6, "dir": "6 Writing - Part 2", "skill": "Writing", "part": "Part 2", "label": "Writing - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 5 — Writing Part 2: A film review (Process)", "topic": "A film review", "approach": "Process", "objective": "By the end of the lesson, students will be able to write, revise and edit a film review, then produce a final copy using peer feedback.", "words": [], "point": "① Title + year + stars · ② basic information (genre, director, actors, setting) · ③ plot in the present simple — no ending! · ④ opinion: what you liked + However, a weak point · ⑤ recommendation: I highly recommend it to …", "minutes": [55, 55], "stages": [{"mark": "2", "name": "Drafting", "min": 18, "max": 18, "steps": ["T. recalls the five parts of a review with the Remember box; Ss. take out their outline from Part 1 (Task E).", "Ss. write their first draft (Task A), skipping a line for corrections.", "T. monitors and helps with the plot summary in the present simple."]}, {"mark": "3", "name": "Responding / Peer Feedback", "min": 10, "max": 10, "steps": ["Ss. swap drafts and tick the checklist (Task B), then write one compliment and one suggestion."]}, {"mark": "4", "name": "Revising", "min": 8, "max": 8, "steps": ["Ss. read their partner's feedback and improve the content and organisation of their draft: add missing parts, reasons and linkers."]}, {"mark": "5", "name": "Editing", "min": 9, "max": 9, "steps": ["T. presents the correction code (T, P, Sp, WO, C).", "Ss. correct the five sentences (Task C); T. checks on the board.", "Ss. use the code to check their own draft for tense, prepositions, capitals and spelling."]}, {"mark": "6", "name": "Final Draft", "min": 10, "max": 10, "steps": ["Ss. write the final copy of their review (Task D).", "T. collects the reviews; the best ones go on the Ciné-Club page of the school magazine."]}]}, {"id": "bac-u6-l1", "level": "1st BAC", "unit": 6, "unitName": "Mass Media", "unitDir": "Unit 6 - Mass Media", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Vocabulary: Media words (ECRIF)", "topic": "Media words", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words related to the mass media (TV, radio, the press and the Internet) and their word families to talk about their own media habits.", "words": ["subscribe", "viewers", "live", "download", "reporter", "remote control"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “How did you get the news yesterday?” and writes the answers on the board (TV, radio, phone, newspaper).", "Ss. look at the three pictures and say which media they show.", "Ss. read Salma's text and answer: “Which media does each person use?” (dad: newspaper · mum: radio · Salma: the Internet · Hamza: TV · grandfather: documentaries)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the six words with their meanings (Task A), then compare with a partner.", "T. checks and drills the word stress: ˈheadline, ˈchannel, ˈeditor, ˈbroadcast, ˈdocumentary.", "Ss. classify the bold words from the text under TV & radio / Newspapers & magazines / Computers & the Internet (Task B).", "CCQs: “Does a viewer read or watch?” (watch) “Is a headline long or short?” (short)", "T. highlights collocations on the board: switch on the TV, surf the Net, post a comment, change the channel."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the six sentences with the words in the box (Task C).", "Ss. check in pairs; volunteers read the sentences aloud.", "T. corrects on the board and re-drills difficult words (remote control, subscribe)."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the word-building table: verb / thing / person (Task D), using a dictionary when needed.", "T. elicits the suffixes -er / -or / -ment / -ation.", "Ss. complete the sentences with the right form of the word in brackets (Task E).", "T. checks and asks Ss to justify the form (noun / verb / plural)."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five sentences about how they and their family use the media, with at least six new words (Task F).", "Ss. read their sentences to a partner, who counts the new words.", "2–3 Ss. read to the class. T. gives delayed feedback on errors."]}]}, {"id": "bac-u6-l2", "level": "1st BAC", "unit": 6, "unitName": "Mass Media", "unitDir": "Unit 6 - Mass Media", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Functions: Talking about emotions and feelings (ECRIF)", "topic": "Talking about emotions and feelings", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to ask about and express emotions, feelings and attitudes when reacting to news, after listening to a radio news bulletin for specific information.", "words": ["How do you feel", "I'm thrilled", "I'm worried", "I can't stand", "makes me sad", "not really bothered"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “Do you listen to the radio? What kind of news makes you happy or sad?”", "Ss. listen to the Radio Our Voice news bulletin and tick the three stories they hear (Task A).", "Ss. listen again and complete the notes with specific information: ages, places, days, numbers (Task B). T. checks with the class."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. read and listen to the dialogue and say how Salma and Yassine feel about each story.", "Ss. find the underlined expressions and write them in the right column (Task C).", "T. builds the board: Asking about feelings / Positive feelings / Negative feelings & attitudes.", "CCQs: “Is ‘I'm not really bothered’ positive or negative?” (neither – indifference) “When do we say ‘What a relief!’?” (after a worry ends)", "Pronunciation: Ss. classify -ed adjectives by sound /t/ /d/ /ɪd/ (Task D); T. drills them with a wide falling intonation for strong feelings."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the five mini-dialogues with the expressions in the box (Task E).", "Ss. check in pairs, then open pairs act them out.", "T. corrects and re-drills intonation."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models headline 1 with a strong student.", "Ss. write a two-line exchange reacting to each headline, using a different expression each time (Task F).", "3–4 pairs perform; the class names the feeling expressed."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out the news cards and role cards A and B (Task G). Ss. role-play: A reads the news, B reacts and explains how he / she feels; they swap roles with a new card.", "2–3 pairs perform for the class. T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u6-l3", "level": "1st BAC", "unit": 6, "unitName": "Mass Media", "unitDir": "Unit 6 - Mass Media", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Reading: Screens, Papers and Teenagers (PDP)", "topic": "Screens, Papers and Teenagers", "approach": "PDP", "objective": "By the end of the lesson, students will be able to check their predictions, skim a text on teenagers and the mass media for the main ideas and scan it for specific information.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks: “Where did you get the news yesterday?” and tallies the answers on the board.", "T. pre-teaches survey, source, reliable, adviser, consume, share with examples.", "Ss. look at the title and the three pictures and tick the two ideas they expect in the text (Task A). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. read the text quickly (2 min) to check their predictions (Task A). T. asks: “Were you right? Which words helped you?”", "Ss. skim the first lines of each paragraph and match paragraphs 1–4 with their main ideas; one idea is extra (Task B). Pair check.", "Ss. scan the text and decide if the statements are true or false, justifying with words from the text (Task C). Feedback with paragraph numbers.", "Ss. scan for numbers to answer the questions (Task D). Volunteers write the answers on the board.", "Ss. find what the underlined words refer to (Task E). T. shows how to look back in the sentence before."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. write 3–4 sentences about how they get the news and whether they check it before sharing (Task F).", "Ss. compare with a partner; T. collects answers on the board and links to the Writing lesson (an e-mail about media habits)."]}]}, {"id": "bac-u6-l4", "level": "1st BAC", "unit": 6, "unitName": "Mass Media", "unitDir": "Unit 6 - Mass Media", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Grammar Part 1: The passive, present & past simple (ECRIF)", "topic": "The passive, present & past simple", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to form and use the passive voice in the present simple and past simple to describe how things are made and when they were created.", "words": [], "point": "Active: Mr. Tazi checks the articles. → Passive: The articles are checked (by Mr. Tazi).", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. holds up a newspaper / shows the two pictures and asks: “Who writes a school magazine? Where is it printed?”", "Ss. read “How is Our Voice made?” and answer: “Who checks the articles? When was the magazine created?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. look at the underlined verbs and complete the form table: affirmative, form, negative, question (Task A).", "T. elicits the rule: be (am / is / are – was / were) + past participle.", "T. writes an active sentence and transforms it on the board: Mr. Tazi checks the articles → The articles are checked by Mr. Tazi.", "CCQs: “Do the articles check? Who checks?” “Is ‘was printed’ past or present?”", "Ss. read the Remember box; T. explains when we use “by + agent”."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the seven sentences with the present or past simple passive (Task B).", "Pair check, then feedback; T. focuses on irregular past participles (read, sold, taken)."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. rewrite the active sentences in the passive (Task C), using “by” only when the agent is important.", "Volunteers write their answers on the board; the class corrects."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["In pairs, Ss. write four quiz questions about the media or famous inventions in the passive (Task D).", "Pairs exchange questions with another pair and answer them.", "T. monitors and gives delayed feedback on errors."]}]}, {"id": "bac-u6-l5", "level": "1st BAC", "unit": 6, "unitName": "Mass Media", "unitDir": "Unit 6 - Mass Media", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Grammar Part 2: The passive, other tenses & modals (ECRIF)", "topic": "The passive, other tenses & modals", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to form and use the passive voice with the present continuous, the present perfect, future forms and modals to give news and state rules.", "words": [], "point": "In every passive tense, be changes and the past participle stays: is being made · has been made · will be made · is going to be made · can be made.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. reviews Part 1: “When was our school magazine created? Where is it printed?”", "T. shows the pictures of the school radio studio.", "Ss. read Yassine's announcement and answer: “When will the first show be broadcast? How can songs be requested?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find an example in the text for each passive form and complete the table (Task A).", "T. elicits the pattern: the form of “be” changes, the past participle stays.", "CCQs: “The studio is being painted. Is it finished?” (No) “A microphone has been bought. Do we have it now?” (Yes)", "T. shows question and negative forms on the board; Ss. read the Remember box."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct passive form in six sentences (Task B).", "Pair check, then whole-class feedback."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. rewrite five active sentences in the passive, keeping the same tense or modal (Task C).", "Ss. compare; volunteers write their answers on the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write two rules for the media room with modals and two pieces of news about their school with the present perfect or will (Task D).", "Ss. read their rules and news to a partner, then to the class. T. gives delayed feedback."]}]}, {"id": "bac-u6-l6", "level": "1st BAC", "unit": 6, "unitName": "Mass Media", "unitDir": "Unit 6 - Mass Media", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 6 — Writing: An e-mail to an e-pal (Product)", "topic": "An e-mail to an e-pal", "approach": "Product", "objective": "By the end of the lesson, students will be able to write an informal e-mail to an e-pal about their media habits and school news, using e-mail layout, linking words and media vocabulary.", "words": ["so", "because", "However", "also", "but"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Salma's article (Reading lesson) and asks: “Who is Emily? What did she ask Salma?”", "Ss. read Salma's e-mail and answer: “How do her parents get the news? What is her news?”", "Ss. number the seven parts of the e-mail (Task A); T. checks and highlights fixed phrases: Thanks for your e-mail. · Write back soon. · Best wishes,"]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. complete the sentences with the right linking word (Task B); T. explains the punctuation with However and so.", "Ss. rewrite the e-mail phrases with capital letters, commas, apostrophes and question marks (Task C). Pair check."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. plan their reply to Emily in the outline (Task D): opening, media habits, favourite programme, news, closing — notes only.", "Ss. turn their notes into sentences with the sentence starters, then compare with a partner. T. monitors and helps."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their e-mail to Emily (100–120 words) in the e-mail frame (Task E).", "Ss. check their e-mail with the checklist and correct it. T. collects the e-mails for written feedback."]}]}, {"id": "bac-u7-l1", "level": "1st BAC", "unit": 7, "unitName": "Celebrations", "unitDir": "Unit 7 - Celebrations", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Vocabulary: Celebrations, customs & traditions (ECRIF)", "topic": "Celebrations, customs & traditions", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use vocabulary related to celebrations, customs, traditions and occasions to describe how their families celebrate special events.", "words": ["celebrate", "decorate", "fireworks", "henna", "ceremony", "gifts", "Eid al-Fitr", "Throne Day", "a wedding", "the Rose Festival", "Eid al-Mawlid", "Independence Day", "a birthday", "the Gnaoua Festival", "Ashura", "the Green March Day", "a graduation party", "the Imilchil Moussem"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. writes “Celebrations” on the board and asks: “What occasions do Moroccans celebrate? What do you do on Eid?”", "Ss. brainstorm the occasions they know; T. writes them on the board.", "T. displays the four pictures; Ss. name the occasions.", "Ss. read Imane's text and answer the gist question: “What is Imane's favourite occasion?” (a wedding)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the words with their meanings (Task A), then compare with a partner.", "T. checks and clarifies meaning with the pictures, examples and CCQs: “Is a guest always a member of the family? (No) Is a feast only food? (No — also a religious celebration)”.", "T. drills the pronunciation and word stress of the new words: ceremony, occasion, tradition, relatives, fireworks; Ss. repeat chorally, then individually.", "T. writes the words on the board with their stress patterns."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words from the box (Task B).", "Ss. put the occasions in the right column (Task C).", "Ss. check in pairs; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models one collocation: “We sacrifice a sheep on Eid al-Adha.”", "Ss. match the verbs with the nouns (Task D), then write three sentences about their families with three collocations.", "Ss. read their sentences to a partner; 2–3 Ss. share them with the class."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write 4–5 sentences about their favourite celebration without naming it (Task E).", "Ss. read their descriptions to a partner, who guesses the occasion; 2–3 Ss. read to the class.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u7-l2", "level": "1st BAC", "unit": 7, "unitName": "Celebrations", "unitDir": "Unit 7 - Celebrations", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Functions: Apologising (ECRIF)", "topic": "Apologising", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to recognise the topic of short conversations and use formal and informal expressions to apologise and to accept an apology in situations related to celebrations.", "words": ["I'm so sorry.", "Never mind.", "I apologise for …", "That's all right.", "Please forgive me.", "Don't worry about it.", "Sorry about that.", "Apology accepted.", "It doesn't matter.", "I'm terribly sorry for …", "Forget it.", "It was my fault.", "so", "fault", "for", "Don't", "forgive", "matter"], "point": "Apologise + give a reason: I'm sorry (that) I + past … · I'm sorry for / I apologise for + verb-ing …", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. displays the pictures and asks: “What can go wrong at a party or a wedding? What do you say when you make a mistake?”", "T. writes Ss' ideas on the board.", "Ss. listen to three short conversations and identify the occasion, the topic and the speaker who apologises (Task A).", "T. checks answers."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. listen again and complete what the speakers say (Task B); T. checks answers.", "Ss. put the expressions in the right column (Task C).", "T. clarifies with CCQs: “Which is more formal: ‘Sorry about that’ or ‘I apologise for …’? (I apologise for …) What comes after ‘sorry for’? (verb + -ing)”.", "T. drills stress and falling intonation (Remember box): I'm SO sorry / NEver mind; Ss. repeat chorally, then individually."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the words from the box (Task D).", "Ss. check in pairs, then open pairs act out the dialogue.", "T. corrects on the board and re-drills difficult lines."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1 with a strong student.", "Ss. write a short exchange for each situation (Task E): apology + reason + response, then practise it with a partner.", "2–3 pairs perform; the class says which expressions they used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task F); Ss. role-play the situation without reading from the worksheet, then swap roles.", "2 pairs perform for the class.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u7-l3", "level": "1st BAC", "unit": 7, "unitName": "Celebrations", "unitDir": "Unit 7 - Celebrations", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Reading: Yennayer (PDP)", "topic": "Yennayer", "approach": "PDP", "objective": "By the end of the lesson, students will be able to survey a text and predict its content, guess the meaning of new words from context and reorder the ideas of a text about a traditional celebration.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. asks: “When do we celebrate the Amazigh New Year? What do people eat?”", "T. displays the pictures; Ss. describe them and guess the topic.", "Ss. survey the title, the pictures and the first sentence of each paragraph, then tick three predictions (Task A).", "T. writes some predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the text to check their predictions, then match each paragraph with its main idea (Task B).", "T. ticks or crosses the predictions on the board.", "Ss. read again and put the events of the evening in order (Task C); they underline the time markers that helped them.", "Ss. guess the meaning of the words from context (Task D).", "T. asks: “Which words helped you guess?”", "Ss. read carefully and answer the questions (Task E), including one inference question; Ss. compare in pairs.", "T. corrects and asks Ss. to justify from the text."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. discuss in pairs: compare Yennayer with another celebration in their region (Task F).", "Ss. write 3–4 lines; 2–3 Ss. read their answers to the class.", "T. gives feedback and links to the Writing lesson."]}]}, {"id": "bac-u7-l4", "level": "1st BAC", "unit": 7, "unitName": "Celebrations", "unitDir": "Unit 7 - Celebrations", "no": 4, "dir": "4 Grammar", "skill": "Grammar", "part": "", "label": "Grammar", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Grammar: Relative pronouns & clauses (ECRIF)", "topic": "Relative pronouns & clauses", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the relative pronouns who, which, that, whose, where and when in defining and non-defining relative clauses to describe people, things, places and times related to celebrations.", "words": [], "point": "Defining clause = necessary information, no commas: The guests that came from far away stayed with us. → which guests? that can replace who / which. When the pronoun is the object, we can leave it out: the cake (that) my aunt made.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. displays the pictures and asks: “What's happening? Have you ever been to a henna night?”", "Ss. read Imane's blog and answer the gist questions: “Who got married? How long did the wedding last?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. look at the highlighted words and complete the table (Task A).", "T. elicits the answers and builds the board: who / which / that / whose / where / when.", "T. contrasts two examples: “The guests that came from far away stayed with us.” / “Hamid, who works in Agadir, married Salma.”", "CCQs: “Did all the guests stay with us? (No) Do we need the clause to know who Hamid is? (No)”.", "T. highlights commas, no “that” and no omission in non-defining clauses (Remember box)."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. circle the correct relative pronoun (Task B).", "Ss. decide whether the clauses are defining or non-defining and add commas (Task C).", "Ss. check in pairs; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models sentence 1 on the board.", "Ss. join the sentences with a relative pronoun (Task D), then compare in pairs.", "T. corrects, focusing on the choice of pronoun and on commas."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write definitions of four celebration words with relative clauses, without naming them (Task E).", "Ss. read their definitions to a partner, who guesses the words; 2–3 Ss. read theirs to the class.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "bac-u7-l5", "level": "1st BAC", "unit": 7, "unitName": "Celebrations", "unitDir": "Unit 7 - Celebrations", "no": 5, "dir": "5 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 7 — Writing: A personal letter (Product)", "topic": "A personal letter", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a personal letter to a friend describing a celebration, using the right layout, an informal style and sequencing words.", "words": ["First", "Then", "After that", "Finally", "because", "so"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. asks: “Do you still write letters or long messages to friends? What do you tell them about?”", "Ss. read Imane's letter and answer: “What occasion is she writing about? What does she invite Hiba to do?”", "Ss. label the parts of the letter (Task A); T. checks and draws the layout on the board."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["T. elicits the features of an informal style: contractions, simple greetings and closings, questions to the reader.", "Ss. rewrite the sentences in an informal style (Task B).", "Ss. complete Hiba's sentences with the sequencing words and connectors (Task C).", "T. corrects on the board."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. presents the writing task and the outline.", "Ss. choose a celebration and plan their letter in the table with the sentence starters (Task D).", "Ss. compare their plans in pairs and add details.", "T. monitors and helps with vocabulary, the past simple and relative clauses."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their personal letter using their plan (Task E).", "Ss. check their letters with the checklist, then swap with a partner for a quick check.", "T. collects the letters for marking."]}]}, {"id": "bac-u8-l1", "level": "1st BAC", "unit": 8, "unitName": "Our Cultural Heritage", "unitDir": "Unit 8 - Our Cultural Heritage", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Vocabulary: Arts, crafts & values of Morocco (ECRIF)", "topic": "Arts, crafts & values of Morocco", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use vocabulary related to Morocco's artistic and cultural performances and to Moroccan human values to describe a tradition from their region.", "words": ["perform", "heritage", "potter", "respect", "embroidery", "generosity"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the three pictures (a Gnaoua troupe, a zellige craftsman, mint tea for guests) and asks: “What do these pictures tell us about Morocco?”", "Ss. brainstorm the words they know about Moroccan arts, crafts and traditions.", "Ss. read Salma's school blog and answer: “What did the students see during Heritage Week? What did Mr. Tazi say about values?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the highlighted words with their meanings (Task A).", "T. checks the answers with CCQs: “Is a troupe one person? (No, a group) Does a craftsman use machines? (No, his hands)”.", "T. elicits the values words (hospitality, solidarity, respect, generosity, tolerance) and links each one to an example from the text (guests, twiza, elders, Ramadan).", "T. models and drills word stress: HERitage, CRAFTSman, hospiTALity, soliDARity."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words from the box (Task B).", "Ss. compare their answers; T. corrects on the board and re-drills difficult words."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. presents the suffixes -ity, -ance, -y and -ness with the example hospitable → hospitality.", "Ss. complete the word-building table and check the nouns in a dictionary (Task C).", "Ss. write a sentence with each noun; volunteers read their sentences aloud."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. models a short description of a tradition from his region with the useful language box.", "Ss. write five sentences about an art, a craft or a celebration from their region and the value it shows (Task D).", "Ss. read their sentences to a partner, who guesses the value; volunteers share with the class.", "T. gives delayed feedback on word choice and pronunciation."]}]}, {"id": "bac-u8-l2", "level": "1st BAC", "unit": 8, "unitName": "Our Cultural Heritage", "unitDir": "Unit 8 - Our Cultural Heritage", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Functions: Expressing possibility (ECRIF)", "topic": "Expressing possibility", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to express possibility (may, might, could, perhaps, it's likely that, there's a good chance that) to talk about the future of Moroccan cultural heritage.", "words": ["Perhaps", "likely", "chance", "could", "possible", "might"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “Who is this man? What is zellige? Who is the woman with the microphone?”", "Ss. predict what the craftsman may talk about and tick three ideas (Task A).", "Ss. listen to the interview for the first time and check their predictions (Task A)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. listen again for details and take notes in the table (Task B).", "T. checks the notes with the class.", "Ss. listen again and complete Mr. Benslimane's sentences, then decide if each one shows a stronger or a weaker possibility (Task C).", "T. builds the board from the box “Expressing possibility”: may / might / could + infinitive, perhaps / maybe, it's possible / likely that, there's a (good) chance that, I don't think so.", "CCQs: “Zellige might disappear — is Driss sure? (No) There's a good chance — more or less sure than might? (more)”.", "Pronunciation: might /maɪt/, stress in POSsible and LIKEly, falling intonation; choral and individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue about the Gnaoua Festival with the expressions in the box (Task D).", "T. corrects on the board; two volunteers read the dialogue aloud."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models question 1 with a strong student.", "Ss. answer the questions, expressing possibility in a different way each time (Task E).", "Ss. ask and answer the questions with a partner; 2–3 pairs perform for the class."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task F) and sets the situation: an interview for the school radio “Heritage Voices”.", "Ss. prepare their questions and ideas in the notes lines.", "Ss. role-play the interview without reading, then swap roles.", "Volunteers perform; T. monitors, notes errors and gives delayed feedback (*might to …)."]}]}, {"id": "bac-u8-l3", "level": "1st BAC", "unit": 8, "unitName": "Our Cultural Heritage", "unitDir": "Unit 8 - Our Cultural Heritage", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Reading: Al-Qarawiyyin (PDP)", "topic": "Al-Qarawiyyin", "approach": "PDP", "objective": "By the end of the lesson, students will be able to identify the writer's purpose, scan a text for specific information and put its ideas in chronological order.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["T. asks: “Which is the oldest university in the world? Where is it?” and accepts the guesses without confirming.", "T. pre-teaches key words with pictures and definitions: fortune, scholar, manuscript, restoration, humidity.", "Ss. look at the title and the pictures and tick the ideas they expect to find in the text (Task A)."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the text in two minutes and check their predictions (Task A).", "T. elicits the answers and the words that helped.", "Ss. read again, choose the writer's main purpose and copy the persuasive sentence (Task B).", "T. elicits the clues: dates, facts and numbers = to inform; “a duty for all of us” = to persuade.", "Ss. scan the text and decide if the statements are true or false, justifying from the text (Task C).", "T. checks the answers with paragraph references.", "Ss. underline the dates and time expressions, then number the events in the order they happened (Task D).", "T. corrects on the board as a timeline: inherited fortune → 859 → university → 1981 → 2016."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["T. asks: “Which places in our town are part of our heritage?” and writes the ideas on the board.", "Ss. choose a heritage place near them and write 3–4 sentences: what it is, why it is important and how young people can protect it (Task E).", "Volunteers read their sentences; the class chooses the place they would most like to visit.", "T. links the lesson to the Writing lesson (a biography of a heritage figure)."]}]}, {"id": "bac-u8-l4", "level": "1st BAC", "unit": 8, "unitName": "Our Cultural Heritage", "unitDir": "Unit 8 - Our Cultural Heritage", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Grammar Part 1: Conditionals 0 & 1 (ECRIF)", "topic": "Conditionals 0 & 1", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the zero conditional to state facts and the first conditional to talk about real possibilities in the future, in the context of Moroccan crafts and heritage.", "words": [], "point": "Zero conditional: If + present simple, present simple → facts and general truths (if = when): If you heat clay, it becomes hard.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “Where are they? What does a potter do?”", "T. says: “If you heat ice, it melts. If you work hard, you'll pass.” and asks Ss. what each sentence means.", "Ss. read the dialogue and answer: “What does Mr. Lahlou offer? Why is it important?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the if-sentences in the dialogue and complete the table (Task A).", "T. elicits the form: zero = If + present simple, present simple (facts); first = If + present simple, will / won't + infinitive (a real future possibility); comma when the if-clause comes first; no will in the if-clause.", "CCQs: “If you heat clay, it becomes hard — true every time? (Yes) If you come every Saturday — is Anas coming for sure? (No)”. T. drills I'll and won't."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in brackets in the correct form, deciding between the zero and the first conditional (Task B).", "T. corrects on the board and asks Ss. to explain each choice: a fact or a future possibility?"]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. complete the sentences with their own ideas (Task C).", "Ss. compare their endings with a partner; volunteers read the most original ones to the class."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. models the heritage chain game on the board: “If we clean the old fountain, more visitors will come. If more visitors come, …”", "Ss. continue the chain orally, each student starting with the end of the last sentence, then write their best chain (Task D).", "Groups read their chains aloud; T. gives delayed feedback on common errors (*If it will rain …)."]}]}, {"id": "bac-u8-l5", "level": "1st BAC", "unit": 8, "unitName": "Our Cultural Heritage", "unitDir": "Unit 8 - Our Cultural Heritage", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Grammar Part 2: Phrasal verbs (ECRIF)", "topic": "Phrasal verbs", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to understand and use phrasal verbs (grow up, bring up, take after, set up, give up, carry on, pass down, die out, look after, look forward to), with the right object position, to talk about family heritage.", "words": ["grow up", "set up", "give up", "die out", "look after", "look forward to", "carry on"], "point": "Phrasal verb = verb + particle (up, down, on, after, out …); the meaning is often new: give up ≠ give.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the pictures of a grandmother teaching embroidery and asks: “Who teaches you traditions in your family?”", "Ss. read Salma's text and answer: “Who passed the art down to Salma? Will she give it up?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the highlighted phrasal verbs with their meanings (Task A).", "T. checks the answers with CCQs: “Many girls gave up embroidery — do they still do it? (No) Grandma carried on — did she stop? (No)”.", "T. clarifies the form with the Remember box: verb + particle; separable verbs (pass it down), inseparable verbs (look after it) and verbs with no object (grow up, die out).", "T. drills the stress on the particle: grow UP, give UP, die OUT."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the correct form of a phrasal verb from the box (Task B).", "T. corrects, focusing on the past forms (grew up, set up) and on -ing after look forward to."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models item 1 on the board: passed down his old oud → passed it down.", "Ss. replace the underlined words with a pronoun in the right place (Task C).", "Ss. say whether each verb is separable or inseparable; T. corrects on the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. interview a partner about his / her family heritage with the questions and note the answers (Task D).", "Ss. write a short report, and volunteers present their partner to the class: “Hiba grew up in Taza. She takes after her father …”", "T. gives delayed feedback on pronoun position and verb forms."]}]}, {"id": "bac-u8-l6", "level": "1st BAC", "unit": 8, "unitName": "Our Cultural Heritage", "unitDir": "Unit 8 - Our Cultural Heritage", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 8 — Writing: A biography (Product)", "topic": "A biography", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a one-paragraph biography of a Moroccan heritage figure in chronological order, using the past simple and time expressions.", "words": ["in", "on", "at the age of", "when", "after that", "later", "today"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. shows the pictures and asks: “Do you remember Fatima al-Fihri from the Reading lesson? What did she do?”", "Ss. read the model biography and answer: “Where and when was she born? What did she build? Why is she remembered?”", "Ss. number the parts of the paragraph in the boxes (Task A).", "T. elicits the structure of a paragraph: a topic sentence, supporting sentences in time order and a concluding sentence."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put the sentences of Ben Ali Rbati's biography in the right order and say which words helped them (Task B).", "Ss. complete Lalla Fatna's biography with the time expressions from the box (Task C).", "T. highlights in + year, on + date and at the age of + age."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. read the fact file about Ibn Battuta; T. checks understanding: “Where was he born? Why did he leave Tangier? How long did he travel?”", "Ss. plan their biography by writing notes for each part with the sentence starters (Task D).", "T. elicits a topic sentence and a concluding sentence and writes them on the board.", "Ss. compare their plans and add any missing information."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write the biography of Ibn Battuta in one paragraph of 100–120 words (Task E).", "Ss. revise their paragraph with the checklist and correct their mistakes.", "Volunteers read their paragraph aloud; T. collects the paragraphs for feedback."]}]}, {"id": "bac-u9-l1", "level": "1st BAC", "unit": 9, "unitName": "Human Rights", "unitDir": "Unit 9 - Human Rights", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Vocabulary: Human rights (ECRIF)", "topic": "Human rights", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use key human rights vocabulary (dignity, equality, discrimination, child labour, illiteracy, freedom of speech …) and build word families with the prefixes un-, in-, il- and dis- to talk about rights in their community.", "words": ["equality", "vote", "protect", "disabled", "violates", "tolerance"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. writes “10 December — Human Rights Day” on the board and asks: “What is a right? Name one right every child has.”", "Ss. brainstorm the rights they know; T. builds a mind map on the board.", "T. shows the three pictures and asks: “What problem does each picture show?”", "Ss. read the text about the Dignity Club and answer: “Which rights do the students talk about?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the six words with their meanings (Task A), then compare with a partner.", "T. checks the answers on the board.", "T. clarifies meaning with CCQs: “Is a refugee happy to leave his country? (No) Can an illiterate person read a letter? (No) Is child labour work for adults? (No)”.", "T. drills word stress: DIGnity, discrimiNAtion, refuGEE, iLLIteracy, eQUAlity; Ss. repeat chorally, then individually."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B).", "Ss. check with a partner; volunteers read the sentences aloud and T. corrects."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. writes equal → unequal → inequality on the board and elicits the opposite prefixes un-, in-, il- and dis-.", "Ss. complete the word families (Task C).", "Ss. complete the sentences with the correct form of the word in brackets (Task D).", "T. checks the answers and highlights il- before l (illegal, illiterate)."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write 4–5 sentences about the three rights that matter most to young Moroccans, using at least four new words (Task E).", "Ss. read their sentences to a partner and agree on a class “top three”; volunteers present to the class.", "T. gives delayed feedback on word use and pronunciation."]}]}, {"id": "bac-u9-l2", "level": "1st BAC", "unit": 9, "unitName": "Human Rights", "unitDir": "Unit 9 - Human Rights", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Functions: Expressing hopes and wishes (ECRIF)", "topic": "Expressing hopes and wishes", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to express hopes (I hope, I'm hoping, Let's hope) and wishes (I wish, If only) about human rights issues, and respond to other people's hopes and wishes in a short interview.", "words": ["hope", "wish", "hoping", "Let's hope", "were", "If only", "could"], "point": "Hope = something possible: I hope / I'm hoping / Let's hope / Hopefully + present simple or will → I hope she comes. I hope it will be a success.", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “Human Rights Day is coming. What do you hope for our school? What do you wish you could change in the world?” and writes 2–3 answers on the board.", "T. shows the two pictures; Ss. listen to the song “One Day” and fill in the gaps (Task A).", "Ss. listen again to check and answer: “What does the singer hope for? What does he wish?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find each expression in the song, copy the line and say what comes after it (Task B).", "T. elicits the answers and builds the board: hopes (possible) / wishes (unreal now).", "CCQs: “I wish the world were fair.” Is the world fair now? (No) Is it real? (No) “I hope he passes.” Is it possible? (Yes)", "T. presents the Remember box: I hope + present / will; I wish / If only + past simple, were, could, would; responses (I hope so too. / Let's hope so.)", "Pronunciation: weak form of would /wəd/ and the contraction I'd; Ss. repeat chorally."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the dialogue between Salma and Anas with the expressions in the box (Task C).", "Ss. check with a partner; two pairs read the dialogue aloud and T. corrects."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models situation 1 with a student: “Omar has his driving test tomorrow.” — “I hope he passes!” — “I hope so too.”", "Ss. write a hope or a wish for each situation (Task D), then say them to a partner who responds.", "3–4 Ss. share their sentences; the class says if each one is a hope or a wish and why."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task E); Ss. prepare short notes.", "Ss. role-play the school radio interview, then swap roles.", "Two pairs perform for the class; T. notes errors and gives delayed feedback on the board (*I wish I will … → I hope I will …)."]}]}, {"id": "bac-u9-l3", "level": "1st BAC", "unit": 9, "unitName": "Human Rights", "unitDir": "Unit 9 - Human Rights", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Reading: Rights in action (PDP)", "topic": "Rights in action", "approach": "PDP", "objective": "By the end of the lesson, students will be able to identify specific information in a text about four human rights stories and associate pictures with the right paragraphs.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “What is a right? Which rights do some children in villages lose?”", "T. pre-teaches wheelchair, ramp, drop out, medina, cooperative and literacy class with pictures and mime.", "Ss. look at the title and the four pictures and predict which rights the text talks about (Task A — tick three). T. writes the predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the text in two minutes to check their predictions (Task A). T. asks: “Were you right? Which words helped you?”", "Ss. match each picture with its paragraph and underline the words that helped them (Task B). Feedback with the key words.", "Ss. read carefully and decide if the statements are true or false, justifying with words from the text (Task C). Feedback with the paragraph references.", "Ss. scan the text for numbers, names and places to answer the questions (Task D); volunteers write the answers on the board."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. write 3–4 sentences about the story that touched them most and what young people could do to help (Task E).", "Ss. share their ideas in small groups; each group reports one idea to the class.", "T. links Nadia's story to the Writing lesson (a formal letter to ask for help)."]}]}, {"id": "bac-u9-l4", "level": "1st BAC", "unit": 9, "unitName": "Human Rights", "unitDir": "Unit 9 - Human Rights", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Grammar Part 1: Reported speech (ECRIF)", "topic": "Reported speech", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to report statements, questions and requests in reported speech with the correct tense, pronoun and time changes.", "words": [], "point": "Statements: say (that) / tell + person (that) — the tense goes one step back: present simple → past simple · present continuous → past continuous · present perfect / past simple → past perfect · will → would · can → could · must → had to", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. whispers to a student: “I am tired today.” and asks the class: “What did I say to Yassine?” Ss. guess; T. answers: “I said that I was tired that day.”", "T. shows the two pictures; Ss. read Imane's report and answer: “What did Mr. Alaoui ask the club to do?” (to write to the council again and not to give up)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline the reporting verbs in the report and write Mr. Alaoui's exact words (Task A).", "T. checks the answers and builds the direct → reported table on the board.", "T. clarifies the rules with the Remember box: say / tell; one tense back (have → had, can → could, will → would); questions with if / wh- + subject + verb; requests with told / asked + (not) to; pronoun and time changes.", "CCQs: “Is Mr. Alaoui speaking now? (No) Why couldn't, not can't? (one step back) Can we say ‘He said me’? (No — He told me.)”"]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. report what Nadia, Omar, Fatima, Ms. Benali and Hamza said (Task B).", "Ss. compare answers; volunteers write them on the board and T. corrects tense and pronoun changes."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. report the questions and the requests in the table (Task C).", "T. highlights word order in reported questions (*what did I want → what I wanted) and not to in negative requests.", "Quick oral drill: T. says a direct question or order; Ss. report it aloud."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. ask a partner three questions about human rights at school, using the useful questions, and note the answers (Task D).", "Ss. write four reported sentences, then report their partner's answers to the class: “I asked Yassine if … . He told me that … .”", "T. gives delayed feedback on common errors."]}]}, {"id": "bac-u9-l5", "level": "1st BAC", "unit": 9, "unitName": "Human Rights", "unitDir": "Unit 9 - Human Rights", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Grammar Part 2: Conditional 2 (ECRIF)", "topic": "Conditional 2", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use the second conditional (If + past simple, would / could + base verb) to talk about imaginary situations and solutions to human rights problems.", "words": [], "point": "were with all persons: If I were / If she were … · a comma when the if-clause comes first · would → 'd · would not → wouldn't", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. asks: “Imagine you were the mayor of our town for one day. What would you change?” and writes two answers on the board.", "T. shows the two pictures; Ss. read the Dignity Club's ideas wall and say which idea they like most and why."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. answer the questions about the sentences and copy the verbs (Task A).", "CCQs: “Is Salma the mayor? (No) Is it real or imaginary? (imaginary) Is it about the past? (No, now)”", "Ss. complete the rule; T. clarifies: If + past simple, would / could + base verb; were with all persons; a comma when the if-clause comes first.", "T. contrasts conditional 1 (possible) and conditional 2 (imaginary) and drills I'd / wouldn't."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. put the verbs in brackets in the correct form (Task B).", "Ss. check with a partner; T. corrects on the board, focusing on question order in sentence 5."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. rewrite each real situation as an imaginary one with If … (Task C), changing positive ↔ negative.", "T. checks the answers and links to the Functions lesson: “I wish the school were closer.” → “If the school were closer, Nadia wouldn't miss classes.”"]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. pick a card, answer it, then ask their partner the other questions (Task D).", "Ss. write their answers and one of their partner's; volunteers report to the class.", "T. gives delayed feedback on common errors (*If I would be … → If I were …)."]}]}, {"id": "bac-u9-l6", "level": "1st BAC", "unit": 9, "unitName": "Human Rights", "unitDir": "Unit 9 - Human Rights", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 9 — Writing: A formal letter (Product)", "topic": "A formal letter", "approach": "Product", "objective": "By the end of the lesson, students will be able to write a formal letter to ask an official for help with a human rights problem, using the layout, formal expressions and linking words of a formal letter.", "words": ["As a result", "However", "In addition", "because", "Therefore"], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Nadia's story (Reading lesson) and asks: “Who can help Nadia? How can we ask him or her for help?”", "Ss. read Salma's letter and answer: “Who is writing? To whom? Why?”", "Ss. number the parts of the formal letter (Task A); T. checks and labels the layout on the board."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. tick the expressions they can use in a formal letter (Task B); T. elicits the features of a formal letter: no contractions, Dear Sir or Madam, Yours faithfully.", "Ss. complete the sentences with the linking words (Task C); T. checks and clarifies As a result, However, In addition, because and Therefore."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["T. reads the situation (Task D) and elicits ideas: the problem, its results and possible requests.", "Ss. plan their letter in the outline with the sentence starters (Task D), then turn their notes into sentences."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write their formal letter to the Director in the writing frame (Task E).", "Ss. check their letter with the checklist and correct their mistakes; 1–2 Ss. read their letter aloud.", "T. collects the letters for marking with the guide."]}]}, {"id": "cc-u1-l1", "level": "Common Core", "unit": 1, "unitName": "Meeting People", "unitDir": "Unit 1 - Meeting People", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 — Vocabulary: People, Titles & Greetings (ECRIF)", "topic": "People, Titles & Greetings", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to greet people correctly and talk about the people in their life using vocabulary related to friends, relationships, the social environment, names & titles and greetings.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. greets the class formally and one S informally (“Good morning, everyone!” / “Hi, Salma!”) and asks: “Which greeting is for a friend? Which one is for a teacher?”", "T. shows the four pictures; Ss. say who the people are (friends, a teacher, neighbours).", "Ss. read Yasmine's text twice and answer: “Who is Sara? Who is Mr. Alami? Who is Mrs. Idrissi?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. match the words with their meanings (Task A); pair check; T. elicits and confirms.", "T. draws a board table of titles: Mr. (man) · Mrs. (married woman) · Miss (woman not married) · Ms. (any woman) + family name. CCQ: “Can we say ‘Mr. Ali’? (No — Mr. + family name: Mr. Bennani)”.", "T. sorts greetings: formal (Good morning / afternoon / evening) · informal (Hi, Hello) · leaving (Bye, See you, Good night).", "Pronunciation: neighbour /ˈneɪbə/, colleague /ˈkɒliːɡ/, Mrs. /ˈmɪsɪz/ — choral & individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B); pair check; T. corrects.", "Ss. cross out the odd word in each line (Task C) and justify orally: “Hello — it isn't a title.”"]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["In pairs, Ss. join each word with its partner (shake hands, make friends, best friend, say hello, next-door neighbour) and write one sentence for each (Task D).", "T. elicits sentences; volunteers act out “shake hands / say hello”."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Mingle: each S gets a role card (teacher Mr./Mrs. …, neighbour, best friend, new classmate) and greets 4 classmates with the right greeting and title; they say goodbye appropriately.", "Ss. write three sentences about people in their life (Production) and read them to a partner, who checks the title and the greeting."]}]}, {"id": "cc-u1-l2", "level": "Common Core", "unit": 1, "unitName": "Meeting People", "unitDir": "Unit 1 - Meeting People", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 — Functions: Introductions (ECRIF)", "topic": "Introductions", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use expressions to introduce themselves, introduce someone and exchange personal information (name, age, city, phone number) when they meet new classmates.", "words": ["I'm", "My name is", "to meet", "too", "this is", "Where"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. enters and greets the class: “Hello! I'm Mr. Nejjar. What's your name?” and shakes hands with 2–3 Ss.", "T. elicits Ss' answers: “Hello! I'm …”.", "T. displays the two pictures and asks: “Where are they? Do they know each other?”", "Ss. listen to / read the dialogue and answer the gist question: “Who is new at school?” (Adam)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the expressions in the dialogue and write them in the right column (Task A), then compare with a partner.", "T. elicits answers and builds the board: Introducing oneself / Introducing someone / Exchanging personal information.", "CCQs: “Do Hiba and Adam know each other before? (No) When do we say ‘Nice to meet you’? (the first time we meet someone) ‘This is Karim’ — is it about me or another person? (another person)”.", "Form & pronunciation: I'm / name's / what's / he's (contractions); falling intonation in Wh- questions; choral then individual drilling."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogue with the expressions in the box (Task B).", "Ss. check in pairs, then open pairs read the dialogue aloud.", "T. corrects on the board and re-drills difficult lines."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models cue 1 with a strong student.", "Ss. write and practise a short exchange for each situation (Task C), then swap roles.", "2–3 pairs perform; the class says which expression they used."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["T. gives out role cards A and B (Task D). Ss. role-play meeting a new student without looking at the dialogue.", "Pairs join another pair; each S introduces his / her partner: “This is … . He's / She's … .”", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "cc-u1-l3", "level": "Common Core", "unit": 1, "unitName": "Meeting People", "unitDir": "Unit 1 - Meeting People", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 — Reading: A New Pen Friend (PDP)", "topic": "A New Pen Friend", "approach": "PDP", "objective": "By the end of the lesson, students will be able to show understanding of the text “Hello from Morocco!” by identifying specific details about the writer and her friends.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “Do you have a friend in another city or country? How do you talk to him / her?”", "T. pre-teaches pen friend, kind, funny, strict with pictures and mime.", "Ss. look at the title and the four pictures and predict what the text is about (Task A — tick one option). T. writes the class predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. skim the letter to check their predictions (Task A). T. asks: “Was your prediction right? Which words helped you?”", "Ss. read carefully and decide if the statements are true or false, justifying with words from the text (Task B). Pair check; feedback with the lines.", "Ss. scan the text to answer the detail questions (Task C); volunteers write the answers on the board."]}, {"mark": "3", "name": "Post-reading", "min": 15, "max": 15, "steps": ["Ss. answer Nour's three questions about themselves (Task D).", "Ss. read their answers to a partner; 2–3 Ss. read to the class."]}]}, {"id": "cc-u1-l4", "level": "Common Core", "unit": 1, "unitName": "Meeting People", "unitDir": "Unit 1 - Meeting People", "no": 4, "dir": "4 Grammar - Part 1", "skill": "Grammar", "part": "Part 1", "label": "Grammar - Part 1", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 — Grammar: the verb be (ECRIF)", "topic": "the verb be", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to talk about themselves and their classmates (name, age, origin, class) using the verb be in the present simple — affirmative, negative and interrogative forms — in a “Two truths and a lie” game.", "words": [], "point": "I → am · he / she / it → is · you / we / they → are · Question: be first → Are you new?", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. points and says: “I'm your teacher. You are students. Is Yassine here today? — Yes, he is.” and asks 2–3 Ss similar questions.", "Ss. read the dialogue and answer: “Is Hicham new? Are Amine and Hamza brothers? Is the library open?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. underline every form of be in the dialogue and complete the table (Task A) in pairs.", "T. elicits the table and clarifies the form: I + am · he / she / it + is · you / we / they + are; contractions ('m, 's, 're); negative with not (isn't, aren't, but I'm not); questions by inversion (Are you …?); short answers without contraction (Yes, I am).", "CCQs: “Ali and Omar — is or are? Can we say ‘Yes, I'm’? (No)”. Drill contractions and rising intonation in Yes / No questions."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with am, is or are — affirmative (✓) or negative (✗) (Task B).", "Pair check; T. corrects on the board."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. make each sentence negative, then write the Yes / No question and a short answer (Task C).", "Ss. ask and answer the questions in pairs, changing the names to classmates' names."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["“Two truths and a lie”: Ss. write three sentences about themselves — two true, one false (Task D).", "Partners ask Yes / No questions (“Are you from …? Is your best friend …?”) to find the lie.", "Volunteers report to the class: “Salma isn't from Fez. She's from Meknes.”", "T. gives delayed feedback on common errors (*He from …, *Yes, I'm)."]}]}, {"id": "cc-u1-l5", "level": "Common Core", "unit": 1, "unitName": "Meeting People", "unitDir": "Unit 1 - Meeting People", "no": 5, "dir": "5 Grammar - Part 2", "skill": "Grammar", "part": "Part 2", "label": "Grammar - Part 2", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 — Grammar: plural nouns (ECRIF)", "topic": "plural nouns", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to describe their class and their neighbourhood using regular and irregular plural nouns in an “Our class in numbers” survey.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. points: “One boy … two boys. One girl … three girls. One teacher … how many teachers do you have?”", "Ss. read Rania's text “My building” and answer: “How many families are there? What pets are there?”"]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. find the plural of each noun in the text and complete the rule table with one more example (Task A).", "T. elicits the rules: +s · +es after s, ss, sh, ch, x, o · consonant + y → ies but vowel + y → s · f / fe → ves · irregular (men, women, children, people, feet, teeth, mice).", "CCQs: “Baby → babies; boy → boys. Why different? (vowel before y)”. Pronunciation: /s/ books · /z/ friends · /ɪz/ classes — Ss. sort the words in the sound box."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. write the plural of twelve nouns (Task B); race in pairs, then check with the rule table.", "T. corrects; quick-fire oral drill (T. says the singular, Ss. say the plural)."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["Ss. rewrite the sentences in the plural, changing the noun and the verb be (Task C) — “My friend is from Fez.” → “My friends are from Fez.”", "Pair check; volunteers write answers on the board."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["“Our class in numbers”: in groups of 4, Ss. count and write four sentences about the class and their street (Task D): “There are 16 boys and 14 girls. There are two women in my family.”", "Each group reads its sentences; other groups check the numbers and the plurals.", "T. gives delayed feedback (*childs, *peoples, *familys)."]}]}, {"id": "cc-u1-l6", "level": "Common Core", "unit": 1, "unitName": "Meeting People", "unitDir": "Unit 1 - Meeting People", "no": 6, "dir": "6 Writing", "skill": "Writing", "part": "", "label": "Writing", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 1 — Writing: A letter to a pen friend (Product)", "topic": "A letter to a pen friend", "approach": "Product", "objective": "By the end of the lesson, students will be able to produce an informal letter to a new pen friend about themselves and their friends, using the verb be, personal-information vocabulary and the layout of a letter.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Model / Familiarization", "min": 10, "max": 10, "steps": ["T. reminds Ss of Nour's letter (Reading lesson): “Who is Emma? What does Nour ask her?”", "Ss. read Emma's reply and answer: “How old is Emma? Who is her best friend?”", "Ss. label the seven parts of the letter (Task A); T. checks and highlights the fixed phrases: Dear …, · Thank you for your letter. · Please write back soon. · Best wishes, + name."]}, {"mark": "2", "name": "Controlled Practice", "min": 12, "max": 12, "steps": ["Ss. put the parts of Sami's letter in the right order (Task B); pair check.", "Ss. rewrite the lines with capital letters, commas, apostrophes and question marks (Task C)."]}, {"mark": "3", "name": "Guided Writing", "min": 18, "max": 18, "steps": ["Ss. plan their letter to Emma in the outline (Task D): about me · my school · my friends · my questions — notes only.", "Ss. turn the notes into sentences with the sentence starters (I'm … / My best friend is … . She's …), then compare with a partner. T. monitors and helps."]}, {"mark": "4", "name": "Free Writing", "min": 15, "max": 15, "steps": ["Ss. write the full letter (60–80 words) in the letter frame (Task E).", "Ss. check their letter with the self-assessment checklist and correct it. T. collects the letters for written feedback."]}]}, {"id": "cc-u2-l1", "level": "Common Core", "unit": 2, "unitName": "What & How I Learn", "unitDir": "Unit 2 - What & How I Learn", "no": 1, "dir": "1 Vocabulary", "skill": "Vocabulary", "part": "", "label": "Vocabulary", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 — Vocabulary: School life (ECRIF)", "topic": "School life", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to use words about school rules, timetables and school activities, and common collocations (do homework, take notes, pass an exam, join a club, make mistakes) to talk about their school life.", "words": ["school rules", "on time", "club", "team", "absent", "homework", "notes", "an exam", "a club", "mistakes", "exercises", "a test", "the school team", "progress", "a break", "friends", "a photo", "do", "take", "pass", "join", "make"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the pictures (a timetable, students in uniform, the basketball team) and asks: “Where are these students? What do you see on a school timetable?”", "Ss. guess and give words they know.", "Ss. read Salma's text twice and answer the gist question: “What does Salma do after school?” (reading club, basketball team, homework)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["T. clarifies the highlighted words with the pictures, mime and examples; Ss. match each word with its meaning (Task A).", "T. checks the answers and asks CCQs: “Can you use your phone in class? (No, it's forbidden.) Is the break a lesson? (No.)”", "T. presents collocations: do homework, take notes, pass an exam, join a club, make mistakes.", "Ss. put the words in the right column (Task C).", "T. drills stress: TIMEtable, SUBject, UNIform, forBIDden, reVISE."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the sentences with the words in the box (Task B).", "Ss. complete the sentences with do, take, pass, join or make (Task D).", "T. corrects on the board; Ss. read the sentences aloud."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models one answer: “My favourite subject is English.”", "Ss. answer the questions about their own school with the new words (Task E).", "Ss. ask and answer the questions with a partner; T. invites a few Ss. to share."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. write five sentences about their school life: timetable, two rules, an activity and two collocations (Task F).", "Ss. read their sentences to a partner, who checks the collocations.", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "cc-u2-l2", "level": "Common Core", "unit": 2, "unitName": "What & How I Learn", "unitDir": "Unit 2 - What & How I Learn", "no": 2, "dir": "2 Functions", "skill": "Functions", "part": "", "label": "Functions", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 — Functions: Interest & preference (ECRIF)", "topic": "Interest & preference", "approach": "ECRIF", "objective": "By the end of the lesson, students will be able to express interest (That's a good idea! / That sounds interesting!) and preference (I prefer … / I'd rather … / I like … better than …) when talking about school activities, and pronounce /θ/ and /ð/ correctly.", "words": ["good idea", "rather", "sounds", "prefer"], "point": "", "minutes": [55, 55], "stages": [{"mark": "E", "name": "Encounter", "min": 8, "max": 8, "steps": ["T. shows the two pictures and asks: “What clubs are there in our school? Which club do you like?”", "T. sets the context: Salma and Mehdi choose a school club on Clubs' Day.", "Ss. read the short dialogue silently once and complete the table with the day, time and place of each club (Task A).", "Ss. say which club Salma and Mehdi choose (the environment club)."]}, {"mark": "C", "name": "Clarify", "min": 12, "max": 12, "steps": ["Ss. read it again and tick the expressions they find (Task B).", "Ss. put the expressions in the right column: interest or preference, then add one more to each (Task C).", "T. clarifies form and use: I prefer + noun, I'd rather + verb, I like A better than B; CCQs: “Is ‘I'd rather work outside’ Salma's first choice? (Yes)”.", "Ss. repeat words with /θ/ and /ð/ after T. and classify them (Task D); T. drills the expressions with natural intonation."]}, {"mark": "R", "name": "Remember", "min": 10, "max": 10, "steps": ["Ss. complete the mini-dialogues with the correct expression (Task E).", "T. checks the answers; Ss. read the mini-dialogues aloud with a partner."]}, {"mark": "I", "name": "Internalize", "min": 12, "max": 12, "steps": ["T. models item 1 with a student: “Let's join the school choir!” — “That sounds great!”", "Ss. answer each suggestion, showing interest or saying what they prefer (Task F), then practise the exchanges orally.", "T. invites a few Ss. to perform."]}, {"mark": "F", "name": "Fluently Use", "min": 13, "max": 13, "steps": ["Ss. use role cards A and B to plan their Clubs' Day: suggest activities, show interest, express preferences and decide together (Task G).", "Ss. tell the class their choice: “We'd rather organise a reading competition because …”", "T. monitors, notes errors and gives delayed feedback on the board."]}]}, {"id": "cc-u2-l3", "level": "Common Core", "unit": 2, "unitName": "What & How I Learn", "unitDir": "Unit 2 - What & How I Learn", "no": 3, "dir": "3 Reading", "skill": "Reading", "part": "", "label": "Reading", "plan": "Lesson Plan.html", "ws": "Worksheet.html", "flags": [], "title": "Unit 2 — Reading: A letter from Meknes (PDP)", "topic": "A letter from Meknes", "approach": "PDP", "objective": "By the end of the lesson, students will be able to scan a letter about school life to find specific information (numbers, names, days, times and places) quickly and accurately.", "words": [], "point": "", "minutes": [55, 55], "stages": [{"mark": "1", "name": "Pre-reading", "min": 10, "max": 10, "steps": ["Warm-up: T. asks “How many students are there in our school? What time does our school day start? What's your favourite subject?”", "T. pre-teaches cousin, strict, member and plant trees with the pictures and mime.", "Ss. look at the pictures and the layout of the text, then tick who writes it and to whom (Task A).", "T. collects the predictions on the board."]}, {"mark": "2", "name": "During-reading", "min": 30, "max": 30, "steps": ["Ss. check their prediction quickly (Task A): a letter from Salma to her cousin Yassine.", "T. presents the “How to scan” steps: decide what you need (number, name, day, time, place), move your eyes quickly, stop and read the sentence.", "Scanning race: Ss. find the answers to the five questions in two minutes and underline them in the text (Task B).", "Ss. compare their answers; T. checks them on the board and asks “Which word helped you find it?”", "Ss. decide if the statements are true or false and justify with words from the text (Task C).", "T. gives feedback with the line references."]}, {"mark": "3", "na
